# mkdocs-material site for mod authors.
#   scripts/build-mod-docs.sh            build (also the `mod_docs` CMake target)
#   scripts/build-mod-docs.sh --serve    live preview
# reference/ pages are generated by tools/gen_mod_docs.py from the API
# header, the manifests and mods/*/mod.toml; edit those sources.

site_name: openpete modding
site_description: Documentation for openpete mod authors, generated from the SDK that mods compile against.
docs_dir: pages
use_directory_urls: false

theme:
  name: material
  font: false   # no Google-Fonts CDN: the site renders fully offline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.keys

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Manifest: manifest.md
  - Code mods: code.md
  - Assets:
      - Textures and music: assets.md
      - Sounds: sounds.md
      - Custom levels: levels.md
  - Shaders: shaders.md
  - Publishing: publishing.md
  - Reference:
      - API: reference/api.md
      - Functions: reference/functions.md
      - Globals: reference/globals.md
      - Game structs: reference/structs.md
      - CPUState: reference/cpustate.md
      - Examples: reference/gallery.md
