# mkdocs-material site for mod authors. Build via
#   scripts/build-mod-docs.sh          (or the `mod_docs` CMake target)
# Live preview:
#   scripts/build-mod-docs.sh --serve
# The reference/ pages are GENERATED by tools/gen_mod_docs.py — edit
# the extraction sources (api header, manifests, mod.tomls), never the
# output.

site_name: openpete modding
site_description: Documentation for openpete mod authors, generated from the SDK that mods compile against.
docs_dir: pages
use_directory_urls: false

theme:
  name: material
  font: false   # no Google-Fonts CDN: the site renders fully offline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.keys

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Manifest and config: manifest.md
  - Shaders: shaders.md
  - Reference:
      - API: reference/api.md
      - Functions: reference/functions.md
      - Globals: reference/globals.md
      - Game structs: reference/structs.md
      - Example gallery: reference/gallery.md
