# mkdocs-material site for mod authors.
#   scripts/build-mod-docs.sh            build (also the `mod_docs` CMake target)
#   scripts/build-mod-docs.sh --serve    live preview
# imgui.md and the reference/ pages are generated by tools/gen_mod_docs.py
# from the API
# header, the manifests and mods/*/mod.toml; edit those sources.

site_name: openpete modding
site_description: Documentation for openpete mod authors, generated from the SDK that mods compile against.
docs_dir: pages
use_directory_urls: false

theme:
  name: material
  font: false # no Google-Fonts CDN: the site renders fully offline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.integrate

# The SDK ships this site as static files opened from disk. Under file://
# the material bundle loads search/search_index.js, which only the offline
# plugin emits; without it the bundle aborts before mounting the sidebar,
# leaving the nav unsized and clipped at the bottom of the window.
plugins:
  - search
  - offline

# The offline plugin's search worker shim, vendored: the plugin only points at
# unpkg.com when no polyfill path contains "iframe-worker".
extra:
  polyfills:
    - assets/javascripts/iframe-worker-shim.js

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys

# Anchor links are info-level by default, so a stale #section target would
# survive --strict. The generated pages link into each other by anchor.
validation:
  anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Manifest: manifest.md
  - Code mods: code.md
  - ImGui: imgui.md
  - Assets:
      - Textures: textures.md
      - Music: music.md
      - Sounds: sounds.md
      - Custom levels: levels.md
  - Shaders: shaders.md
  - Iteration and testing: testing-and-iteration.md
  - Publishing: publishing.md
  - Glossary: glossary.md
  - Reference:
      - API: reference/api.md
      - CPUState: reference/cpustate.md
      - Examples: reference/examples.md
      - Spyro 1:
          - Functions: reference/spyro-1/functions.md
          - Globals: reference/spyro-1/globals.md
          - Game structs: reference/spyro-1/structs.md
      - Spyro 2:
          - Functions: reference/spyro-2/functions.md
          - Globals: reference/spyro-2/globals.md
          - Game structs: reference/spyro-2/structs.md
      - Spyro 3:
          - Functions: reference/spyro-3/functions.md
          - Globals: reference/spyro-3/globals.md
          - Game structs: reference/spyro-3/structs.md
