# Preview config for the openpete documentation site (User, Modding,
# Developer, Spyro). No CMake target or packaging step reads it.
#   mkdocs serve -f docs/mkdocs.yml            live preview
#   mkdocs build --strict -f docs/mkdocs.yml   build to build/docs-site/
# Run `python3 tools/gen_code_docs.py` (or the `code_docs` CMake target)
# first: it writes developer/reference/, which the nav names and git ignores.
# Modding is a navigation link to the published site; its source stays
# under docs/modding/ with its own mkdocs.yml.

site_name: openpete
site_description: Documentation for openpete, the PC port of Spyro the Dragon.
docs_dir: src
site_dir: ../build/docs-site
use_directory_urls: false
# The docs map is an input of the docs tooling, not a page.
exclude_docs: |
  user/pages.toml
# The generated reference links its pages from its own index.
not_in_nav: |
  /developer/reference/**

theme:
  name: material
  font: false # no Google-Fonts CDN: the site renders fully offline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

# Opened from disk (file://), the material bundle loads
# search/search_index.js, which only the offline plugin emits.
plugins:
  - search
  - offline

# The offline plugin's search worker shim, vendored (a symlink to the
# modding site's copy): the plugin points at unpkg.com only when no
# polyfill path contains "iframe-worker".
extra:
  polyfills:
    - assets/javascripts/iframe-worker-shim.js

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys

# Anchor links are info-level by default, so a stale #section target would
# survive --strict.
validation:
  anchors: warn

nav:
  - Home: index.md
  - User:
      - user/index.md
      - Getting started:
          - user/getting-started/requirements.md
          - user/getting-started/install.md
          - user/getting-started/first-run.md
          - user/getting-started/dumping-your-disc.md
      - Playing:
          - user/playing/controls.md
          - user/playing/settings-menu.md
          - user/playing/saves.md
          - user/playing/practice-tools.md
          - user/playing/dev-overlay.md
          - user/playing/recording.md
      - Graphics:
          - user/graphics/display.md
          - user/graphics/smoothness.md
          - user/graphics/quality.md
          - user/graphics/retro-look.md
          - user/graphics/performance.md
      - Customizing:
          - user/customizing/config-file.md
          - user/customizing/key-bindings.md
          - user/customizing/controllers.md
          - user/customizing/audio.md
          - user/customizing/texture-packs.md
          - user/customizing/music-and-sound-packs.md
          - user/customizing/mods.md
      - Games:
          - user/games/spyro-1.md
          - user/games/spyro-2.md
          - user/games/spyro-3.md
      - Help:
          - user/help/troubleshooting.md
          - user/help/reporting-a-bug.md
          - user/help/file-locations.md
          - user/help/glossary.md
  - Modding: https://openpete.com/docs/modding/
  - Developer:
      - developer/README.md
      - Architecture: developer/architecture.md
      - Building: developer/building.md
      - Reference: developer/reference/index.md
      - Unattended runs: developer/unattended-runs.md
      - Recording video: developer/recording-video.md
      - Adding a game: developer/adding-a-game.md
