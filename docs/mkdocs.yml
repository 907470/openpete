# Build config for the openpete documentation site: User, Modding,
# Developer and Spyro sections under src/, one directory each.
#   scripts/build-docs.sh            every section, to build/docs-site/
#   scripts/build-docs.sh --serve    live preview
#   cmake --build --preset <preset> --target docs
#                                    the published sections (User,
#                                    Modding), to build/<preset>/games/
#                                    spyro-1/docs-site/, which every
#                                    package ships as docs/
# Generated pages, written before mkdocs runs and ignored by git:
# modding/reference/ and modding/imgui.md (tools/gen_mod_docs.py),
# developer/reference/ (tools/gen_code_docs.py, the `code_docs` target).
# user/reference/ is generated in memory by ../tools/mkdocs_surface.py.
# OPENPETE_DOCS_SECTIONS (comma-separated section names) builds a subset;
# ../tools/mkdocs_sections.py applies it.

site_name: openpete
site_description: Documentation for openpete, the PC port of Spyro the Dragon.
docs_dir: src
site_dir: ../build/docs-site
use_directory_urls: false
# The docs map is an input of the docs tooling, not a page.
exclude_docs: |
  user/pages.toml
# The generated codebase reference links its pages from its own index.
not_in_nav: |
  /developer/reference/**

theme:
  name: material
  font: false # no Google-Fonts CDN: the site renders fully offline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

# The packages ship this site as static files opened from disk. Under
# file:// the material bundle loads search/search_index.js, which only the
# offline plugin emits; without it the bundle aborts before mounting the
# sidebar, leaving the nav unsized and clipped at the bottom of the window.
# Search is English only: the search worker then loads no file from
# assets/javascripts/lunr/, which scripts/package-dist.sh deletes from every
# package, and scripts/dist_compliance.py docs refuses another language.
plugins:
  - search:
      lang: en
  - offline

# mkdocs_surface.py expands the surface macros of the User pages from
# packaging/surface/<game>.json and adds the generated user/reference/
# pages; it runs first so mkdocs_sections.py drops those pages from a build
# without the user section.
hooks:
  - ../tools/mkdocs_surface.py
  - ../tools/mkdocs_sections.py

extra:
  # The offline plugin's search worker shim, vendored with its licence in
  # src/assets/javascripts/: the plugin points at unpkg.com only when no
  # polyfill path contains "iframe-worker".
  polyfills:
    - assets/javascripts/iframe-worker-shim.js
  # A link into a section a subset build leaves out becomes an absolute
  # URL under published_url when the section is listed in
  # published_sections, and plain text otherwise.
  published_url: https://openpete.com/docs/
  published_sections: [user, modding]

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  # Includes a tracked file into a page (`--8<-- "<path>"`), resolved from
  # the repository root, where scripts/build-docs.sh runs mkdocs; a missing
  # file fails the build.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

# Anchor links are info-level by default, so a stale #section target would
# survive --strict. The generated pages link into each other by anchor.
validation:
  anchors: warn

nav:
  - Home: index.md
  - User:
      - user/index.md
      - Getting started:
          - user/getting-started/requirements.md
          - user/getting-started/install.md
