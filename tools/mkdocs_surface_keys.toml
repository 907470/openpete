# SDL key name -> pymdownx.keys name, for the key() surface macro
# (tools/surface_macros.py). The binding strings of the surface baseline are
# SDL names (SDL_GetKeyName spelling, compared case-insensitively); the
# right side is the spelling the User pages write inside ++...++, an alias
# pymdownx.keys accepts. A binding naming a key absent here fails the docs
# build.

