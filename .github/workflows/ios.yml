name: iOS build (experimental)

# First milestone: configure and build the engine libraries for iOS arm64 on a
# GitHub-hosted Mac. No game is built (-DOPENPETE_GAMES=): the recompiled game
# C is generated from the PSYQ SDK headers and a disc dump, which are your own
# copies and must never be committed to a public repository.

on:
  workflow_dispatch:
  push:
    branches: [ios-port, ios-port-oct]

jobs:
  engine:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # The project's fence scripts refuse a clone whose git hooks are not
      # armed; this is the documented escape (docs/src/developer/building.md),
      # which the project's own container builds also set.
      OPENPETE_NO_COMMITS: "1"
    defaults:
      run:
        # pipefail: without it `cmake ... | tee log` reports tee's exit status
        # and a failed configure shows as a green step.
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Arm the repo's git hooks (the fences check for this)
        run: git config core.hooksPath githooks

      - name: Init only the submodules the configure reads
        run: |
          git submodule update --init --depth 1 -- \
            third_party/SDL third_party/glslang third_party/imgui third_party/PsyCross
          git submodule update --init --recursive --depth 1 -- third_party/PsyCross

      - name: Host tools
        run: |
          brew install cmake python glslang spirv-tools
          cmake --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Python for the build fences
        run: |
          # The fence scripts run plain `python3` and need tomllib (3.11+).
          # Xcode's own python3 is 3.9, so put Homebrew's first on PATH and
          # give the system one tomli as a fallback.
          PYBIN="$(brew --prefix python)/bin"
          ls "$PYBIN" | head -20
          echo "$PYBIN" >> "$GITHUB_PATH"
          /usr/bin/python3 -m pip install --user --quiet tomli || true
          "$PYBIN/python3" --version
          "$PYBIN/python3" -c "import tomllib; print('tomllib ok')"
          /usr/bin/python3 --version

      - name: Configure (iOS arm64, engine only)
        run: |
          cmake --preset ios-arm64 -DOPENPETE_GAMES= 2>&1 | tee configure.log

      - name: Build
        run: |
          which python3; python3 --version
          cmake --build build/ios-arm64 --config Release -- \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-engine-logs
          path: |
            configure.log
            build.log
            build/ios-arm64/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
