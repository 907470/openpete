name: iOS build (experimental)

# First milestone: configure and build the engine libraries for iOS arm64 on a
# GitHub-hosted Mac. No game is built (-DOPENPETE_GAMES=): the recompiled game
# C is generated from the PSYQ SDK headers and a disc dump, which are your own
# copies and must never be committed to a public repository.

on:
  workflow_dispatch:
  push:
    branches: [ios-port, ios-port-oct]

jobs:
  engine:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # The project's fence scripts refuse a clone whose git hooks are not
      # armed; this is the documented escape (docs/src/developer/building.md),
      # which the project's own container builds also set.
      OPENPETE_NO_COMMITS: "1"
    defaults:
      run:
        # pipefail: without it `cmake ... | tee log` reports tee's exit status
        # and a failed configure shows as a green step.
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Arm the repo's git hooks (the fences check for this)
        run: git config core.hooksPath githooks

      - name: Init only the submodules the configure reads
        run: |
          git submodule update --init --depth 1 -- \
            third_party/SDL third_party/glslang third_party/imgui third_party/PsyCross
          git submodule update --init --recursive --depth 1 -- third_party/PsyCross

      - name: Host tools
        run: |
          brew install cmake python glslang spirv-tools
          cmake --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Python for the build fences
        run: |
          # The fence scripts run plain `python3` and need tomllib (3.11+).
          # Xcode's own python3 is 3.9, so put Homebrew's first on PATH and
          # give the system one tomli as a fallback.
          PYBIN="$(brew --prefix python)/bin"
          ls "$PYBIN" | head -20
          echo "$PYBIN" >> "$GITHUB_PATH"
          /usr/bin/python3 -m pip install --user --quiet tomli || true
          "$PYBIN/python3" --version
          "$PYBIN/python3" -c "import tomllib; print('tomllib ok')"
          /usr/bin/python3 --version

      - name: Fetch MoltenVK (iOS) and inspect the release
        # Informational for now: the engine loads MoltenVK at run time
        # (dlopen through SDL), so nothing links against it yet. The app target
        # will embed MoltenVK.framework from this release.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MOLTENVK_VERSION: v1.4.2
        run: |
          mkdir -p mvk && cd mvk
          gh release view "$MOLTENVK_VERSION" --repo KhronosGroup/MoltenVK \
            --json assets -q '.assets[] | "\(.name)  \(.size)"'
          gh release download "$MOLTENVK_VERSION" --repo KhronosGroup/MoltenVK \
            --pattern '*ios*'
          ls -la
          for t in *.tar; do tar xf "$t"; done
          find . -maxdepth 6 -name '*.xcframework' -o -maxdepth 6 -name 'Info.plist' -path '*MoltenVK*' | head -20
          find . -path '*dynamic*' -name MoltenVK -type f | head
          for f in $(find . -path '*ios-arm64/*' -name MoltenVK -type f | head -3); do
            echo "== $f"; lipo -info "$f" || true; file "$f" || true
          done

      - name: Configure (iOS arm64, engine only)
        run: |
          MVK="$(find "$PWD/mvk" -path '*dynamic*ios-arm64/MoltenVK.framework' -type d | head -1)"
          echo "MoltenVK framework: $MVK"
          cmake --preset ios-arm64 -DOPENPETE_GAMES= \
            -DOPENPETE_MOLTENVK_FRAMEWORK="$MVK" 2>&1 | tee configure.log

      - name: Build
        run: |
          which python3; python3 --version
          # Library targets only, not ALL: ALL also runs the repo's lint fences,
          # and some (vstream_sites) need generated game C that this
          # engine-only job does not have. psycross_static and SDL3 come in as
          # dependencies of openpete_core.
          cmake --build build/ios-arm64 --config Release \
            --target openpete_core openpete_rhi openpete_imgui rhi_smoketest -- \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Package the unsigned app
        run: |
          APP="$(find build/ios-arm64 -name 'rhi_smoketest.app' -type d | head -1)"
          echo "app: $APP"
          ls -la "$APP" "$APP/Frameworks" || true
          plutil -p "$APP/Info.plist"
          mkdir -p dist && ditto -c -k --keepParent "$APP" dist/OpenPeteRHI-unsigned.app.zip

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: ios-rhi-app-unsigned
          path: dist/OpenPeteRHI-unsigned.app.zip

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-engine-logs
          path: |
            configure.log
            build.log
            build/ios-arm64/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
