# gameplay_state_regions.toml — addresses whose divergence between
# presentation modes is a determinism failure.
#
# This manifest is the contract underpinning the "1:1 with PSX
# hardware" North Star. The aspect_determinism CTest gate hashes
# these regions per-frame and asserts byte-identity across
# presentation settings. Anything OUTSIDE these regions is
# presentation scratch (OT, prim buffers, render-side caches) and is
# excluded from the gate.
#
# Address sources:
#   - games/spyro-1/spyro-1/build/psx.map   (linker-resolved globals)
#   - games/spyro-1/spyro-1/include/*.h      (struct sizes)
#   - bisect findings (notes/plans/openpete-presentation-decoupling.md)
#
# Editing rules:
#   - PRs that touch presentation surface and add a new region MUST
#     justify why it's gameplay-state and not presentation scratch.
#   - PRs that REMOVE or SHRINK a region must demonstrate (via the
#     harness) that no real coupling lives in the removed bytes.
#   - When the decomp progresses and a struct's exact size becomes
#     known, tighten the corresponding `length` field.

# ─── Singletons in the main EXE's .bss/.sbss ──────────────────────────
# Verified addresses from psx.map / nm output 2026-05-03.

[[region]]
name        = "g_HudMobys"
start       = 0x80075710
length      = 0x4
description = "Pointer to HUD-moby pool (gem counters, life icons, etc.)"

[[region]]
name        = "g_GameTick"
