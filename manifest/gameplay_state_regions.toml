start       = 0x8007573C
length      = 0x4
description = "Bump allocator cursor for dynamic moby spawns"

[[region]]
name        = "g_KeyMoby"
start       = 0x80075758
length      = 0x4
description = "Pointer to current key moby (gates inventory)"

[[region]]
name        = "g_UnprocessedFrames"
start       = 0x80075760
