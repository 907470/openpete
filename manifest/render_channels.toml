[[channel]]
name        = "no_lod_moby_render_distance_saturate"
status      = "gated"
description = """
Phase 8: per-moby render distance saturation. r_moby.s reads the
packed m_Renderer half-word at offset 0x50 of the moby struct via
`lhu $a0, 0x50($fp)` at PC 0x80022B20. The half-word lays out as:
  byte 0x50 low 7 bits : m_Distance      (authored 7-bit draw range)
  byte 0x50 bit 7      : m_ShinyRenderer (routes to shiny path via
                                          bltz at PC 0x80022B38)
  byte 0x51            : m_RenderRadius  (bbox half-extent, used
                                          downstream for cull math)

Downstream the m_Distance field is shifted into bits 8..14 and
serves as the per-axis box-cull threshold at PCs 0x80022B48..
0x80022B90: a moby is rejected when |camera_delta / 4| >=
(m_Distance << 8), i.e. roughly when world-axis distance from
camera exceeds 4 * (m_Distance << 8) units. Authored defaults
of m_Distance == 16 give ~16 K-unit cutoff — a tenth of the
in-group env cull radius. Distant mobys are dropped before the
cone test (Phase 7) gets a chance to see them.

Under --no-lod this channel forces the m_Distance bits to 0x7F
(max 7-bit value), preserving the shiny flag and the high byte
(m_SpecularMetalColor[0], used as a +0x200 cull bias via its LSB
on non-shiny mobys and zeroed by the immediately following
`sb $zero, 0x51($fp)`). Threshold rises to ~130 K units, matching
the saturated env cull radius (Phase 6.B).

CRITICAL: only bump mobys whose current m_Distance is non-zero.
m_Distance == 0 is the "uninitialized / disabled moby slot"
sentinel — forcing it to 0x7F admits stale moby memory into the
renderer and hangs during the post-level-load fade-in (verified
empirically: any bump on zero-distance mobys hangs at frame ~3457
in the demo's level_11 transition).

Sites (all three moby render paths in r_moby.s):
