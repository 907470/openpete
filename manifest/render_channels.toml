[[channel]]
name        = "widescreen_ui_moby_tag"
status      = "gated"
description = """
Per-moby UI classification + transform-interp identity hook.

TWO SEPARATE host-side channels are fed from these sites — they
answer two different questions and must never be conflated:
  * openpete_ui_moby (s_current) — "is the object being projected a
    HUD/UI element?" Narrow: only the shaded renderer carries HUD/
    text mobys, so ONLY the shaded site feeds it. Consumed by
    widescreen_eff_ofx (centring vs Hor+ widening).
  * openpete_obj_id — "which logical object produced this span?"
    Broad: every per-object render path feeds it. Consumed only by
    the render-cache obj_tag emit (transform-interp matcher).
(They were briefly merged onto s_current, which let g_Spyro /
g_Cyclorama / popped gameplay-moby vaddrs get range-tested by
is_current_ui() and mis-classified as UI — breaking Hor+ widening
for any object whose address fell in the polybuf/HUD range. See
core/include/openpete_obj_id.h.)

r_moby.s has three render functions; the per-moby loop iteration
boundary of each gets a hook:

  0x80022B08  func_80022A2C (shaded moby loop) lw $s8,0($ra)
              → ui_moby_set_current($fp) + obj_id_set($fp)   [BOTH]
  0x80023B0C  func_80023AC4 (Spyro)            lw $fp,0($fp)
              → obj_id_set($ra=g_Spyro)                      [identity only]
  0x8004F088  func_8004F000 (cyclorama)        lw $t3,4($at)
              → obj_id_set($at=g_Cyclorama)                  [identity only]

The shaded-moby hook passes the loaded-into register (the moby
vaddr written by the lw itself); the Spyro and cyclorama hooks pass
the *source* address register — the lw is read-from-singleton-
struct, and that singleton's vaddr is what we want as identity.
(g_Spyro is loaded into $ra by the prologue addiu at 0x80023B00;
g_Cyclorama is loaded into $at by the addiu at 0x8004F078. Both
registers are still live at the hook PC because the lw reads from
them rather than into them.)

Regular (func_8001F798) and specular (func_80020F34) renderers get
their per-instance identity through `openpete_moby_queue`, owned by
the separate `transform_interp_moby_queue` channel below. (Their
render-list slots only carry a class-shared m_Props ptr; the queue
plumbs the real per-instance moby vaddr from func_8001F158's cull
pass to each render-pass iter.)

The obj_id stamp lets `gte_rtps_internal` write the cache entry's
obj_tag with a stable per-object identity so the transform-interp
matcher pairs by real per-object identity across frames (instead of
the heuristic world-ordinal fallback, which broke once PHASE-C
inflated the world-ordinal stream 2.7× and starved the regular/
specular mobys of stable ordinal slots).

The ui_moby stamp (shaded site only) lets widescreen_eff_ofx give UI
mobys a CONSTANT centring shift `eff_OFX = OFX + (factor-1)*256`
instead of the standard widening `eff_OFX = OFX * factor`. Spyro's
HUD render writes EACH icon's screen-X into OFX directly via inline
CTC2 — so the proportional widening spreads icons apart (measured:
PSX-X width 384→514 across 4:3→16:9, ratio = factor); the constant
shift keeps the original 4:3 layout host-centred regardless of OFX.

For non-UI mobys with canonical gameplay OFX (256), both formulas
produce identical eff_OFX, so determinism is unaffected.

The companion `openpete_world_geo_clear()` is appended to every
moby-loop hook (not just the shaded one) so terrain strip tags from
the prior renderer never bleed into moby cache entries."""
# GENERATED (append_call): the per-renderer identity-tag multi-call sequence
# is composed into wrapper hooks in core/runtime/openpete_obj_id.c, so the
# recompiler appends ONE call. moby_loop_tag = ui_moby + obj_id + clear (the
# shaded loop is the only HUD/UI path, operand = the loaded moby vaddr);
# obj_loop_tag = obj_id + clear (singletons pass their source-address reg).
substitution_sites = [
    { addr = 0x80022B08, operand = "rt", kind = "append_call", hook = "openpete_moby_loop_tag" },  # shaded per-moby loop (ui_moby + obj_id)
    { addr = 0x80023B0C, operand = "ra", kind = "append_call", hook = "openpete_obj_loop_tag"  },  # Spyro     renderer ($ra=g_Spyro)
    { addr = 0x8004F088, operand = "at", kind = "append_call", hook = "openpete_obj_loop_tag"  },  # cyclorama renderer ($at=g_Cyclorama)
]
verdict_fn       = "openpete_ui_moby_set_current"
verified_against = ["aspect_determinism"]
state_regions    = []  # render-side classification only
doc              = "notes/plans/openpete-widescreen-fov.md"

[[channel]]
name        = "transform_interp_moby_queue"
status      = "gated"
description = """
Per-instance moby identity FIFO for the regular (func_8001F798) and
specular (func_80020F34) renderers. Their render-list slots only
carry a *class-shared* pointer (likely m_Props / model template);
tagging cache entries with that made the matcher collapse all same-
class instances onto one obj_tag → ordinal-pairing-within-bucket →
visible "blending across the screen" when cull order shifted.

Plumbed via two recompiler substitution sites (3rd layout, 2026-06-09,
transform-interp plan §11 F0 — both prior layouts misassigned):

  0x8001F800  lw $ra, 4($gp)       func_8001F798 (regular render)
  0x80020F9C  lw $ra, 4($gp)       func_80020F34 (specular render)
              — Loop iter top; $gp is the cursor over the 56-byte
                render-queue entries the cull pass committed. Appends
                `openpete_moby_render_entry_tag(cpu->gp)`, which
                reads the per-instance moby vaddr the cull pass
                stored at entry+52 (`sw $sp, 52($fp)` @ 0x8001F4F0 /
                0x80020CA4 — written before the entry's variant
                branches, so EVERY committed entry carries it), tags
                obj_id with it, and clears the world-geo strip tag.
                NOTE: feeds the transform-interp identity channel
                (openpete_obj_id), NOT the widescreen UI classifier —
                regular/specular mobys are never HUD/UI, so they must
                not be range-tested by is_current_ui() (doing so
                broke Hor+ widening; see openpete_obj_id.h).

Identity comes from the very entry being rendered — desync-proof by
construction. History (why two prior layouts failed):
 1. Class-shared ptr at entry+4 (reverted ee78276): collapsed all
    same-class instances onto one tag.
 2. Host-side FIFO (f94e167, retired 2026-06-09): pushed at the
    cull-cascade join (0x8001F268), which also fires for mobys that
    pass distance/frustum but are never appended to the list — a
    chronic push>pop deficit with no resync (clear() had zero
    callers) saturated the 1024-ring by ~4000 ticks and shuffled
    every tag → the "same-class polys stretching between instances"
    bug. The specular cull had no push at all; its render pops
    consumed the regular pass's stale leftovers.
The lesson is recorded here so nobody rebuilds a side-channel for
data the game already carries per-entry.

READ-ONLY w.r.t. gameplay: the hook reads one PSX RAM word
(entry+52) via the host accessor and stashes it host-side; nothing
is written. The canonical lw is emitted verbatim before the call,
same diag_cone / ui_moby precedent. Implausible values (terminator
slot garbage; anything outside KSEG0) degrade to tag 0 = the
world-ordinal fallback."""
# GENERATED (append_call): operand="gp" passes the render-queue entry
# cursor; the wrapper openpete_moby_render_entry_tag does
# obj_id(*(entry+52)) + world_geo_clear (openpete_obj_id.c).
substitution_sites = [
    { addr = 0x8001F800, operand = "gp", kind = "append_call", hook = "openpete_moby_render_entry_tag" },  # regular  render iter
    { addr = 0x80020F9C, operand = "gp", kind = "append_call", hook = "openpete_moby_render_entry_tag" },  # specular render iter
]
verdict_fn       = "openpete_moby_render_entry_tag"
verified_against = ["aspect_determinism"]
state_regions    = []  # render-side identity tag; no state written
doc              = "notes/plans/openpete-transform-interp.md"

[[channel]]
name        = "untagged_renderer_clear"
status      = "gated"
description = """
Identity-channel hygiene for the renderers that have no per-object
tag yet (transform-interp §12.1 stragglers). The obj_id / world_geo
side-channels are set by the tagged renderers' loop hooks and never
expire, so shadows / flames / particles emitted their cache entries
under whatever tag the PREVIOUS renderer left behind. Stale-tagged
shadow batches then entered the matcher's authoritative obj_tag
pairing — consuming (or failing) the real owner's pair — and
flickered frozen-red / ordinal-blue in the F9 overlay.

Appends `openpete_untagged_renderer_entry()` (obj_id(0) +
world_geo_clear) to the first AppendCall-shaped instruction of each
renderer entry:

  0x80058D6C  sw  func_80058D64  r_flame.s    (flame renderer)
  0x800573CC  sw  func_800573C8  r_particles.s
  0x800580FC  sw  func_800580F4  r_particles.s
  0x800584D0  lw  func_800584C4  r_particles.s
  0x80059A60  lw  func_80059A48  r_shadows.s
  0x80059F94  lw  func_80059F8C  r_shadows.s

Their geometry intentionally falls back to obj_tag==0 (world-ordinal /
centroid) pairing — the pre-tag baseline — until the §12.1 straggler
pass gives each a true per-slot tag, at which point these clears are
superseded by per-iteration tag hooks. READ-ONLY host-side; no
gameplay byte touched."""
# GENERATED (append_call): no-arg clear at each renderer entry.
substitution_sites = [
    { addr = 0x80058D6C, operand = "void", kind = "append_call", hook = "openpete_untagged_renderer_entry" },  # flame
    { addr = 0x800573CC, operand = "void", kind = "append_call", hook = "openpete_untagged_renderer_entry" },  # particles A
    { addr = 0x800580FC, operand = "void", kind = "append_call", hook = "openpete_untagged_renderer_entry" },  # particles B
    { addr = 0x800584D0, operand = "void", kind = "append_call", hook = "openpete_untagged_renderer_entry" },  # particles C
    { addr = 0x80059A60, operand = "void", kind = "append_call", hook = "openpete_untagged_renderer_entry" },  # shadows A
    { addr = 0x80059F94, operand = "void", kind = "append_call", hook = "openpete_untagged_renderer_entry" },  # shadows B
]
verdict_fn       = "openpete_untagged_renderer_entry"
verified_against = ["aspect_determinism"]
state_regions    = []  # render-side identity hygiene; no state written
doc              = "notes/plans/openpete-transform-interp.md"

[[channel]]
