    { addr = 0x80052F84, dest = "rd", operand = "rt", kind = "replace_call", hook = "psx_runtime_vstream_halved" },  # func_80052F38 particles, Spyro frame
    { addr = 0x80023B6C, dest = "rd", operand = "rt", kind = "replace_call", hook = "psx_runtime_vstream_halved" },  # func_80023AC4 Spyro renderer
