# render_channels.toml — registry of every render→gameplay coupling
# channel openpete knows about. The audit tool
# (tools/check_channel_registry.py) cross-references this file
# against the address-keyed substitution table in
# third_party/psxrecomp/recompiler/src/code_generator.cpp:
#
#   - Every `substitution_sites` address listed here MUST exist as
#     an `addr == 0xNNNNNNNN` clause in code_generator.cpp.
#   - Conversely, every `addr == 0xNNNNNNNN` clause in
#     code_generator.cpp MUST appear in at least one channel here.
#
# Together those rules turn "we close channels as we find them" into
# "we know what we don't know" — orphan substitutions and missing
# substitutions both fail the audit.
#
# Statuses:
#   open           — channel identified (RAM-diff / bisect), no
#                    substitution yet. Aspect harness expected red.
#   gated          — substitution(s) in place that restore the
#                    canonical PSX verdict. Harness green here.
#   verified       — gated AND confirmed against the PSX hardware
#                    oracle (Phase 2). Strongest possible status.
#   audited_clean  — investigation completed; the candidate region
#                    is presentation scratch (no gameplay code reads
#                    it) so no substitution is needed. The owning
#                    region was removed from
#                    gameplay_state_regions.toml. Recorded here
#                    so the audit trail isn't lost.
#
# A `gated` channel may have its substitution_sites empty *iff* it
# also sets `gated_via = "<other_channel_name>"` — used when one
# channel closes as a side effect of another's substitutions (e.g.
# class_skip_flags is gated via widescreen_clip_x_threshold). The
# audit verifies the referenced channel exists and is itself gated.
#
# See notes/plans/openpete-determinism-enforcement.md Phase 4.

# ─── Gated channels ──────────────────────────────────────────────────

# `state_regions` lists the gameplay-state-region names (matching the
# `name` field in manifest/gameplay_state_regions.toml) that this
# channel affects. The harness uses this mapping to classify a
# divergent region back to its owning channel — i.e. "the moby pool
# diverged → m_WasDrawn channel → status gated → REGRESSION".

[[channel]]
name        = "m_WasDrawn"
status      = "gated"
description = """
Set by the per-bucket render walker after the cone-pass cull; read
next frame by func_80051FEC for auto-include grace + per-class AI
gating. Closed by replaying the canonical 4:3 cone verdict in a
host-side flag (psx_runtime_native_cone_pass) and gating the
m_WasDrawn=1 stores on it."""
substitution_sites = [
    0x8001F1FC, 0x800209A8, 0x80022B28,  # iter-start clear (force-pass billboards)
    0x8001F4CC, 0x80020C7C, 0x80022D98,  # m_WasDrawn=1 cull-pass writes (gated)
    0x8001F30C, 0x80020AB8, 0x80022C0C,  # cone-test verdict-compute sites
]
verdict_fn       = "psx_runtime_native_cone_pass"
verified_against = ["aspect_determinism"]
state_regions    = ["g_LevelMobys_pool", "g_DynMobys_pool", "g_Sparx_moby"]
doc              = "notes/plans/spyro-moby-update-vs-render.md"

[[channel]]
name        = "widescreen_clip_x_threshold"
status      = "gated"
description = """
Per-vertex SX right-edge clip threshold (0x200 == 512) hardcoded
via `lui $r, 0x200` across the cyclorama / moby / particle /
environment renderers. Substituted with psx_runtime_clip_x_threshold
so widescreen widens the clip without altering native PSX
behavior — default 0x02000000 == byte-identical 4:3."""
substitution_sites = [
    0x8004ED8C, 0x8004F1A8,                          # r_cyclorama.s
    0x8001F9F4, 0x80021190, 0x80022FF8,              # r_moby.s
    0x800574BC,                                      # r_particles.s
    0x8002626C, 0x8002652C, 0x800266E0, 0x8002684C,  # r_environment.s
    0x80027924, 0x80027A60, 0x80028074, 0x8002817C,
    0x80028A40, 0x80028C50, 0x8002982C, 0x800299AC,
    0x8002A2F4, 0x8002A4C0,
]
verdict_fn       = "psx_runtime_clip_x_threshold"
verified_against = ["aspect_determinism"]
# Pure presentation-side widening — no gameplay-state region directly
# tied to this channel; "gated" status here means "verified to not
# leak via the harness", not "intercepts a known gameplay write".
state_regions    = []
doc              = "notes/plans/openpete-widescreen-fov.md"

[[channel]]
name        = "widescreen_portal_clip_rect"
status      = "gated"
description = """
func_80050BD0 portal clip-rect X-upper clamp (`addiu $r, $zero,
0x200`) and its associated `slti $r, 0x201` test. Substituted with
psx_runtime_portal_clip_x_max so widescreen widens the per-portal
clip rect's right edge. Default 512 == byte-identical 4:3."""
substitution_sites = [
    0x80051804, 0x80051E98,  # addiu $s4, $zero, 0x200
    0x800517F4, 0x80051E88,  # slti $r, $r, 0x201
]
verdict_fn       = "psx_runtime_portal_clip_x_max"
verified_against = ["aspect_determinism"]
state_regions    = []  # presentation-side; see widescreen_clip_x_threshold note
doc              = "notes/plans/openpete-widescreen-fov.md"

# ─── Open channels — identified, no substitution yet ────────────────
# These appear in manifest/gameplay_state_regions.toml as
# `render_channel:*` regions; the harness diffs them and is expected
# to be RED until each gets a substitution and flips to "gated".
# Listing them here makes the unknown-unknown visible.

[[channel]]
name        = "sector_visibility_flags"
status      = "audited_clean"
description = """
Originally suspected (bisect 2026-04-xx) of being an env-renderer
per-cell visibility byte table at 0x80070C00..0x80070FFF.

Audited 2026-05-03 with the env-var write-watcher
(install_watch_from_env in game_extras_impl.c) + PC tracking. All
writes to this range come from r_moby.s's GTE per-vertex color
depth-cueing loop (PC 0x8001FE78: `mfc2 $t1, C2_RGB2; sw $t1, 0x0(\
$a0)`), targeting `g_SonyImage.u.m_Draw.unk_0x900[]` —
DrawStateSonyBuf prim-packet color scratch (sony_image.h:14). No
gameplay code reads this address range (confirmed by grep over
spyro-1/src, include, asm — no references). Hor+ widening
legitimately walks more vertices and writes different colors here;
that is presentation scratch divergence, not a gameplay leak.

Removed from gameplay_state_regions.toml as a result. No
recompiler substitution is needed; the address range is simply
not gameplay state."""
substitution_sites = []
verdict_fn         = ""
verified_against   = []
state_regions      = []
doc                = "notes/plans/openpete-presentation-decoupling.md"

[[channel]]
name        = "moby_render_queue"
status      = "audited_clean"
description = """
Originally suspected (bisect) of being a render→gameplay channel at
0x80071000..0x80071FFF. The bisected sub-range 0x80071800..0x80071F00
maps to g_SonyImage's m_WorldNearQueued[256] (0x800718F4..0x80071CF4),
m_WorldFarQueued[256] (0x80071CF4..0x800720F4), and the tail of the
DrawStateSonyBuf union — all three are render-side prim queues.

Audited 2026-05-03 with the env-var write-watcher (PC tracking
regen) + decomp-grep:

  Writers (recompiled MIPS):
    PC 0x8001691C  Memset inner loop (per-frame queue clears)
    PC 0x80025B74  r_environment.s: sw $a1, 0x0($s0); addi $s0,4 —
                   world-cell push, gated by per-cell flag bit
                   andi $t1, 0x8000.
    PC 0x80025BA4  r_environment.s: sw $a1, 0x0($t7); addi $t7,4 —
                   world-cell push, gated by flag bits
                   andi $t1, 0x4000 + 0x100-step distance test.

  Readers (decomp grep over spyro-1/{src,include,asm}):
    All in the render module: gamestates/draw.c (m_ShadedMobys walk
    + HUD-moby append in func_80018880, func_80019300,
    func_80019698, …), include/overlays/flight.inc.h (HUD mobys for
    flight gamestate). Zero asm-level readers outside renderers.

  Harness verdict: 3000-frame aspect_determinism (4:3 vs 16:9)
    shows position-log byte-identical. Per-region hash diverges as
    expected (more world cells visible in 16:9 → different queue
    contents) but no propagation to gameplay state.

Caveat — balloonist overlay transplant (include/overlays/balloonist.\
inc.h:581-583): right before LoadLevel(1), the homeworld balloon's
Moby is Memcpy'd into &g_SonyImage.m_WorldFarQueued[106] (addr
0x80071E9C..0x80071EF4) and re-aliased as gameplay state via
D_800777E8.m_BalloonMoby. This is a transient level-transition
storage trick, not steady-state coupling — once the destination
level renders, slot 106 may be overwritten by world cells, and the
balloon Moby is dormant until the return-to-home transition reads
it back. Original PSX behavior is identical regardless of aspect
because the transplant runs before any render frame in the new
level. Not currently exercised by the BK2 corpus; if a balloonist-
return scenario is added and shows divergence, this channel
re-opens.

Removed from gameplay_state_regions.toml — the address range is
render scratch + a transient transplant slot, not steady-state
gameplay state."""
substitution_sites = []
verdict_fn         = ""
verified_against   = ["aspect_determinism"]
state_regions      = []
doc                = "notes/plans/openpete-presentation-decoupling.md"

[[channel]]
name        = "dedup_flag_table"
status      = "audited_clean"
description = """
Originally suspected (bisect 2026-04-xx) of being an open render→
gameplay channel at D_80077868 (32 bytes, "func_80051FEC's per-class
dedup flag table").

Audited 2026-05-03 (asm read of moby_lists.s + grep across decomp):
this region is purely internal scratch within func_80051FEC. The
function clears the 32 bytes at entry (lines 17-20 of moby_lists.s),
populates them during a pass over g_LevelMobys (gated on m_WasDrawn,
which is itself a gated channel + canonical-camera bounding-box
tests), and consumes them in a second pass before returning. No
other code in spyro-1/{src,include,asm} references D_80077868.

Empirically: the matrix harness across title / stone-hill-entry /
inventory shows zero divergence in this region — the input set
(m_WasDrawn is gated; positions are canonical) produces aspect-
identical contents. Confirmed not a leak channel.

Removed from gameplay_state_regions.toml."""
substitution_sites = []
verdict_fn         = ""
verified_against   = []
state_regions      = []
doc                = "notes/plans/spyro-moby-update-vs-render.md"

[[channel]]
name        = "class_skip_flags"
status      = "gated"
description = """
"Rendered world sectors flags" (per the asm comment in
spyro-1/asm/data/game.bss.s for D_800771C8, 64 bytes). Written by
r_environment.s during the env-renderer's per-sector cull pass; read
by func_800521C0 (moby_lists.s) which clears m_WasDrawn=0 on every
moby whose owning sector wasn't rendered. Genuine render→gameplay
channel.

Empirically does NOT diverge across the matrix (title, stone-hill-
entry, inventory, tas, moby-culling-16-9, skip-to-artisans at 4:3
vs 16:9, 3000 frames). The reason: the env renderer's per-vertex
SX cull at r_environment.s goes through `lui $X, 0x200` sites
already substituted by `widescreen_clip_x_threshold` — those keep
the cone width canonical 4:3 by default (and only widen inside the
render-pass bracket, after func_800521C0 has already run). So
D_800771C8 receives the canonical 4:3 sector-rendered verdict,
which is what gameplay reads.

This is "closed by side effect": the channel is gated, but no own
substitution exists — the gating comes via widescreen_clip_x_threshold.
If that channel ever regresses, this one will surface."""
substitution_sites = []
gated_via          = "widescreen_clip_x_threshold"
verdict_fn         = "psx_runtime_clip_x_threshold (cross-channel)"
verified_against   = ["aspect_determinism", "determinism_matrix"]
state_regions      = ["render_channel:class_skip_flags"]
doc                = "notes/plans/spyro-moby-update-vs-render.md"
