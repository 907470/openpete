    { addr = 0x8004EC8C, operand = "rs", kind = "append_call", hook = "openpete_world_geo_set_current_probe" },  # lw $at,0($t6) — visibility-probe piece head ($t6=piece ptr; bit29 probe-tag space, disjoint rank group from the render batches)
