[[channel]]
name        = "polybuf_hudmoby_canonical"
status      = "gated"
description = """
g_HudMobys gameplay-state-pointer canonicalization under polybuf host
relocation. This is the channel the PSX oracle gate caught (openpete
project notes worked example): when the polygon buffer is host-backed and grown
(widescreen >=21:9 or --no-lod), the per-frame write cursor D_800757B0 lives
in openpete-only host vaddr space (0x80400000+). The game then derives
g_HudMobys = cursor + slot_stride and STORES it to 0x80075710 — a hashed,
gameplay-readable pointer (HUD-moby pool: gem counters, life icons). Stored
verbatim, it would carry the host address into gameplay state and diverge
from hardware.

These four sw sites map the stored host address back to its canonical PSX
vaddr (psx_runtime_polybuf_to_canon) so g_HudMobys holds the exact value
real PSX hardware holds, regardless of presentation flags:

  * 0x8001D760 / 0x8001D768  func_8001D718 (Gamestate-11, draw.c:2051/2054):
        g_HudMobys = D_800757B0 + 0x1BA00. The within-slot offset is
        preserved by the translator. Also repairs the
        `D_800756FC == m_HudOTStart` predicate at draw.c:2049, which host-
        vs-canonical made always-false, silently breaking the Gamestate-11
        HUD under relocation.
  * 0x8001EDCC / 0x8001EDD4  GamestateDraw frame-start reset (draw.c:
        2666/2667): the compiler reuses the END-cursor value (cursor + size)
        for these stores. Under relocation `size` is the GROWN host slot
        size (psx_runtime_polybuf_size) which the end cursor D_80075780
        needs but the HUD pointers must NOT inherit — the HUD-moby pool
        stays one CANONICAL 0x1C000 slot above the cursor as on hardware.
        So recover the cursor base (stored value - grown size), map to
        canonical, re-add the canonical 0x1C000 slot stride.

Identity at 4:3 default with no relocation (psx_runtime_polybuf_to_canon is
the identity map and psx_runtime_polybuf_size == 0x1C000). Companion to
widescreen_polybuf_size / widescreen_polybuf_lower (which redirect the
cursor itself); this channel keeps the DERIVED gameplay pointer canonical —
the exact invariant the hook-anchor plan calls out ("redirect the access,
never change the pointer value the game stores")."""
# GENERATED (void replace_call): map the host cursor back to canonical before
# storing g_HudMobys. Two hooks (the reset pair recovers the cursor base from
# the grown end-cursor). Math now in core/features/widescreen.c.
substitution_sites = [
    { addr = 0x8001D760, dest = "", operand = "cpu,ea,rt", kind = "replace_call", hook = "psx_runtime_polybuf_hudmoby_store" },  # Gamestate-11 HUD ptr
    { addr = 0x8001D768, dest = "", operand = "cpu,ea,rt", kind = "replace_call", hook = "psx_runtime_polybuf_hudmoby_store" },  # Gamestate-11 HUD ptr
    { addr = 0x8001EDCC, dest = "", operand = "cpu,ea,rt", kind = "replace_call", hook = "psx_runtime_polybuf_hudmoby_reset_store" },  # GamestateDraw frame-start reset
    { addr = 0x8001EDD4, dest = "", operand = "cpu,ea,rt", kind = "replace_call", hook = "psx_runtime_polybuf_hudmoby_reset_store" },  # GamestateDraw frame-start reset
]
determinism_critical = true   # gates gameplay-readable state
verdict_fn       = "psx_runtime_polybuf_to_canon"
verified_against = ["aspect_determinism", "psx_oracle_match"]
state_regions    = ["g_HudMobys"]
doc              = "notes/plans/openpete-polybuf-host-redirect.md"
