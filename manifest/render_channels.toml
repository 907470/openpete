    { addr = 0x8002956C, operand = "rt", kind = "append_call", hook = "openpete_world_geo_set_current" },  # lw $s3,0($ra) — strip-list head #5 inner
    # #28a gameplay-sky dome (func_8004EBA8, r_cyclorama.s): the gte_pc
