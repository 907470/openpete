status      = "gated"
description = """
DISTANCE half of the m_WasDrawn box-cull verdict (companion to the
cone channel). 21 append_call sites (dist_gate_lower x9 /
dist_gate_upper x12) after the canonical box-cull add/sub in all
three moby render paths; each clears native_dist_pass when the cull
comparand rejects, and the m_WasDrawn=1 stores gate on
(native_cone_pass && native_dist_pass).

