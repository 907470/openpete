[[channel]]
name        = "class_skip_flags"
status      = "gated"
description = """
"Rendered world sectors flags" — D_800771C8, 256 bytes (the
manifest's earlier 0x40 was undersized; func_800258F0 actually
clears 0x100 bytes). Written by r_environment.s at PC 0x80025B50
(`sb $fp, 0x0($s5)`) during the env-renderer's per-sector cull
pass; read by func_800521C0 (moby_lists.s) which clears
m_WasDrawn=0 on every moby whose owning sector wasn't rendered.
Genuine render→gameplay channel.

ROOT CAUSE (traced 2026-05-04 via MVMVA-trace at PC 0x80025A68):

  The leak originated in openpete's own
  game_extras_impl.c env-renderer wrapper: it scaled
  g_Camera.m_ViewMatrix.m[0][0..2] by 1/disp_w_factor before
  calling func_800258F0 to widen the per-cell cone-cull for Hor+
  rendering. The cull at 0x80025B50 also writes the per-sector
  visibility byte that gameplay reads, so the matrix widening
  leaked into D_800771C8. GTE MVMVA-trace confirmed M[0][0] and
  M[0][2] differed by exactly the aspect factor (1.334 = 16:9 /
  4:3) across runs — only row 0, only first/third columns,
  matching the row-0-X widening. No psxrecomp substitution
  involvement.

CLOSURE:

  Pre-compute a 256-byte canonical visibility mask in C *before*
  the matrix widening, by replicating the asm's three cull
  conditions (behind-camera, front-face X cone, front-face Y cone)
  with the canonical (un-widened) ViewMatrix. After
  func_800258F0 returns with widened D_800771C8, AND the table
  with the canonical mask: bytes the widened cull set to 0xFF
  that the canonical cull would not have passed get cleared back
  to 0. Render queues + emitted prims (already populated by the
  widened pass) are untouched, so Hor+ visual coverage is
  preserved.

  Implementation gotcha caught during the trace: the asm has a
  delay-slot `add $t4, $t4, $t5` after the behind-camera test
  (line 137 of r_environment.s) that turns the front-face Z
  adjust into 19E/32 not 9E/16. Missing that constant in the
  initial C cull was a silent false-negative on cells like
  cell-36 in the title-autoplay scenario; corrected during the
  same fix.

  See games/spyro-1/game_extras_impl.c (canonical_mask block)."""
substitution_sites = []
verdict_fn         = "openpete-side: canonical_mask AND in env-renderer wrapper"
verified_against   = ["aspect_determinism"]
state_regions      = ["render_channel:class_skip_flags"]
doc                = "notes/plans/spyro-moby-update-vs-render.md"

