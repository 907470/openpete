READ-ONLY w.r.t. gameplay: the appended calls only stash/clear a
host-side pointer consumed solely by the render cache + interpolation
matcher; no PSX RAM, cpu state, or gameplay-readable byte is written
(the original xor / lw is emitted verbatim before the call — same
diag_cone / ui_moby / envvert precedent). Verified: aspect_determinism
bit-identical with the substitutions present (gameplay log
unchanged)."""
