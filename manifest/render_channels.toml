moby-state transitions. Same investigation status as
sector_visibility_flags."""
substitution_sites = []
verdict_fn         = ""
verified_against   = []
state_regions      = ["render_channel:moby_render_queue"]
doc                = "notes/plans/openpete-presentation-decoupling.md"

