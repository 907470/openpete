Particle m_03 byte (offset 0x3 of each Particle, =1 iff drawn last
frame, =0 otherwise) — particle equivalent of m_WasDrawn. Written by
r_particles.s via the handwritten `sb $s2, -0x1D($ra)` idiom (where
$ra is pre-incremented to next particle). Read by class-specific
particle update handlers in level overlays to gate expensive AI work,
including conditional rand() calls — an unclosed leak drifts the
psyq_rand seed and cascades into moby state.

Closure: canonical-SX side channel populated by gte.cpp's RTPS
(openpete_canonical_sx0/1/2_q16, 3-deep FIFO matching push_sxy
semantics). Each `sub _, _, $s6` substitution at the right-edge clip
reads the appropriate FIFO slot, truncates to int16 via `>> 16` to
match the asm's `mfc2` integer SX, and tests the exact canonical 4:3
verdict (0 < SX < 512). The 4-vertex SLL substitution at 0x800576EC
ORs the same test across the FIFO. m_03 stores at 0x80057720 /
0x80057A10 / 0x80057B20 / 0x80057CDC / 0x80057F60 / 0x80058028 are
gated on the resulting psx_runtime_native_part_pass flag.

FIFO slot per PC:
  - 0x80057A04 (class 4): sx1 — 2 RTPSes precede; mfc2 between them
  - 0x80057B14 (class 3): sx2 — 1 RTPS
  - 0x80057CB4 (class 2): sx2 — 1 RTPS
  - 0x80057F28 (class 1): sx1 — 2 RTPSes; mfc2 between them
  - 0x8005801C (class 0): sx2 — 1 RTPS
  - 0x800576EC (4-vertex strip): OR over sx0|sx1|sx2

Result: title-autoplay 16:9 vs 4:3 PASSES bit-identical across 8000+
frames (hash + position). Earlier closure attempts using delta_OFX
math (truncated pixels or Q16) had irreducible 1-pixel boundary
ambiguity; reading the canonical SX directly from gte.cpp resolves
that exactly.

Open regression (2026-05-04, post-cone-clamp): 20k-frame soak
fails at frame 14590, particle[4].m_03 differs (4:3=0, 16:9=1).

Diagnosed 2026-05-05: the leak is NOT in the C8C..CB8 cull chain
itself — it's in the prim-buffer-full early-exit at PC 0x80057C14
(`bgez $v0, 0x8005809C` where $v0 = $t7 - $fp = remaining buffer
bytes). At frame 14589:
  4:3:  t7=0x801a37b0, fp=0x80194124, t7-fp = +0xf68c → no exit
  16:9: t7=0x801a37b0, fp=0x801a37b8, t7-fp = -8     → EXIT
       (other widened renderers (cone-cull mobys, cyclorama) consumed
        ~63KB more buffer in 16:9 by the time particles render)

When 16:9 hits the C14 early-exit, the function returns WITHOUT
processing any particle. m_03 stays at the previous frame's value
(=1 for particle[4]). 4:3 processes normally: clear m_03 at C3C,
RTPS at C4C, cull at CB8 → particle[4] fails (canonical SX=533 ≥
512), m_03 stays cleared.

Result: 4:3=0, 16:9=1 (stale).

The current canonical-SX closure handles per-particle cull but
NOT the buffer-full early-exit. Closure paths:

  A) Substitute the C14 branch with a "shadow cull" that runs
     canonical-SX cull for all remaining particles when 16:9 exits
     early — set m_03 per canonical verdict for particles past the
     buffer-full point. Requires recreating projection math for
     skipped particles since they never reach C4C's RTPS.

  B) Decouple the prim-buffer state from aspect — make widening
     renderers consume the same buffer bytes as 4:3 would. Per the
     project's North Star ("presentation features must not perturb
     gameplay-readable state"), this is the architecturally clean
     fix but spans cone-cull + cyclorama + env work.

  C) Reserve a fixed prim-buffer slice for the particle render at
     function entry (save fp, set fp = t7 - reserve, render, restore
     fp). Non-trivial because intermediate prim writes to the slice
     overwrite real data.

The cone-clamp fix that pushed divergence 8363→14590 is consistent: more mobys passing
cone cull → more triangles → buffer fills faster.

Substitution PC for closure: 0x80057C10 (the t7-fp compute) or
0x80057C14 (the bgez branch). Either site has access to t7/fp/ra
and can decide whether to take the early exit based on canonical
state instead of actual buffer state."""
substitution_sites = [
    # m_03=1 "drawn"-flag stores — GENERATED (void replace_call):
    # `part_drawn_store(cpu, ea, val)` writes iff native_part_pass.
    { addr = 0x80057720, dest = "", operand = "cpu,ea,rt", kind = "replace_call", hook = "psx_runtime_part_drawn_store" },
    { addr = 0x80057A10, dest = "", operand = "cpu,ea,rt", kind = "replace_call", hook = "psx_runtime_part_drawn_store" },
    { addr = 0x80057B20, dest = "", operand = "cpu,ea,rt", kind = "replace_call", hook = "psx_runtime_part_drawn_store" },
    { addr = 0x80057CDC, dest = "", operand = "cpu,ea,rt", kind = "replace_call", hook = "psx_runtime_part_drawn_store" },
    { addr = 0x80057F60, dest = "", operand = "cpu,ea,rt", kind = "replace_call", hook = "psx_runtime_part_drawn_store" },
    { addr = 0x80058028, dest = "", operand = "cpu,ea,rt", kind = "replace_call", hook = "psx_runtime_part_drawn_store" },
    # native_part_pass SETTERS — GENERATED (replace_call): record the canonical
    # 0<SX<512 verdict from the canonical-SX side channel, return the original
    # sub/sll value. Math now in core/features/widescreen.c. sx1 = classes that
    # mfc2 between two RTPSes (A04/F28); sx2 = single-RTPS classes.
    { addr = 0x80057A04, dest = "rd", operand = "rs,rt", kind = "replace_call", hook = "psx_runtime_part_cull_sx1" },  # class 4
    { addr = 0x80057F28, dest = "rd", operand = "rs,rt", kind = "replace_call", hook = "psx_runtime_part_cull_sx1" },  # class 1
    { addr = 0x80057B14, dest = "rd", operand = "rs,rt", kind = "replace_call", hook = "psx_runtime_part_cull_sx2" },  # class 3
    { addr = 0x80057CB4, dest = "rd", operand = "rs,rt", kind = "replace_call", hook = "psx_runtime_part_cull_sx2" },  # class 2
    { addr = 0x8005801C, dest = "rd", operand = "rs,rt", kind = "replace_call", hook = "psx_runtime_part_cull_sx2" },  # class 0
    # 4-vertex strip cull entry sll: OR over the FIFO tail, return $at<<16.
    { addr = 0x800576EC, dest = "rd", operand = "rt", kind = "replace_call", hook = "psx_runtime_part_cull_4vert" },  # 4-vertex chain entry
]
determinism_critical = true   # gates gameplay-readable state
verdict_fn       = "psx_runtime_native_part_pass"
verified_against = []
