# render_channels.toml — registry of every render→gameplay coupling
# channel openpete knows about. The audit tool
# (tools/check_channel_registry.py) cross-references this file
# against the address-keyed substitution table in
# third_party/psxrecomp/recompiler/src/code_generator.cpp:
#
#   - Every `substitution_sites` address listed here MUST exist as
#     an `addr == 0xNNNNNNNN` clause in code_generator.cpp.
#   - Conversely, every `addr == 0xNNNNNNNN` clause in
#     code_generator.cpp MUST appear in at least one channel here.
#
# Together those rules turn "we close channels as we find them" into
# "we know what we don't know" — orphan substitutions and missing
# substitutions both fail the audit.
#
# Statuses:
#   open           — channel identified (RAM-diff / bisect), no
#                    substitution yet. Aspect harness expected red.
#   gated          — substitution(s) in place that restore the
#                    canonical PSX verdict. Harness green here.
#   verified       — gated AND confirmed against the PSX hardware
#                    oracle (Phase 2). Strongest possible status.
#   audited_clean  — investigation completed; the candidate region
#                    is presentation scratch (no gameplay code reads
#                    it) so no substitution is needed. The owning
#                    region was removed from
#                    gameplay_state_regions.toml. Recorded here
#                    so the audit trail isn't lost.
#
# A `gated` channel may have its substitution_sites empty *iff* it
# also sets `gated_via = "<other_channel_name>"` — used when one
# channel closes as a side effect of another's substitutions (e.g.
# class_skip_flags is gated via widescreen_clip_x_threshold). The
# audit verifies the referenced channel exists and is itself gated.
#
# See notes/plans/openpete-determinism-enforcement.md Phase 4.

# ─── Gated channels ──────────────────────────────────────────────────

# `state_regions` lists the gameplay-state-region names (matching the
# `name` field in manifest/gameplay_state_regions.toml) that this
# channel affects. The harness uses this mapping to classify a
# divergent region back to its owning channel — i.e. "the moby pool
# diverged → m_WasDrawn channel → status gated → REGRESSION".

[[channel]]
name        = "m_WasDrawn"
status      = "gated"
description = """
Set by the per-bucket render walker after the cone-pass cull; read
next frame by func_80051FEC for auto-include grace + per-class AI
gating. Closed by replaying the canonical 4:3 cone verdict in a
host-side flag (psx_runtime_native_cone_pass) and gating the
m_WasDrawn=1 stores on it.

Note: this channel intentionally owns NO state_regions. Its closure
is verified at substitution-site granularity (the only byte it
controls is Moby+0x51), not by hashing a whole moby pool — pools
contain hundreds of other gameplay-controlled bytes that any
unrelated render-channel leak can perturb. See
`moby_pool_state` (open) for the catch-all that owns the pool
regions; `OPENPETE_HASHTIME_MWD_DUMP` (game_extras_impl.c) gives a
direct per-frame check that the m_WasDrawn byte itself matches
across aspects."""
substitution_sites = [
    0x8001F1FC, 0x800209A8, 0x80022B28,  # iter-start clear (force-pass billboards)
    0x8001F4CC, 0x80020C7C, 0x80022D98,  # m_WasDrawn=1 cull-pass writes (gated)
    0x8001F30C, 0x80020AB8, 0x80022C0C,  # cone-test verdict-compute sites
]
verdict_fn       = "psx_runtime_native_cone_pass"
verified_against = ["aspect_determinism"]
state_regions    = []
doc              = "notes/plans/spyro-moby-update-vs-render.md"

