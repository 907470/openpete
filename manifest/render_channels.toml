[[channel]]
name        = "sparkle_alloc_state"
status      = "gated"
description = """
g_Sparkles[16] alloc-pool occupancy. Each sparkle slot has a 0xC-byte
"in_use" tag that func_8005882C scans (first-fit) when SpawnSparkleAt
allocates. The slot stays in_use until the sparkle render-cull at
r_particles.s func_80058864 detects it has gone off-screen and clears
the byte at PC 0x80058818 (`sb $zero, 0xC($t8)`).

The cull at 0x80058648 (left edge) and 0x80058658 (right edge) tests
projected SX after RTPS at 0x80058604. The right-edge threshold is
hardcoded `lui $t0, 0x0200` (= 512 << 16, NOT widened by openpete) —
but the SX itself IS widened (eff_OFX = OFX*factor inside gte.cpp).
That mismatch means in 16:9, sparkles at canonical SX in
(-delta_OFX, 0) project to widened SX in (0, delta_OFX), pass widened
left-clip (blez fails on positive widened SX), survive the kill —
even though canonical 4:3 would have killed them. Slot stays
occupied → next SpawnSparkleAt picks a different slot → cascades
into rotation matrix updates (moby_helpers.c:886's
UPDATE_PROP_ROTMATRIX call is gated on alloc success), eventually
diverging Moby pool state.

Closure: substitute the SX-extract sll at 0x80058648 to load $a1 from
the canonical_sx_q16 side channel (gte.cpp's openpete_canonical_sx2_q16,
truncated to int via `>> 16` then re-shifted). The asm's subsequent
`blez $a1` (left) and `sub $a1, $a1, $t0` + `bgez $a1` (right) then
test canonical SX instead of widened — kill verdict matches canonical
4:3 exactly. Sparkles outside canonical bounds get killed the same
frame canonical does, so allocator bookkeeping stays bit-identical.
Trade-off: sparkles in widened periphery render for one frame then
die (matches base game behavior at 4:3).

Result: title-autoplay 16:9 vs 4:3 PASSES bit-identical across 8000
frames (hash + position log)."""
substitution_sites = [
    0x80058648,  # sll $a1, $a3, 16 — replaced with canonical_sx_q16 load
]
verdict_fn       = "openpete_canonical_sx2_q16"
verified_against = []
state_regions    = ["g_Sparkles_pool"]
doc              = "notes/plans/openpete-presentation-decoupling.md"

[[channel]]
name        = "particle_drawn_flag"
status      = "gated"
description = """
Particle m_03 byte (offset 0x3 of each Particle, =1 iff drawn last
frame, =0 otherwise) — particle equivalent of m_WasDrawn. Written by
r_particles.s via the handwritten `sb $s2, -0x1D($ra)` idiom (where
$ra is pre-incremented to next particle). Read by class-specific
particle update handlers in level overlays to gate expensive AI work,
including conditional rand() calls — an unclosed leak drifts the
psyq_rand seed and cascades into moby state.

Closure: canonical-SX side channel populated by gte.cpp's RTPS
(openpete_canonical_sx0/1/2_q16, 3-deep FIFO matching push_sxy
semantics). Each `sub _, _, $s6` substitution at the right-edge clip
reads the appropriate FIFO slot, truncates to int16 via `>> 16` to
match the asm's `mfc2` integer SX, and tests the exact canonical 4:3
verdict (0 < SX < 512). The 4-vertex SLL substitution at 0x800576EC
ORs the same test across the FIFO. m_03 stores at 0x80057720 /
0x80057A10 / 0x80057B20 / 0x80057CDC / 0x80057F60 / 0x80058028 are
gated on the resulting psx_runtime_native_part_pass flag.

FIFO slot per PC:
  - 0x80057A04 (class 4): sx1 — 2 RTPSes precede; mfc2 between them
  - 0x80057B14 (class 3): sx2 — 1 RTPS
  - 0x80057CB4 (class 2): sx2 — 1 RTPS
  - 0x80057F28 (class 1): sx1 — 2 RTPSes; mfc2 between them
  - 0x8005801C (class 0): sx2 — 1 RTPS
  - 0x800576EC (4-vertex strip): OR over sx0|sx1|sx2

Result: title-autoplay 16:9 vs 4:3 PASSES bit-identical across 8000+
frames (hash + position). Earlier closure attempts using delta_OFX
math (truncated pixels or Q16) had irreducible 1-pixel boundary
ambiguity; reading the canonical SX directly from gte.cpp resolves
that exactly.

Open regression (2026-05-04, post-cone-clamp): 20k-frame soak
fails at frame 14590, particle[4].m_03 differs (4:3=0, 16:9=1).

Diagnosed 2026-05-05: the leak is NOT in the C8C..CB8 cull chain
itself — it's in the prim-buffer-full early-exit at PC 0x80057C14
(`bgez $v0, 0x8005809C` where $v0 = $t7 - $fp = remaining buffer
bytes). At frame 14589:
  4:3:  t7=0x801a37b0, fp=0x80194124, t7-fp = +0xf68c → no exit
  16:9: t7=0x801a37b0, fp=0x801a37b8, t7-fp = -8     → EXIT
       (other widened renderers (cone-cull mobys, cyclorama) consumed
        ~63KB more buffer in 16:9 by the time particles render)

When 16:9 hits the C14 early-exit, the function returns WITHOUT
processing any particle. m_03 stays at the previous frame's value
(=1 for particle[4]). 4:3 processes normally: clear m_03 at C3C,
RTPS at C4C, cull at CB8 → particle[4] fails (canonical SX=533 ≥
512), m_03 stays cleared.

Result: 4:3=0, 16:9=1 (stale).

The current canonical-SX closure handles per-particle cull but
NOT the buffer-full early-exit. Closure paths:

  A) Substitute the C14 branch with a "shadow cull" that runs
     canonical-SX cull for all remaining particles when 16:9 exits
     early — set m_03 per canonical verdict for particles past the
     buffer-full point. Requires recreating projection math for
     skipped particles since they never reach C4C's RTPS.

  B) Decouple the prim-buffer state from aspect — make widening
     renderers consume the same buffer bytes as 4:3 would. Per the
     project's North Star ("presentation features must not perturb
     gameplay-readable state"), this is the architecturally clean
     fix but spans cone-cull + cyclorama + env work.

  C) Reserve a fixed prim-buffer slice for the particle render at
     function entry (save fp, set fp = t7 - reserve, render, restore
     fp). Non-trivial because intermediate prim writes to the slice
     overwrite real data.

The cone-clamp fix that pushed divergence 8363→14590 is consistent: more mobys passing
cone cull → more triangles → buffer fills faster.

Substitution PC for closure: 0x80057C10 (the t7-fp compute) or
0x80057C14 (the bgez branch). Either site has access to t7/fp/ra
and can decide whether to take the early exit based on canonical
state instead of actual buffer state."""
substitution_sites = [
    0x80057720, 0x80057A10, 0x80057B20, 0x80057CDC,  # sb $s2,-0x1D($ra) — m_03=1 stores (gated)
    0x80057F60, 0x80058028,                          # ditto — extra two sb sites in r_particles.s
    0x80057A04, 0x80057B14, 0x80057CB4,              # single-vertex sub-by-$s6 verdict capture
    0x80057F28, 0x8005801C,                          # ditto — for the extra two sb sites
    0x800576EC,                                      # 4-vertex chain entry — canonical OR over $at,$v0,$v1,$a0
]
verdict_fn       = "psx_runtime_native_part_pass"
verified_against = []
state_regions    = ["g_Particles_pool"]
doc              = "notes/plans/openpete-presentation-decoupling.md"

[[channel]]
name        = "moby_pool_state"
status      = "gated"
description = """
Catch-all channel for any byte of the Moby pools (g_LevelMobys_pool,
g_DynMobys_pool, g_Sparx_moby) that diverges between aspects without
a known closed-channel attribution. Mobys carry hundreds of bytes of
gameplay-controlled state (position, rotation, animation, AI
counters, props pointers); a leak in *any* render→gameplay channel
that AI consumes will surface here.

Root cause (2026-05-04 frame-8363 investigation): the cone-extra
WIDENING substitutions at 0x8001F30C / 0x80020AB8 / 0x80022C0C
multiplied (MAC3 + Z_offset) by `psx_runtime_moby_cone_extra_q12`
without clamping. When the moby straddles or sits behind the camera
plane, (MAC3 + offset) is negative — the multiply produces a NEGATIVE
widening term, which TIGHTENS the X-cone in 16:9 instead of widening
it and culls mobys that 4:3 admits. Slot 81 (class 0x0106) at frame
8362 had MAC1=84, MAC2=-82, MAC3=-95 (bit-identical between aspects);
MAC3+77=-18, so the widening flipped the verdict from PASS (-18 < 0)
to REJECT (+6 >= 0) under widening. Native 4:3 = pass → set m_WasDrawn=1;
widened 16:9 = unintended reject → m_WasDrawn stays 0 from the clear
at 0x80022B28.

Fix: clamp (MAC3 + offset) to >= 0 before the widening multiply. The
X-cone is meaningless when Z is behind the camera plane anyway;
clamping to 0 reduces to the canonical native test in that regime,
preserving 4:3-equivalent verdicts. Substitution sites updated; no
new sites added — fix is a math correction inside the existing
cone-extra closures."""
substitution_sites = []
verdict_fn         = "shared with m_WasDrawn closure (clamp added 2026-05-04)"
verified_against   = ["aspect_determinism gate 2026-05-04: divergence pushed 8363 → 14590"]
state_regions      = ["g_LevelMobys_pool", "g_DynMobys_pool", "g_Sparx_moby"]
doc                = "notes/plans/spyro-moby-update-vs-render.md"

