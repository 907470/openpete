[[channel]]
name        = "moby_pool_state"
status      = "gated"
description = """
Catch-all channel for any byte of the Moby pools (g_LevelMobys_pool,
g_DynMobys_pool, g_Sparx_moby) that diverges between aspects without
a known closed-channel attribution. Mobys carry hundreds of bytes of
gameplay-controlled state (position, rotation, animation, AI
counters, props pointers); a leak in *any* render→gameplay channel
that AI consumes will surface here.

Root cause (2026-05-04 frame-8363 investigation): the cone-extra
WIDENING substitutions at 0x8001F30C / 0x80020AB8 / 0x80022C0C
multiplied (MAC3 + Z_offset) by `psx_runtime_moby_cone_extra_q12`
without clamping. When the moby straddles or sits behind the camera
plane, (MAC3 + offset) is negative — the multiply produces a NEGATIVE
widening term, which TIGHTENS the X-cone in 16:9 instead of widening
it and culls mobys that 4:3 admits. Slot 81 (class 0x0106) at frame
8362 had MAC1=84, MAC2=-82, MAC3=-95 (bit-identical between aspects);
MAC3+77=-18, so the widening flipped the verdict from PASS (-18 < 0)
to REJECT (+6 >= 0) under widening. Native 4:3 = pass → set m_WasDrawn=1;
widened 16:9 = unintended reject → m_WasDrawn stays 0 from the clear
at 0x80022B28.

Fix: clamp (MAC3 + offset) to >= 0 before the widening multiply. The
X-cone is meaningless when Z is behind the camera plane anyway;
clamping to 0 reduces to the canonical native test in that regime,
preserving 4:3-equivalent verdicts. Substitution sites updated; no
new sites added — fix is a math correction inside the existing
cone-extra closures."""
substitution_sites = []
verdict_fn         = "shared with m_WasDrawn closure (clamp added 2026-05-04)"
verified_against   = ["aspect_determinism gate 2026-05-04: divergence pushed 8363 → 14590"]
state_regions      = ["g_LevelMobys_pool", "g_DynMobys_pool", "g_Sparx_moby"]
doc                = "notes/plans/spyro-moby-update-vs-render.md"

