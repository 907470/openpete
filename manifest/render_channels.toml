saturated .s cull admitted far mobys -> m_WasDrawn=1 -> AI / rand()
divergence). The producer stack that created the saturated/canonical
split was deleted 2026-07-06, so the gates now simply replay the .s's
own canonical verdict (mdist_thresh_delta retired) — kept because they
are the m_WasDrawn closure architecture shared by the whole channel
family, and a future producer perturbation would be caught by them.
"""
