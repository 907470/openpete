# Oracle golden recipe, sourced as shell by scripts/capture_psx_oracle_ds.sh
# --game and tests/harness/check_psx_oracle.sh --game. The golden is derived from
# the disc and DuckStation patched by third_party/duckstation-patches, so it
# is generated into tests/golden/ on the first gate run and never committed
# (.gitignore); two captures from the same applied head are byte-identical. Every path is
# relative to the repo root; every PC comes from manifest/psyq.toml.

GOLDEN="tests/golden/spyro-1/psxtrace-demo-20k.bin"
FRAMES=20000
DISC="games/spyro-1/spyro-1/build/SCUS-94228.cue"
MANIFEST="games/spyro-1/manifest/gameplay_state_regions.toml"
# GamestateDraw: one hit per game tick.
ANCHOR_PC=0x8001ED5C
# CdRead, libetc VSync, srand, the VBLANK positions outside waits, and the
# libspu calls SpuSetKey, SpuGetKeyStatus, SpuGetAllKeysStatus and
# SpuSetVoiceAttr, with their SPU register accesses: SpuSetKey's key-on
# stores (KON low and high halves), _SpuSetVoiceAttr's sample-rate store and
# the envelope-level loads of SpuGetKeyStatus and SpuGetAllKeysStatus.
CAPTURE_ARGS=(--cd-read-pc 0x8006606C --vsync-pc 0x8005DBC4 --srand-pc 0x8006275C
    --vblpos --spuq setkey:0x8005C7D4 --spuq keystatus:0x8005C9D0 --spuq allkeys:0x8005D9EC --spuq voiceattr:0x8005C7AC
    --spureg kon:0x8005C8D4 --spureg kon:0x8005C8D8 --spureg pitch:0x8005D0C8
    --spureg envx:0x8005CA38 --spureg envx:0x8005DA24)
# openpete flags the gate run adds before the caller's pass-through flags.
RUN_ARGS=()
# Music-routing engagement bounds measured on this golden: data-mode
# CdlSetmode clears RT after a stream start at least this often, and no
# CdlReadS is issued with RT clear.
MODE_RT_CLEARED_MIN=15
READS_RT_CLEAR_MAX=0
