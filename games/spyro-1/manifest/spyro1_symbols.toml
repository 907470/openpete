# Curated PSX symbol aliases for the native-renderer feeders.
#
# Hand-maintained: the readable ALIAS the feeder code uses, joined by address
# to the authoritative manifest (globals.toml / symbols.toml) at build time.
# tools/gen_symbols_header.py generates gen/spyro1_symbols.gen.h from this and
# FAILS the build if any `addr` is not a symbol start in the manifest (or, for
# `base`/`offset` interiors, if base+offset != the manifest math), so a psx.map
# rebuild that moves or renames a symbol surfaces here instead of going stale.
#
# Why curated aliases instead of the raw manifest names: recomp globals only
# have D_<addr> names (non-descriptive), the decomp names (g_Camera, ...) are
# REAL linker symbols that a `#define` would clobber, and the feeders want
# SCREAMING_CASE raw vaddr integers for cpu->read_word().
#
# NOT here (deliberately kept local): the PSX hardware scratchpad 0x1F800000,
# the openpete-invented relocation regions (no_lod.c 0x80300000/0x80600000),
# and non-address sentinels (PORTAL_RGB_RESOLVE, FPS_TINT) - none are PSX
# symbols, so the drift-check can't validate them.

# ---- gameplay structs / pointers (decomp names in the manifest) ----
