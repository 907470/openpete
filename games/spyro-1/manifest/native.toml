# Entry points where psx_dispatch_compiled should jump into a native C
# function instead of running the recompiled MIPS body. The generator
# emits one `case 0xADDR ...` per entry into the override switch.
#
# Argument marshalling and the address are auto-derived: address
# comes from manifest/symbols.toml (parsed psx.map), args come from
# the C signature in spyro-1/include/<name>.h. To override, set
# `args = [...]` explicitly. Supported tokens:
#   "u32"           — pass cpu->aN directly
#   "u8"            — pass (uint8_t)(cpu->aN & 0xFF)
#   "ptr"           — openpete_psx_to_host_ptr(cpu->aN)
#   "stack_u32:OFF" — cpu->read_word(cpu->sp + OFF)
#
# `psyq_main = true` runs psyq___main(cpu) before the body — needed for
# main() so the C runtime crt0 fires.
[[dispatch]]
name = "main"
c_name = "spyro_native_main"
psyq_main = true
args = []  # main() isn't in include/, so spec it here
addr = 0x80012204  # main is `void main(void)`, decl lives in src/main.c

[[dispatch]]
name = "CDLoadTime"
c_name = "CDLoadTime"

[[dispatch]]
name = "CDReadDone"
c_name = "CDReadDone"

[[dispatch]]
name = "CDLoadSync"
c_name = "CDLoadSync"

[[dispatch]]
name = "CDLoadAsync"
c_name = "CDLoadAsync"

