# Hand-curated config: which decomp sources compile natively, which
# globals/functions need link-time aliasing or dispatch interception.
#
# The generators (gen_defsyms.py, gen_dispatch.py) consume this plus the
# auto-generated symbols.toml/globals.toml from build_manifest.py.

# Optional escape hatch for global aliasing: gen_defsyms.py defaults to
# emitting --defsym for every kind=recomp global in globals.toml (i.e.
# everything the matching-decomp build defines under build/asm/data/).
# List names here that collide with host-defined symbols (PsyCross
# internals, libc/CRT names, etc.).
#
# Top-of-file because TOML scopes top-level keys after `[[table]]`
# headers into that table — keep this above the array-of-tables blocks.
alias_globals_skip = []

# Names whose host-side thunk is already hand-written, or whose source-
# level call resolves directly to a PsyCross symbol (no thunk needed).
# Suppressed from gen_thunks's auto-emitted output:
#
#   CdReadCallback — psyq_thunks.cpp's hand-written bridge registers a
#                    host-side native callback (not a recomp dispatch
#                    back into PSX). Auto-thunk shape is wrong.
#   CdInit         — cd.c's `CdInit()` link-resolves directly to
#                    PsyCross's CdInit; no rename is in flight, so the
#                    auto thunk would just be dead code.
outbound_psyq_skip = ["CdReadCallback", "CdInit"]
outbound_recomp_skip = []

# Decomp C TUs to compile and link natively (relative to spyro-1/).
# Each entry can carry per-TU compile-flag fragments the generator pastes
# into the CMakeLists fragment alongside the SPYRO_DECOMP_BASE_FLAGS.
[[native_source]]
file = "src/main.c"
extra_flags = "-Dmain=spyro_native_main"

[[native_source]]
file = "src/cd.c"
extra_flags = """\
-DCdControl=openpete_CdControl \
-DCdRead=openpete_CdRead \
-DCdSync=openpete_CdSync \
-DCdIntToPos=openpete_CdIntToPos\
"""

# initialization.c + completion.c — re-enable gated on:
#   - Pass 4/5 boundary handling for `(char*)<vaddr> - X` integer-cast
#     pointer arithmetic (init.c: `levelVram = (char*)0x80200000 - ...`)
#   - struct-by-value semantics across the bridge (Pass 5)
# Pass 1 fn-ptr substitution + the openpete_CdReadCallback bridge are in;
# the remaining gap is a parameter-level convention for "this void* is
# really a PSX vaddr" that the rewriter can't yet infer.
#[[native_source]]
#file = "src/initialization.c"
#extra_flags = "-DCdControl=openpete_CdControl"
#
#[[native_source]]
#file = "src/completion.c"

# Entry points where psx_dispatch_compiled should jump into a native C
# function instead of running the recompiled MIPS body. The generator
# emits one `case 0xADDR ...` per entry into the override switch.
#
# Argument marshalling and the address are auto-derived: address
# comes from manifest/symbols.toml (parsed psx.map), args come from
# the C signature in spyro-1/include/<name>.h. To override, set
# `args = [...]` explicitly. Supported tokens:
#   "u32"           — pass cpu->aN directly
#   "u8"            — pass (uint8_t)(cpu->aN & 0xFF)
#   "ptr"           — openpete_psx_to_host_ptr(cpu->aN)
#   "stack_u32:OFF" — cpu->read_word(cpu->sp + OFF)
#
# `psyq_main = true` runs psyq___main(cpu) before the body — needed for
# main() so the C runtime crt0 fires.
[[dispatch]]
name = "main"
c_name = "spyro_native_main"
psyq_main = true
args = []  # main() isn't in include/, so spec it here
addr = 0x80012204  # main is `void main(void)`, decl lives in src/main.c

[[dispatch]]
name = "CDLoadTime"
c_name = "CDLoadTime"

[[dispatch]]
name = "CDReadDone"
c_name = "CDReadDone"

[[dispatch]]
name = "CDLoadSync"
c_name = "CDLoadSync"

[[dispatch]]
name = "CDLoadAsync"
c_name = "CDLoadAsync"

# CalculateCompletion dispatch gated with src/completion.c.
#[[dispatch]]
#name = "CalculateCompletion"
#c_name = "CalculateCompletion"
#args = []

# Outbound — native code calling into still-recompiled MIPS. Used when a
# native TU references a function whose body hasn't been migrated yet
# (e.g. main() calls Initialize/GamestateUpdate, cd.c calls SoundsUpdate
# / CDMusicUpdate). The thunk packs args from host-ABI into cpu->aN and
# invokes psx_dispatch_compiled(cpu, addr). Address + signature both
# auto-resolved by name.
[[outbound_recomp]]
name = "Initialize"

[[outbound_recomp]]
name = "GamestateUpdate"

[[outbound_recomp]]
name = "GamestateDraw"

[[outbound_recomp]]
name = "SoundsUpdate"

[[outbound_recomp]]
name = "CDMusicUpdate"

