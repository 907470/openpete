# Outbound — native code calling PSYQ-compatible wrappers. Used when
# cd.c calls Cd*; we route through psyq_<NAME>(cpu) (psyq_thunks.cpp)
# rather than PsyCross's raw entry, because the psyq_* layer carries
# Spyro-specific enhancements (XA streaming arm in psyq_CdControl,
# XA pump in psyq_CdSync, etc.). Signatures from PsyCross libcd.h.
[[outbound_psyq]]
psyq_name = "CdControl"
c_name = "openpete_CdControl"

[[outbound_psyq]]
psyq_name = "CdRead"
c_name = "openpete_CdRead"

[[outbound_psyq]]
psyq_name = "CdSync"
c_name = "openpete_CdSync"

[[outbound_psyq]]
psyq_name = "CdIntToPos"
c_name = "openpete_CdIntToPos"

