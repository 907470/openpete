# ─── Pools - indirect rows ─────────────────────────────────────────────
# Moby and particle data live in level RAM whose location moves between
# levels; the rows dereference the head pointer at base_ptr every tick.

[[region]]
name         = "g_Particles_pool"
kind         = "indirect_array"
base_ptr     = 0x80075824            # g_Particles head pointer (Particle*)
element_size = 0x20                  # sizeof(Particle): 4-byte header + 28-byte data
max_elements = 256                   # 0x2000 bytes total - src/4BEF8.c (m_SharedAnimations - 0x2000)
class        = "gameplay"
# Render-side drawn flag (byte 0x03, cascading to 0x01) flips when a
# widened renderer consumes more of the shared polybuf before the particle
# pass (func_800573C8's buffer check at 0x80057C10); the full 20k 32:9
# oracle diverged here for 4882 frames while psyq_rand_seed, g_Spyro,
# g_Camera, g_Sparx and g_MobyAllocPtr stayed bit-identical, so the flag
# never reaches gameplay. Logged, never hard-fails; the coupling tripwire
# is the seed and the moby rows.
