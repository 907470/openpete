# ─── libcd mirror ──────────────────────────────────────────────────────
# Of libcd's state block (0x80074E38, written by the shared CD thunks) the
# game reads one byte: CdLastCom, from music.c (`CdLastCom() == CdlGetlocP`).
# CdStatus, CdLastPos and CdMode have no caller outside psyq.s in this
# game (grep of the recompiled main image and overlays for the four
# getters: only psyq_CdLastCom is called), so they are not
# gameplay-readable here. The byte follows the drive's command sequence,
# which runs ahead on openpete during a load (the XA stream restarts
# before the reference's level read completes): it is the one psyq_mirror
# row tolerated as a load transient, 40 bursts of at most 130 ticks over
# the golden, until openpete charges the reference's VBLs per read.

[[region]]
name        = "libcd_CdLastCom"
start       = 0x80074E55
length      = 0x1
class       = "psyq_mirror"
description = "libcd block 0x80074E38: last command byte (CdLastCom), read by music.c"
cd_load_transient = true
diverge_baseline = 2473

