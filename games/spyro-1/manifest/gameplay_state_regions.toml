# directly. The 20k attract demo collects 45 gems, so this is exercised.
# Confirmed bit-identical across stock 4:3 / --no-lod / --aspect 32:9 at
# every tick before adding (cross-config gem dump). Sizes from psx.map
# (g_GemTotal..g_LoadStage = 4B; g_NGems..g_DeltaTime = 4B;
# g_LevelGemCount[36]..g_CdMusic = 0x90B). Appended last to keep the
# existing region indices stable.

