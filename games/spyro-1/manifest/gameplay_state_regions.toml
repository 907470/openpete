description = "g_SonyImage.u.m_Draw.unk_0x900[0xD00] (sony_image.h): prim-packet colour scratch written by r_moby.s GTE depth cueing (PC 0x8001FE78); no gameplay reads (games/spyro-1/manifest/render_channels.toml sector_visibility_flags, audited_clean); identical to the reference on all 20k golden records"

