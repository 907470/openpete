# ─── g_Camera ─────────────────────────────────────────────────────────
# camera.h `Camera` struct. Sized to the commented
# `static_assert(sizeof(Camera) == 0x110)`. Trimmed from 0x200 to
# 0x110 on 2026-05-04 after the PCSX-Redux oracle gate showed the
# only g_Camera divergence was bytes inside g_DB[] (libgpu's DRAWENV
# / DISPENV / DR_ENV command packets, which sit immediately after
# g_Camera in memory and which PsyCross handles host-side without
# mirroring to PSX RAM). g_DB is pure render-side state, not
# gameplay-readable.

[[region]]
name        = "g_Camera"
start       = 0x80076DD0
length      = 0x110
description = "Camera struct: ProjectionMatrix, ViewMatrix, m_Position, m_Rotation, simulation/sphere coords, focus, state flags."

# ─── g_Spyro ──────────────────────────────────────────────────────────
# Moby (0x58) + Spyro-specific tail (animation rig, breath state,
# health, inventory counts, etc.). Sized to spyro.h's `Spyro` struct
# (commented `static_assert(sizeof(Spyro) == 0x2a4, ...)`). Trimmed
# from 0x500 to 0x2A4 on 2026-05-04 after the PCSX-Redux oracle gate
# attributed the only frame-0 divergence to libpad slot-2 buffer
# bytes adjacent in memory (~0x80078E50), *not* inside Spyro itself.
# Those bytes are isolated as their own region below so we don't
# mask real Spyro-state leaks behind constant PSYQ libpad skew.

[[region]]
name        = "g_Spyro"
start       = 0x80078A58
length      = 0x2A4
description = "Spyro Moby instance + Spyro-specific physics/animation/HUD state"
# SPU voice-slot indices stored by PlaySound when allocating channels for
# damage-/charge-sound effects. The values depend on which voices the
# allocator's `for i in 0..23` scan found free at call time, which is in
# turn driven by SPU envelope precision in the host emulator (DS:
# sample-accurate, OP: VBL-quantized). Both are valid implementations of
# the libspu contract; the bytes themselves aren't gameplay-meaningful.
mask_offsets = [0x2A0, 0x2A1]
mask_reason  = "m_damageSoundChannel / m_chargeSoundChannel — host SPU-precision-derived"

# ─── PSYQ libpad slot-2 buffer + companion globals ────────────────────
# Real PSYQ on PCSX-Redux fills this with the slot-2 controller status
# (FF 00 00 00 00 00 00 00 = empty slot). openpete's psyq_PadInitDirect
# thunk leaves a different pattern (00 FF FF FF 80 80 80 80 — looks like
# a connected analog pad with neutral sticks). Documented PSYQ thunk
# skew per docs/ram-diff-vs-pcsxr.md "libpad-driven kernel growth".

[[region]]
name        = "pad_input_buffers"
start       = 0x80078E50
length      = 0x50
description = "PSYQ libpad slot-2 buffer + adjacent globals (D_80078E9C, etc.)"

# ─── Sbss render-side scratch with known leak channels ───────────────
# These are *small* tables in main-exe sbss that the renderer writes
# during draw and gameplay reads next frame. Documented leak channels.
# Status of each is tracked separately in render_channels.toml (Phase 4).

# 0x80070000-0x80070FFF was originally tracked here as
# `render_channel:sector_visibility_flags`. Audited 2026-05-03 and
# confirmed to be `g_SonyImage.u.m_Draw.unk_0x900[]` — render-side
# prim-packet color scratch, not gameplay state. Writer PC
# 0x8001FE78 (r_moby.s GTE depth-cueing). No gameplay reads.
# See manifest/render_channels.toml `sector_visibility_flags`
# (status: audited_clean) for the audit trail.

# 0x80071000..0x80071FFF was tracked as `render_channel:moby_render_queue`.
# Audited 2026-05-03 (PC tracking + decomp grep): the range covers
# g_SonyImage.m_WorldNearQueued / m_WorldFarQueued / m_ShadedMobys —
# all render-side prim queues. Writers are r_environment.s queue-push
# at PCs 0x80025B74 / 0x80025BA4, plus per-frame Memset clears. Readers
# are all in the render module (gamestates/draw.c, flight.inc.h);
# no asm code outside renderers reads from these offsets. Position-log
# byte-identical across 3000-frame aspect harness. See
# manifest/render_channels.toml `moby_render_queue` (status:
# audited_clean) for the audit trail and the balloonist-transplant
# caveat.

# 0x80077868..0x80077888 was tracked as `render_channel:dedup_flag_table`.
# Audited 2026-05-03: it's per-call scratch internal to func_80051FEC
# (cleared at entry, filled+consumed within the call, no external
# references). See manifest/render_channels.toml `dedup_flag_table`
# (status: audited_clean).

[[region]]
name        = "render_channel:class_skip_flags"
start       = 0x800771C8
length      = 0x100
description = """Rendered world sectors flags. Written by r_environment.s at PC 0x80025B50 during the per-cell cull pass; read by func_800521C0 to clear m_WasDrawn=0 on mobys whose owning sector wasn't rendered. func_800258F0 clears 0x100 bytes at entry (loop at 0x80025990); see manifest/render_channels.toml for the closure mechanism."""

# ─── Moby pools — indirect regions ────────────────────────────────────
# Moby data lives in dynamic level-overlay RAM whose location moves
# between levels. A direct start..start+length region would cover
# megabytes of overlay code/data that legitimately differs between
# aspects (textures, models, OT scratch loaded at variable times) and
# would drown the gate in noise.
#
# `kind = "indirect_array"` regions tell the runtime to dereference
# the PSX vaddr at `base_ptr` and hash `element_size * max_elements`
# bytes starting at the resulting pointer. NULL/unmapped pointers are
# skipped (pool not allocated yet, e.g. during the title-screen
# preroll before a level loads).
#
# `max_elements` is a generous cap. Optional `live_end_ptr_addr` /
# `live_count_addr` clamp the hashed length to the live extent so
# unallocated tail slots (stale heap garbage left behind by level
# overlay loads, render scratch, etc.) don't pollute the hash with
# non-gameplay differences. Allocation *count* is itself tracked via
# the singleton g_MobyAllocPtr / g_DynMobyCount regions, so a real
# divergence in spawn order still trips the gate via those.

[[region]]
name         = "g_Particles_pool"
kind         = "indirect_array"
base_ptr     = 0x80075824            # g_Particles head pointer (Particle*)
element_size = 0x20                  # sizeof(Particle): 4-byte header + 28-byte data
max_elements = 256                   # 0x2000 bytes total — see src/4BEF8.c (m_SharedAnimations - 0x2000)
# AUDIT 2026-06-08: render-side, gameplay-neutral (proven, not assumed).
# At --aspect >=21:9 the widened renderers consume more of the shared
# polybuf before the particle pass (func_800573C8), so its per-particle
# buffer check (0x80057C10 `t7-fp`) skips boundary particles that 4:3
# draws — flipping their m_03 drawn-flag (byte 0x03; cascades to 0x01).
# EMPIRICAL PROOF this never reaches gameplay: the full 20k 32:9 oracle
# (keep-going) diverges in g_Particles_pool for 4882 frames yet
# psyq_rand_seed, g_Spyro, g_Camera, g_Sparx and g_MobyAllocPtr stay
# bit-identical to hardware for all 20000 ticks; the only other diverging
# regions (g_LevelMobys/g_DynMobys/g_Sparx_moby) show the SAME counts as
# stock 4:3 (universal CD-load transients), so g_Particles_pool is the
# sole 32:9-induced divergence and it stays contained. The manifest's old
# "propagates into RNG" note was a hypothesis the oracle has now refuted
# for the demo. Marked gameplay_neutral (logged, never hard-fails); the
# audit obligation is held open by keeping psyq_rand_seed / g_Spyro /
# g_Sparx tracked — if particles ever DO drive gameplay RNG, those trip.
# (Render-side m_03 is presentation state, like the audited-out
# 0x80071xxx moby-render-queue.) If we later want byte-exact particles,
# the fix is to make func_800573C8's buffer check use the canonical 4:3
# cursor.
gameplay_neutral = true
description  = "Particle pool. Render-side drawn-flag/scratch — audited gameplay-neutral (see AUDIT above); divergence logged but never hard-fails. Coupling tripwire: psyq_rand_seed/g_Spyro/g_Sparx stay tracked."

[[region]]
name         = "g_Sparkles_pool"
kind         = "direct"
start        = 0x80077108
length       = 0x180                 # 16 sparkles × 0x18 bytes — psx.map symbol g_Sparkles
description  = "g_Sparkles[16]: short-lived sparkle effects spawned by SpawnSparkleAt (moby_helpers.c). The +0xC byte is the in_use tag — alloc state cascades into rotation-matrix updates because SpawnSparkleAt only calls UPDATE_PROP_ROTMATRIX on successful alloc. Render-cull at r_particles.s 0x80058648/0x80058654 frees slots when sparkles go off-screen — closure (sparkle_alloc_state channel) makes that cull use the canonical-SX side channel so kill verdict matches 4:3 regardless of widening."

[[region]]
name              = "g_LevelMobys_pool"
kind              = "indirect_array"
base_ptr          = 0x80075828
element_size      = 0x58              # sizeof(Moby), cf. include/moby.h:471
max_elements      = 512
live_end_ptr_addr = 0x8007573C        # g_MobyAllocPtr — bump cursor; live = *end_ptr - *base_ptr
description       = "Static-level moby array, indexed via *g_LevelMobys."
# Moby.m_SoundChannel — see g_Spyro mask_reason. Per-element offset
# repeats every element_size bytes throughout the live extent.
mask_per_element  = [0x54]
mask_reason       = "Moby.m_SoundChannel — host SPU-precision-derived"
# Refreshed in-place by synchronous psyq_CdRead (level/streaming loads).
# Diverges for the load's duration vs the hardware-timed oracle, then
# re-converges — the gate tolerates a *healing* divergence here. See
# notes/plans/openpete-psx-oracle-ci.md. Removed once CD timing is modelled.
cd_load_transient = true

[[region]]
name             = "g_DynMobys_pool"
kind             = "indirect_array"
base_ptr         = 0x80075890
element_size     = 0x70              # Moby (0x58) + per-slot dyn header (0x18); cf. moby.h:512
max_elements     = 128
live_count_addr  = 0x800756A4        # g_DynMobyCount; live = *count * element_size
description      = "Dynamic-spawn moby pool, indexed via *g_DynMobys. Element stride is 0x70 not 0x58 — pool reserves a 24-byte header per slot ahead of the Moby."
# Moby.m_SoundChannel at 0x54 within the embedded Moby. The Moby starts
# at +0x18 within the 0x70-byte slot, so per-element offset is 0x6C.
mask_per_element = [0x6C]
mask_reason      = "Moby.m_SoundChannel (Moby starts at +0x18 in 0x70 stride)"
# See g_LevelMobys_pool: refreshed by synchronous CdRead; healing
# divergence tolerated by the gate. Removed once CD timing is modelled.
cd_load_transient = true

[[region]]
name         = "g_Sparx_moby"
kind         = "indirect_array"
base_ptr     = 0x80075898
element_size = 0x58
max_elements = 1
description  = "Sparx companion: single Moby behind *g_Sparx."
mask_per_element = [0x54]
mask_reason      = "Moby.m_SoundChannel — host SPU-precision-derived"
# See g_LevelMobys_pool: refreshed by synchronous CdRead; healing
# divergence tolerated by the gate. Removed once CD timing is modelled.
cd_load_transient = true

# ─── Gem-collection state ─────────────────────────────────────────────
