# games/spyro-1/manifest/gameplay_state_regions.toml - the gameplay-readable
# bytes the oracle hashes every tick. Generated into the
# build by tools/gen_state_regions.py (cmake/openpete_game.cmake): the C
# table the exe registers, the flat table the DuckStation capture module
# reads, and their shared FNV-1a-64 in the trace header.
#
# Derivation (tools/derive_state_regions.py spyro-1): the main image's
# .data/.sdata/.sbss/.bss extents from spyro-1/build/psx.map, minus the
# psyq_internal extents and every [[expect]] range of ram_diff_expect.toml
# (pad_model, music_head, boot_timing, callback_stack, irq_dispatch; the
# whole-RAM diff at the first and loop anchors names every one), the named
# rows carved out, the rest coalesced: one row per extent, symbol names as
# comments. Then the pool rows (particles, level mobys, dynamic mobys,
# Sparx) behind their head pointers and the libcd mirror byte the game
# reads. The table replaced the hand-written 33-row (2232 B) table; every
# byte the old table hashed is hashed here
# (tools/check_regions_containment.py OLD.flat NEW.flat).
#
# Row fields beyond the generator's (start/length or the indirect_array
# keys, mask_offsets/mask_per_element, cd_load_transient, gameplay_neutral,
# constant_ok): `class` is gameplay | render_scratch | psyq_mirror.
#
# cd_load_transient rows in the main image hold the state the level load
# fills or advances while sectors arrive (load stage and wait counters,
# the SPU and model tables, CD bookkeeping, the XA stream request, the
# environment and cyclorama pointers, the title sequence). openpete lands
# a read instantly where the reference lands it over the load's VBLs, so
# each diverges for the load window and re-converges at its end (heal
# window 600 ticks); the flags come off once openpete charges the
# reference's VBLs per read. No CdRead destination lies inside the main
# image (the level images load at 0x8007AA38 and 0x8007DDE8), so no
# partial sector landing reaches these rows. Every tolerated row carries
# diverge_baseline, the records it diverged on over the golden; a full
# run exceeding it fails.
#
# render_scratch rows are the five render-side ranges inside the main
# image: the four channels audited in games/spyro-1/manifest/render_channels.toml
# (prim colour scratch, the moby prim queues, the dedup flags, the sector
# class-skip flags), the first three sized from sony_image.h, and the
# primitive-buffer cursor. The DEMO MODE text
# letters wobble by COSINE_8((g_LevelTicks * 4 + i * 12) & 0xFF)
# (gamestates/draw.c func_80018908), and g_LevelTicks is the VBL counter
# the VSync handler increments. Under the reference's VBL schedule (the
# golden's .vsync/.loads/.srand siblings) a VBL the reference took inside a
# tick's work, after the tick's last wait, is charged at openpete's next
# wait, after the anchor and the draw that follows it. Where the tick that
# starts the demo zeroes g_LevelTicks (LoadLevelScene) and the reference
# then takes one or two VBLs before the anchor, openpete draws the letters
# from a counter one or two lower; the letter angles, the GTE input rows of
# the MVMVA at 0x80022E04, and the cursor differ on those records (six per
# 20k run). g_LevelTicks itself is a boot_timing carve-out. The cursor row
# is gameplay_neutral with the count as the ratchet.
#
# Carve-outs (commented rows; the ranges are subtracted above):
#   pad_model       g_PadBuffer 0x800786A0-C4, g_Pad stick calibration
#                   0x800773BC-0x80077420 - the analog pad's poll answer
#   music_head      g_CdMusic+0x208..+0x214 - XA stream position bookkeeping
#   boot_timing     D_80075950 VSync(-1) pair, g_LevelTicks - the boot's VBL
#                   count; g_UnprocessedFrames is kept as its own row
#   callback_stack  D_80077DD8+0x24..+0x2C - saved sp/fp of collision.s
#                   func_8004AE38's register-save block
#   irq_dispatch    libetc callback context, ring head/tail, counters
#                   0x80074B58-0x80074B84
#   psyq_internal   libgpu's queued-command ring 0x80078EA0-0x8007A6A8 sits
#                   in game .bss (psyq.s 0x80061980); the host libgpu never
#                   writes it
#
# Of the [[populated]] mirror rows (the words the CD, pad, gpu and crt0
# thunks write where the library would), only the libcd block and the two
# crt0 words are hashed: a grep of every symbol inside the other rows (the
# libgpu environment and fill-packet blocks, the libpad control block, the
# VSyncCallback slot, the libcd/libetc write_word sites) over the decomp's
# non-PSYQ asm and C finds no reference, and of the translated PSYQ getters
# the game calls only CdLastCom returns a byte from them.

# The arguments tools/derive_state_regions.py derived the direct rows from;
# `--check` re-derives and compares (ctest state_regions_derivation_spyro-1).
[derivation]
named = [
  "psyq_rand_seed=0x80075AC0:4", "g_Spyro=0x80078A58:0x2A4",
  "g_LevelIndex=0x80075964:4", "g_UnprocessedFrames=0x80075760:4",
  "render_prim_color_scratch=0x800705F4:0xD00:render_scratch",
  "render_moby_queues=0x800718F4:0xC00:render_scratch",
  "render_dedup_flags=0x80077868:0x20:render_scratch",
  "render_prim_cursor=0x800757B0:4:render_scratch",
  "g_CDMaxReadTime=0x800756E0:4", "g_DeltaTime=0x800756CC:4",
  "g_LoadStage=0x80075864:4", "g_CDReadTime=0x8007588C:4",
  "g_Spu=0x80075F08:0x340", "level_tables=0x80076278:0x900",
  "g_CdState=0x80076B90:0x30", "g_CdMusic_head=0x800774B0:0x208",
  "g_CdMusic_tail=0x800776C4:0x14", "g_NewCyclorama=0x80077780:0x14",
  "g_Environment_g_Buffers=0x800785A8:0x60", "g_TitlescreenState=0x80078D78:0x5C",
  "g_Sparkles_pool=0x80077108:0xC0",
  "render_channel:class_skip_flags=0x800771C8:0x100:render_scratch",
]
min_row = 4

