# games/spyro-1/manifest/ram_diff_expect.toml — what a whole-RAM diff against
# the DuckStation reference is expected to show at this game's anchors
# (scripts/check_ram_diff.sh, tools/ram_diff.py).
#
# A range leaves this file only by a fix that makes the bytes agree, never
# by a re-bless. Every listed class is capped at 25% of RAM by the tool.

map = "games/spyro-1/spyro-1/build/psx.map"

[disc]
id   = "SCUS-94228"
path = "games/spyro-1/spyro-1/build/SCUS-94228.cue"


[openpete]
args = ["--run-recomp", "0x80012204"]

[reference]
# The oracle golden's configuration: a non-persistent card in slot 1.
card = "nonpersistent"
# The reference module's configuration these baselines were taken under:
# SCPH-1001 BIOS with the regtest host's fast-boot patch, NTSC-U disc, analog
# controller in port 1. A changed setting moves the kernel and bios_stack
# baselines; state the change here when it happens.
bios      = "SCPH-1001"
fast_boot = true

[anchors]
# first: entry of the function issuing the game's first CdRead (CDLoadSync);
# no load has been issued on either side at hit 1.
first = 0x80016500
# loop: GamestateDraw, the per-tick main-loop function the oracle anchors on;
# hit N is the same state on both sides (the oracle's tick-for-tick PASS).
loop  = 0x8001ED5C

# The BIOS's own call frames under the guest's initial sp (0x801FFFF0);
# psx_bios.c pushes none. Measured low edge at the first anchor.
# psyq_internal ratchet: differing bytes, ranges, a digest of the differing
# offsets and the hit, measured inside the PSYQ extents when this file was
# written; the tool fails on any change in either direction (a drop tightens
# the baseline in the same change as its fix) and refuses another hit. A
# hex-spelled anchor needs its own row, keyed by that spelling.
[psyq_internal_baseline]
first = { bytes = 198, ranges = 31, digest = "bbfeafcbc1bf64de", hit = 1 }
loop = { bytes = 313, ranges = 32, digest = "b43010bf1117d6ef", hit = 700 }

[bios_stack]
low = 0x801FFB50

# PSYQ library sections, from the decomp link map (spyro-1/build/psx.map).
[[psyq_internal]]
start  = 0x800730BC
length = 0x21A8
source = "psx.map:2333 .data psyq.data.o"

[[psyq_internal]]
start  = 0x80075640
length = 0x28
source = "psx.map:2601 .sbss psyq.sbss.o"

[[psyq_internal]]
start  = 0x80075978
length = 0x580
source = "psx.map:2821 .bss psyq.bss.o"

[[psyq_internal]]
start  = 0x80076B78
length = 0x8
source = "D_80076B78, stored by PSYQ code at 0x80069D08 (psyq.s:16492-16493)"

[[psyq_internal]]
start  = 0x80078EA0
length = 0x14
source = "D_80078EA0, referenced only by psyq.s (game.bss placement)"

