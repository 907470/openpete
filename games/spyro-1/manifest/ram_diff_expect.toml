# Named ranges: game state the two sides fill differently for a known reason.

[[expect]]
class  = "pad_model"
start  = 0x800786A0
end    = 0x800786C4
name   = "g_PadBuffer"
reason = "the raw poll answer; the reference answers as an analog pad"
owner  = "P16"

[[expect]]
class  = "music_head"
start  = 0x800776B8
end    = 0x800776C4
name   = "g_CdMusic+0x208..+0x214 (stream position bookkeeping)"
reason = "openpete's virtual XA head advances at a fixed rate per VBL; the drive's head does not"
owner  = "openpete-music-xa-double-speed"

[[expect]]
class  = "boot_timing"
start  = 0x80075950
end    = 0x80075958
name   = "D_80075950 (.pre = VSync(-1) timing pair)"
reason = "VBL counts read from VSync(-1); the boot's VBL count differs"
owner  = "openpete-psx-oracle-ci"
[[expect]]
class  = "pad_model"
start  = 0x800773BC
end    = 0x80077420
name   = "g_Pad stick calibration (m_CaliStick*, m_Cali*Sensitivity)"
reason = "filled from the analog pad's poll answer; openpete's pad answers a digital poll"
owner  = "P16"

[[expect]]
class  = "boot_timing"
start  = 0x80075760
end    = 0x80075764
name   = "g_UnprocessedFrames"
reason = "VBL count taken during boot; equal by the loop anchor's first hit (oracle record 0)"
owner  = "openpete-psx-oracle-ci"

[[expect]]
class  = "boot_timing"
start  = 0x800758C8
end    = 0x800758CC
name   = "g_LevelTicks"
reason = "VBL count taken during boot; equal by the loop anchor's first hit (oracle record 0)"
owner  = "openpete-psx-oracle-ci"

[[expect]]
class  = "callback_stack"
start  = 0x80077DFC
end    = 0x80077E04
name   = "D_80077DD8+0x24..+0x2C (saved sp, fp of a handwritten register-save block, collision.s func_8004AE38)"
reason = "the guest stack depth at that save differs between the two sides; which call chain differs is an open unknown"
owner  = "openpete-guest-interrupt-delivery"

# libetc's interrupt-dispatch state: the handler, stack pointer and argument
# of the callback in flight, the callback ring's head and tail indices, and
# two counters advanced per interrupt. Hardware's interrupt timing and the
# BIOS boot's VBL count decide them; openpete dispatches callbacks from its
# VBL pump on the guest's own stack.
[[expect]]
class  = "irq_dispatch"
start  = 0x80074B58
end    = 0x80074B64
name   = "libetc callback context (handler, sp, argument)"
reason = "hardware runs the handler from the interrupt on the kernel stack; the values are the last dispatch's registers"
owner  = "openpete-guest-interrupt-delivery"

[[expect]]
class  = "irq_dispatch"
start  = 0x80074B68
end    = 0x80074B70
name   = "libetc callback ring head and tail"
reason = "count of callbacks queued and dispatched by the interrupt path"
owner  = "openpete-guest-interrupt-delivery"

[[expect]]
class  = "irq_dispatch"
start  = 0x80074B7C
end    = 0x80074B84
name   = "libetc interrupt counters"
reason = "advance per interrupt since the BIOS boot; openpete's VBL count starts at the EXE entry"
owner  = "openpete-guest-interrupt-delivery"
