# Named ranges: game state the two sides fill differently for a known reason.

[[expect]]
class  = "pad_model"
start  = 0x800786A0
end    = 0x800786C4
name   = "g_PadBuffer"
reason = "the raw poll answer; the reference answers as an analog pad"
owner  = "P16"

[[expect]]
class  = "music_head"
start  = 0x800776B8
end    = 0x800776C4
name   = "g_CdMusic+0x208..+0x214 (stream position bookkeeping)"
reason = "openpete's virtual XA head advances at a fixed rate per VBL; the drive's head does not"
owner  = "openpete-music-xa-double-speed"

[[expect]]
class  = "boot_timing"
start  = 0x80075950
end    = 0x80075958
name   = "D_80075950 (.pre = VSync(-1) timing pair)"
reason = "VBL counts read from VSync(-1); the boot's VBL count differs"
owner  = "openpete-psx-oracle-ci"
[[expect]]
class  = "pad_model"
start  = 0x800773BC
end    = 0x80077420
name   = "g_Pad stick calibration (m_CaliStick*, m_Cali*Sensitivity)"
reason = "filled from the analog pad's poll answer; openpete's pad answers a digital poll"
owner  = "P16"

[[expect]]
class  = "boot_timing"
start  = 0x80075760
end    = 0x80075764
name   = "g_UnprocessedFrames"
reason = "VBL count taken during boot; equal by the loop anchor's first hit (oracle record 0)"
owner  = "openpete-psx-oracle-ci"

[[expect]]
class  = "boot_timing"
start  = 0x800758C8
end    = 0x800758CC
name   = "g_LevelTicks"
reason = "VBL count taken during boot; equal by the loop anchor's first hit (oracle record 0)"
owner  = "openpete-psx-oracle-ci"

[[expect]]
class  = "callback_stack"
start  = 0x80077DFC
end    = 0x80077E04
name   = "D_80077DD8+0x24..+0x2C (saved sp, fp of a handwritten register-save block, collision.s func_8004AE38)"
reason = "the guest stack depth at that save differs between the two sides; which call chain differs is an open unknown"
owner  = "openpete-guest-interrupt-delivery"
