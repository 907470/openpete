# Per-game inputs for scripts/regen-recomp.sh, scripts/regen-manifest.sh and
# tools/gen_game_identity.py. Sourced as shell; every path is relative to the
# repo root.

# Identity, compiled into the exe as generated/game_identity.c by
# tools/gen_game_identity.py at build time.
DISPLAY_NAME="Spyro the Dragon"
EXE_FILENAME="SCUS_942.28"

DECOMP_DIR="games/spyro-1/spyro-1"
PSX_EXE="$DECOMP_DIR/build/PSX.EXE"
WAD_DIR="$DECOMP_DIR/build/wad"
ASM_DIR="$DECOMP_DIR/asm"

# Every overlay is loaded at this one vaddr; only one is resident at a time.
OVERLAY_LOAD_ADDR=0x8007AA38
# Load address .. load address + the largest overlay, for harvesting the
# main EXE's overlay function-pointer constants.
OVERLAY_RANGE=0x8007AA38:0x8008EA38

# libcd's state block (D_80074E38), read by the thunked CdStatus, CdLastPos,
# CdMode and CdLastCom. The read-completion handler is registered through the
# psyq_CdReadCallback thunk, so no guest slot holds it.
LIBCD_BLOCK_ADDR=0x80074E38
CD_READ_CB_ADDR=

# Render-channel substitution table. Spyro-1-specific addresses, so a game
# without one leaves this empty and the recompiler is passed no --channel-sites.
CHANNEL_MANIFEST="games/spyro-1/manifest/render_channels.toml"

# g_SonyImage (D_8006FCF4, 0x31A0 bytes), the render scratch pool: every
# lui+addiu pair composing an address in [lo, hi) is emitted relative to
# psx_runtime_g_sony_image_base so the pool can be relocated at run time.
# Empty: no pair is redirected (--sony-image-window is not passed).
SONY_IMAGE_WINDOW=0x8006FCF4:0x80072E94

# The main-EXE jal-cont third pass is disabled here: adding a single forced
# entry reproducibly lost pre-existing dispatch entries elsewhere in the
# binary. The overlay path's third pass is green.
MAIN_EXE_THIRD_PASS=0

# `jr <reg>` sites the recompiler rewrites to `return` because the register
# reloads a spilled $ra (see code_generator.cpp, saved-ra pattern); the regen
# fails when the count differs.
RA_SPILL_RETURNS=0

# The word the level-setup switch reads to pick a case (g_LevelId for
# Spyro 1, g_NextLevelNum for Spyro 2); tools/extract_overlay_func_pointers.py
# attributes each case's callback constants to `level_<id>`.
LEVEL_ID_ADDR=0x8007596C

# The game has a first-boot module build: the regen emits its converged
# manifest (scripts/emit-recomp-manifest.sh) into manifest/recomp/<serial>/.
FIRST_BOOT=1
