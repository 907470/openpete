# Per-game inputs for scripts/regen-recomp.sh and scripts/regen-manifest.sh.
# Sourced as shell; every path is relative to the repo root.

DECOMP_DIR="games/spyro-1/spyro-1"
PSX_EXE="$DECOMP_DIR/build/PSX.EXE"
WAD_DIR="$DECOMP_DIR/build/wad"
ASM_DIR="$DECOMP_DIR/asm"

# Every overlay is loaded at this one vaddr; only one is resident at a time.
OVERLAY_LOAD_ADDR=0x8007AA38
# Load address .. load address + the largest overlay, for harvesting the
# main EXE's overlay function-pointer constants.
OVERLAY_RANGE=0x8007AA38:0x8008EA38

# Render-channel substitution table. Spyro-1-specific addresses, so a game
# without one leaves this empty and the recompiler is passed no --channel-sites.
CHANNEL_MANIFEST="manifest/render_channels.toml"

# The main-EXE jal-cont third pass is disabled here: adding a single forced
# entry reproducibly lost pre-existing dispatch entries elsewhere in the
# binary. The overlay path's third pass is green.
MAIN_EXE_THIRD_PASS=0
