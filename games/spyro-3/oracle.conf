# Oracle golden recipe, sourced as shell by scripts/capture_psx_oracle_ds.sh
# --game and tests/harness/check_psx_oracle.sh --game. The golden is derived from
# the disc and DuckStation patched by third_party/duckstation-patches, so it
# is generated into tests/golden/ on the first gate run and never committed
# (.gitignore); two captures from the same applied head are byte-identical. Every path is
# relative to the repo root; every PC comes from manifest/psyq.toml.

GOLDEN="tests/golden/spyro-3/psxtrace-demo-20k.bin"
FRAMES=20000
DISC="games/spyro-3/spyro-3/build/SCUS-94467.cue"
MANIFEST="games/spyro-3/manifest/gameplay_state_regions.toml"
# Update: one hit per game tick.
ANCHOR_PC=0x80055400
# CdRead, the read-complete handler slot (recomp.conf CD_READ_CB_ADDR),
# CdControl, libetc VSync, the two callback registrars, srand, the loader's
# state word, the controller's registers with the game's own reads (its
# controller code starts at 0x800742D0), controller commands, CdSync, the
# kernel's SIO0 port-flip word, and libcd's own VSync(-1) timeout polls
# (CD_sync..CD_cw) skipped. The VBLANK positions outside
# waits and the libspu calls SpuSetKey, SpuGetAllKeysStatus and
# SpuSetVoiceAttr are recorded. --no-card: the title's card probe answers
# differ with a card present, and the gate runs openpete with --no-card.
CAPTURE_ARGS=(--cd-read-pc 0x8005D96C --cd-read-cb-slot 0x8006B3D0
    --cd-control-pc 0x8005E0BC --vsync-pc 0x8005956C
    --vsync-cb-pc 0x8005C714 --vsync-cb-pc 0x8005C748 --srand-pc 0x8005C674
    --watch-word 0x8006C518 --cd-irq --cd-read-pc-min 0x800742D0
    --pad-cmds --cdsync-pc 0x8005E074 --sio0-word 0x80007264
    --vsync-query-skip 0x8006143C:0x80061AC8 --no-card
    --vblpos --spuq setkey:0x8005E9B0 --spuq allkeys:0x8005EB70 --spuq voiceattr:0x8005EC1C)
RUN_ARGS=(--no-card)
# Music-routing engagement bounds measured on this golden: data-mode
# CdlSetmode clears RT after a stream start at least this often, and no
# CdlReadS is issued with RT clear.
MODE_RT_CLEARED_MIN=24
READS_RT_CLEAR_MAX=0
