# Reference capture of a Spyro 3 save along a movie, sourced by
# scripts/capture_psx_oracle_ds.sh --game spyro-3 --recipe
# games/spyro-3/oracle-card-save.conf and by tests/harness/check_psx_oracle.sh
# --game spyro-3 --recipe games/spyro-3/oracle-card-save.conf. The
# attract-demo recipe's recorders with a card in slot 1, plus:
#   - the movie games/spyro-3/bk2/s3-create-save.bk2 (a new game that creates
#     and writes its save), keyed on the consume key: both sides play row j
#     of group E, E the entries of the pad-ring consumer func_8003A584; the
#     reference sets each row one VBL early (--bk2-lead 1), since its pad
#     handler writes the buffer from the previous vsync's exchange and
#     openpete delivers a row at the vsync it stamps it; the reference's
#     consumer closes some groups after another count than the movie's (a
#     load that ends 103 VBLs earlier closes group 554 after 2 of its 105
#     rows), so the capture runs again predicting from the counts its
#     previous pass took (<golden>.bk2groups) until no row is mispredicted;
#   - slot 1 imports the blank formatted card CARD1_FIXTURE, the image
#     openpete's run copies to a scratch path; slot 2 is empty;
#   - the card the reference left after the last record is exported to
#     CARD1_END, which the gate compares with the card openpete left;
#   - the card window (<golden>.cardwin) logs every card command;
#   - the game's reads of root counter 2 at 0x8004F6A4 are recorded
#     (<golden>.rcnt2) and answered from the capture.
# FRAMES covers the movie's 1436 groups (one record per consumer entry) and
# ends before record 1497, where a CD read starts that a shorter capture
# leaves pending (the run then diverges on the read's state).
# Generated, never committed.
source games/spyro-3/oracle.conf
GOLDEN="tests/golden/spyro-3/psxtrace-card-save.bin"
FRAMES=1490
_card_args=()
for _a in "${CAPTURE_ARGS[@]}"; do
    [[ "$_a" == --no-card ]] || _card_args+=("$_a")
done
CARD1_FIXTURE="tests/golden/spyro-3/card-v6-blank.mcd"
CARD1_END="tests/golden/spyro-3/psxtrace-card-save.bin.card1-end.mcd"
MOVIE="games/spyro-3/bk2/s3-create-save.bk2"
CAPTURE_ARGS=("${_card_args[@]}" --card-active 0x8000755A
    --card-import "$CARD1_FIXTURE" --card-export-end "$CARD1_END" --card-window
    --bk2 "$MOVIE" --bk2-consume-pc 0x8003A584 --bk2-lead 1 --rcnt2-pc 0x8004F6A4)
RUN_ARGS=(--no-card2 --bk2 "$MOVIE")
MODE_RT_CLEARED_MIN=0
READS_RT_CLEAR_MAX=0
CONSTANT_REGIONS_REASON="the records end before the code that changes them runs"
unset _a _card_args
