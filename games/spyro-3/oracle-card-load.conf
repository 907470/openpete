# Reference capture of a Spyro 3 save load along a movie, sourced by
# scripts/capture_psx_oracle_ds.sh --game spyro-3 --recipe
# games/spyro-3/oracle-card-load.conf and by tests/harness/check_psx_oracle.sh
# --game spyro-3 --recipe games/spyro-3/oracle-card-load.conf. The
# card-with-save recipe's card (games/spyro-3/oracle-card-with-save.conf:
# CARD1_IMPORT, CARD1_FIXTURE, CARD1_END, the card window) plus the movie
# games/spyro-3/bk2/s3-load-save.bk2, keyed on the consume key (consumer
# 0x8003A584, each row one VBL early on the reference; see
# games/spyro-3/oracle-card-save.conf): from the title the game reads one
# sector of the save at boot, loads it (an asynchronous read of 0x1D80 bytes,
# 59 sectors), reads 0x900 bytes (18 sectors) from offset 0x280 and enters the
# level. Generated, never committed.
source games/spyro-3/oracle-card-with-save.conf
GOLDEN="tests/golden/spyro-3/psxtrace-card-load.bin"
# FRAMES covers the reads (the last card command at reference VBLANK 2838) and
# the level load that follows (CD reads issued at records 851-998, the last
# complete at record 1009), and ends before the read issued at record 1057. A
# 2000-record capture fails at record 1121, past the last card command, on the
# stock and the clock row alike: openpete reaches a VSync(0) (return address
# 0x8001E8C8) 5 reference VBLANKs ahead of its row.
FRAMES=1040
CARD1_FIXTURE="$GOLDEN.card1.mcd"
CARD1_END="$GOLDEN.card1-end.mcd"
MOVIE="games/spyro-3/bk2/s3-load-save.bk2"
_card_args=(); _prev=""
for _a in "${CAPTURE_ARGS[@]}"; do
    [[ "$_a" == --card-export || "$_prev" == --card-export || "$_a" == --card-export-end ||
       "$_prev" == --card-export-end ]] || _card_args+=("$_a")
    _prev="$_a"
done
CAPTURE_ARGS=("${_card_args[@]}" --card-export "$CARD1_FIXTURE" --card-export-end "$CARD1_END"
    --bk2 "$MOVIE" --bk2-consume-pc 0x8003A584 --bk2-lead 1)
RUN_ARGS=(--no-card2 --bk2 "$MOVIE")
MODE_RT_CLEARED_MIN=0
READS_RT_CLEAR_MAX=0
CONSTANT_REGIONS_REASON="the records end before the code that changes them runs"
unset _a _prev _card_args
