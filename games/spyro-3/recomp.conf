# Per-game inputs for scripts/regen-recomp.sh, scripts/regen-manifest.sh and
# tools/gen_game_identity.py. Sourced as shell; every path is relative to the
# repo root.

# Identity, compiled into the exe as generated/game_identity.c by
# tools/gen_game_identity.py at build time.
DISPLAY_NAME="Spyro: Year of the Dragon"
EXE_FILENAME="SCUS_944.67"

DECOMP_DIR="games/spyro-3/spyro-3"
PSX_EXE="$DECOMP_DIR/build/PSX.EXE"
WAD_DIR="$DECOMP_DIR/build/wad"
ASM_DIR="$DECOMP_DIR/asm"

# main_BSS_END from the decomp's psx.map; the largest overlay is 0x2d800.
OVERLAY_LOAD_ADDR=0x800742D0
OVERLAY_RANGE=0x800742D0:0x800A1AD0

# libcd's state block (D_8006B568), read by the translated CdStatus,
# CdLastPos, CdMode and CdLastCom; and the slot the translated CdReadCallback
# stores the read-completion handler in.
LIBCD_BLOCK_ADDR=0x8006B568
CD_READ_CB_ADDR=0x8006B3D0

# No render-channel substitutions: that table is a set of Spyro 1 addresses.
CHANNEL_MANIFEST=""

# Split-target convergence is needed here: this decomp emits no
# `glabel D_<addr>`, so extract_asm_dispatch_targets.py harvests nothing
# and cross-piece jumps in handwritten asm have no dispatch entry.
MAIN_EXE_THIRD_PASS=1

# `jr <reg>` sites the recompiler rewrites to `return` because the register
# reloads a spilled $ra (see code_generator.cpp, saved-ra pattern); the regen
# fails when the count differs.
RA_SPILL_RETURNS=1

# No level-keyed installer switch: every level installs its own callback.
LEVEL_ID_ADDR=
