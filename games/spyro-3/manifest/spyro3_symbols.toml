kind = "function"
note = "func_8001C368 - the dome renderer (cyclorama.s); the cyclorama hook site"

[[symbol]]
name = "F_VISIBILITY"
addr = 0x8002D0D8
kind = "function"
note = "func_8002D0D8(a0) - computes the sector visibility bytes in the scratchpad (a0=0 world at 0x1F800000, a0=1 sky at 0x1F8003C0) from the occlusion data and the camera's +0x34 position copy"

[[symbol]]
name = "F_CAMERA_MATRICES"
addr = 0x8004F6C4
kind = "function"
note = "func_8004F6C4 - builds the sky and world matrices from the angles at G_CAMERA+0x44"

[[symbol]]
name = "G_SIN"
addr = 0x800658A0
note = "g_Sin (psx.map); 256 s16 1.12 entries per circle, cos = g_Cos 0x80065920 at +0x80. asm/stdutil.s func_8004E9E4 (sin) and func_8004EA2C (cos) index it by angle>>4 with a 4-bit lerp; func_8004F6C4 builds the camera rotation matrix from the pair"

[[symbol]]
name = "G_MOBYSHADOWS"
addr = 0x8006E388
note = "moby drop-shadow descriptor {uv0+clut, uv1+tpage, list end}: func_8002DDA8 loads +0x00/+0x04 as the shadow sprite's two UV words and +0x08 as the drawn-moby list terminator (asm/mobyfunc.s:921-923); the level loader func_8002B810 writes the two UV words from the level asset table (asm/nonmatchings/loaders/func_8002B810.s:270-275); the moby draw stores the list cursor back to +0x08 (asm/mobydraw.s:579-582). Dump: uv0=0x2FE76000, uv1=0x80587F1F (tpage 0x8058, ABR 2 subtract, 4bpp), end=0x801BC940"

[[symbol]]
name = "D_PLAYERSHADOW"
addr = 0x8006FBA8
note = "the player's ground-shadow state block, read by the player-shadow draw func_8002D9BC (asm/mobyfunc.s:622-884): +0x00 a flag scaling every silhouette radius by 3/4, +0x04/+0x08/+0x0C the shadow's world position, +0x10 a packed byte-angle triple (Y bits 16-23, X bits 8-15, Z bits 0-7) whose top byte at +0x13 suppresses the draw, +0x14 the ordering-key bias"

[[symbol]]
name = "D_SHADOW_RING"
addr = 0x80068C0C
note = "16 packed s16 XZ direction pairs, one per player-shadow ring point; func_8002D9BC multiplies each by its ring radius and shifts right 10 to form the local corner (asm/mobyfunc.s:775-790)"

[[symbol]]
name = "F_PLAYER_SHADOW"
addr = 0x8002D9BC
kind = "function"
note = "the player's ground-shadow renderer (asm/mobyfunc.s:622-884), called once after the two player draws by fDrawSpyroAndMobys (asm/nonmatchings/drawutil/func_8001EC5C.s:79); emits 16 POLY_G3 semi-transparent, each bundled with its own DR_MODE 0xE1000640 (ABR 2, subtractive)"

[[symbol]]
name = "F_MOBY_SHADOWS"
addr = 0x8002DDA8
kind = "function"
note = "func_8002DDA8 DrawMobyShadows (asm/mobyfunc.s:887-1229; named in include/mobyfunc.h) - the moby drop-shadow renderer, called fourth by fDrawSpyroAndMobys func_8001EC5C; the shared shadow feeder's hook site"

[[symbol]]
name = "D_PORTALS"
addr = 0x8006C530
note = "pointer to the level's portal record array (0x44 bytes per record: five world-space pentagon vertices +0x00, preview mesh pointer +0x3C, enable/draw radius +0x40, back-side flag +0x41, level id +0x42, opening counter +0x43); set at level load by func_loading_800795BC"

[[symbol]]
name = "D_PORTALCOUNT"
addr = 0x8006C5E0
note = "portal record count; the portal pass loops over it (asm/nonmatchings/drawutil/func_8001EDEC.s)"

[[symbol]]
name = "D_PORTAL_BLOCK"
addr = 0x8006ED88
note = "the portal pass's parameter block for the preview leaf: +0x00 y-min, +0x04 y-max, +0x08 x-min, +0x0C x-max, +0x10 preview mesh pointer, +0x14 depth >> 7, +0x18/+0x1A/+0x1C far colour halfwords at GTE scale, +0x1E IR0, +0x20 edge count, +0x24 8-byte edge entries of packed screen points; written by func_8001EDEC per portal, read only by func_8001C8C8"

[[symbol]]
name = "F_PORTAL_PASS"
addr = 0x8001EDEC
kind = "function"
note = "func_8001EDEC (fDrawSkyboxPortals) - per portal: gates, projects the pentagon with the sky matrix, fills D_PORTAL_BLOCK, calls F_PORTAL_LEAF with 1 then 0"

[[symbol]]
name = "F_PORTAL_LEAF"
addr = 0x8001C8C8
kind = "function"
note = "func_8001C8C8 (cyclorama.s:378) - draws one pre-projected preview mesh (a0 > 0 the base record, a0 == 0 the record at +0x3C) clipped to D_PORTAL_BLOCK's pentagon edges with two DPCS fades"

[[symbol]]
name = "G_MOBYARRAY"
addr = 0x8006C550
note = "g_MobyArrayPtr: points at the first Moby of the stride-0x58 array (asm/mobydraw.s:29-30, advance :63); the array ends at the first element whose state byte +0x48 is -1 (:64-72). Same pointer the manifest's moby_array region hashes"

[[symbol]]
name = "G_MOBYMODELS"
addr = 0x8006EE2C
note = "the moby model table, indexed by the class halfword at Moby+0x36 (asm/mobydraw.s:47-48,109-114). A KSEG0 entry is an animated Model, a KUSEG entry the second (simple) model kind (:116); Sunrise Spring dump: 33 animated, 11 simple, 724 empty of 768 slots"

[[symbol]]
name = "F_MOBY_CULL"
addr = 0x80030478
kind = "function"
note = "QueueToDrawMobys (include/mobydraw.h:4, asm/mobydraw.s:11): the cull pass that builds the stride-0x44 animated record list and the stride-0x10 static one in the draw scratch, and writes the drawn verdict back to Moby+0x4D (:73,224)"

[[symbol]]
name = "F_MOBY_DRAW_ANIM"
addr = 0x80031124
kind = "function"
note = "DrawAnimatedMobys (asm/mobydraw.s:865): walks the stride-0x44 record list, decodes and RTPS-projects each model's vertices, applies the keyframe faceblock patches and emits G3/GT3/G4/GT4"

[[symbol]]
name = "F_MOBY_DRAW_STATIC"
addr = 0x80033C5C
kind = "function"
note = "DrawStaticMobys (asm/mobydraw.s:3862): the second model kind, walked from its own stride-0x10 record list"

[[symbol]]
name = "F_PLAYER_DRAW"
addr = 0x8003CDA0
kind = "function"
note = "DrawSpyro (asm/spyrodraw.s:12): the player avatar's own draw, run twice a tick - the mirrored copy with g_Spyro+0x2C set, then the avatar with it clear; the shared player feeder's hook site"

[[symbol]]
name = "D_SPYRO_BLEND"
addr = 0x80066530
note = "the 256-byte table the player draw looks the keyframe blend byte up in (g_Spyro+0x1C for the body, +0x1D for the head) before shifting the result left four into the part record's IR0 field (asm/spyrodraw.s:43-45,66,109-112,134)"

[[symbol]]
name = "D_SPYRO_ANIMS"
addr = 0x8006C558
note = "pointer to the 256-entry Animation table the player draw indexes by the animation word's low byte (asm/spyrodraw.s:33-34,37-40); written at level load"

[[symbol]]
name = "G_SPYRO"
addr = 0x80070328
note = "g_Spyro (globals.toml names the address g_Spyro / spyro; struct Spyro, 0x2E8 bytes, manifest/struct_layout.toml): position +0x00, bodyRotation +0x0C, headRotation +0x10, bodyAnimation +0x14, headAnimation +0x18, OT bias +0x1E, mirror fields +0x28/+0x2C, pass gate +0x288. The player draw spyrodraw.s reads it for the two part records; features/freecam.c and game_extras_impl.c already read the position words at this address"

[[symbol]]
name = "G_GAMESTATE"
addr = 0x8006E344
note = "game.state (globals.toml names the address game; asm/data/game.bss.s), the first word of the Game struct: 0 gameplay, 3 fade-in, 7 loading glide; asm/update.s branches the tick regime on it, skip_to_level.c and game_extras_impl.c read it at this address"

[[symbol]]
name = "F_UI_OT_INSERT"
addr = 0x8004E758
kind = "function"
note = "func_8004E758 (asm/stdutil.s:84-100) - links a0 into the 2D ordering table at D_8006C638, instruction-for-instruction Spyro 1's func_800168DC with a different head global; called by drawutil, hud and updatepause and by no 3D translation unit, so it is the 2D feeder's chokepoint hook site"

[[symbol]]
name = "F_UI_OT_INSERT_SLOT"
addr = 0x8004E71C
kind = "function"
note = "func_8004E71C(prim, slot) (asm/stdutil.s:65-82, handwritten) - the slotted form of func_8004E758: it loads the table base from D_8006C634, adds slot << 3, and appends a0 at that entry's tail by the same three-store splice. Its call sites are the loading-screen image func_80059358 (src/warp.c:568,580) and the credits overlay (src/overlays/credits/credits.c:17,31), so it carries 2D only; the 2D layer hooks it to record the slot of the loading picture's sprites for the link rank"

[[symbol]]
name = "F_UI_OT_STITCH"
addr = 0x8004E664
kind = "function"
note = "func_8004E664(n) (asm/stdutil.s:11-62, handwritten) - the ordering-table stitch: from min(slot n, D_8006C7D4 + 8) down to the 2D entry D_8006C638 (D_8006C634 - 8) it links each non-empty slot's tail to the next non-empty slot's head and clears the slot, ends the chain at D_8006529C and returns the first head; called by Draw (draw/Draw.s:271,314,351,386,399) and drawutil/func_80020168.s:85 before DrawOTag"

[[symbol]]
name = "F_UI_FADE"
addr = 0x800200A0
kind = "function"
note = "func_800200A0(abrMode, r, g, b) (asm/nonmatchings/drawutil/func_800200A0.s:4-55) - the full-screen fade emitter: func_8005C564(prim, 1, 0, abrMode << 5, 0) then a 0x2A POLY_F4 spanning x 0..0x200, y 0x0C..0xE4, each linked through func_8004E758; src/draw.c:121 drives it from D_8006C598"

[[symbol]]
name = "F_UI_LETTERBOX"
addr = 0x8001FF44
kind = "function"
note = "func_8001FF44() (asm/nonmatchings/drawutil/func_8001FF44.s:4-99) - the cutscene letterbox emitter: steps the bar height D_8006C64C by 1 toward 12 while D_8006C74C is set (cleared first when bit 0x80000 of D_80070328+0x210 is set) and toward 0 otherwise, then, when the height is above 0, links two frame-width black 0x28 POLY_F4s through func_8004E758, y 0x0C..0x0C+D_8006C64C and 0xE4-D_8006C64C..0xE4; draw/func_8001E460.s:117 calls it"

[[symbol]]
name = "F_CREDITS_FADE"
addr = 0x800744BC
kind = "function"
note = "func_credits_800744BC(abrMode, r, g, b) (src/overlays/credits/credits.c:10-33, MATCHING) - the credits overlay's fade emitter, the shape of F_UI_FADE: func_8005C564(prim, 1, 0, abrMode << 5, 0) then a 0x2A POLY_F4 spanning x 0..0x200, y 0x0C..0xE4, each linked through func_8004E71C at slot 8; its one caller func_credits_80076118 (asm 0x800762A8-0x800762C8) passes (2, D_8006C598 << 4 x3) while D_8006C598 != 0. Overlay-window address: credits magic 7 only"

[[symbol]]
name = "F_TEXT_SPRT"
addr = 0x8002E748
kind = "function"
note = "func_8002E748(str, x, y, colourIndex, clipRange) (asm/mobyfunc.s:1532-1686) - handwritten glyph emitter: one 0xC-byte DR_MODE word 0xE1000618 then one 0x14-byte SPRT per glyph, chained tag-to-tag and linked into D_8006C638 inline without calling func_8004E758"

[[symbol]]
name = "F_TEXT_SPRT_PER_GLYPH"
addr = 0x8002E970
kind = "function"
note = "func_8002E970 (asm/mobyfunc.s:1687-1845) - the quad-form variant of func_8002E748: one 0x28-byte POLY_FT4 per glyph, command byte 0x2C at packet offset 7 (asm/mobyfunc.s:1814-1815) and tpage 0x618 in the packet's own tpage halfword at +0x16 (asm/mobyfunc.s:1714); it carries no DR_MODE and advances 10 or 8 px by the clipRange flag"

[[symbol]]
name = "F_LOADING_SPRT"
addr = 0x80059358
kind = "function"
note = "func_80059358(brightness, otIndex) (src/warp.c:558-579) - the loading-screen image emitter: four DR_MODE (tpage 264 + 2*i, the 128-px-wide pages of the 512x216 picture LoadImage'd to VRAM (512,0)) each followed by a 0x14-byte SPRT of code 100 at x = i*128, y 12, 128x216, rgb set to the fade level, chained in the primitive buffer and linked through func_8004E71C rather than func_8004E758"

[[symbol]]
name = "F_PARTICLES_DRAW"
addr = 0x8003AA38
kind = "function"
note = "the particle renderer (asm/partsdraw.s:11-799, handwritten: it spills s0-s7/gp/sp/fp/ra to D_80071540 and uses those registers as its own), the last call of fDrawWorld func_8001E460; loads the camera matrix from G_CAMERA+0x00 with TR 0, walks the 0x20-byte pool at D_PARTS_ARRAY and appends one primitive per drawn record, stopping when the polybuf cursor comes within 0x400 bytes of D_POLYBUF_END. Six classes: 0 a 4-word LINE_F2 dot, 1 a 5-word LINE_G2 streak, 2/3/4 and 5-and-up 10-word POLY_FT4 billboards. Classes 0-4 link at their own depth bucket ((SZ3 >> 5) * 8 from D_OT_BASE) and stamp record byte +3; class 5 and up link at the fixed entry D_OT_BASE - 8 and stamp nothing"

[[symbol]]
name = "D_PARTS_ARRAY"
addr = 0x8006C554
note = "partsArrayPtr (src/loaders.c:13); the word holding the base of the particle pool the renderer walks, 0x20 bytes per record: +0x00 the signed selector halfword (bits 8-11 the class, high byte 0xFF ends the pool, otherwise negative = inactive slot), +0x03 the drawn stamp, +0x04 X in the low half and Y in the high half, +0x08 Z in the low half, all in quarter world units, +0x0C the primitive colour word"

[[symbol]]
name = "F_GLOW_DRAW"
addr = 0x8002ECA8
kind = "function"
note = "func_8002ECA8 (asm/mobyfunc.s:1920-2166), the glow-ring renderer: called by fDrawWorld func_8001E460 under mask bit 0x10 (asm/nonmatchings/draw/func_8001E460.s:28) and a second time by the pause screen func_80058408 (:43). Walks the 16-slot pool at D_GLOW_POOL and, per live record, emits one bundled draw-mode packet 0xE1000620 followed by up to sixteen POLY_G3 semi-transparent fanned from the record's projected centre, all chained into one bucket off D_OT_BASE"

[[symbol]]
name = "D_GLOW_POOL"
addr = 0x8006E1F4
note = "the glow-ring pool the renderer walks, 16 records of 0x14 bytes: +0x00 world X, +0x04 Y, +0x08 Z, +0x0C the primitive colour word, +0x10 packed {shape index, size, rotation phase, signed ordering-table bias}; a zero shape byte is a free slot and func_8002EC50 allocates the first one it finds (asm/mobyfunc.s:1894-1918)"

[[symbol]]
name = "F_GLINT_DRAW"
addr = 0x8002F098
kind = "function"
note = "func_8002F098 (asm/mobyfunc.s:2195-2507), the gem-glint renderer: called by fDrawWorld func_8001E460 under mask bit 0x10 (asm/nonmatchings/draw/func_8001E460.s:30), its only caller. Walks the 16-slot pool at D_GLINT_POOL and, per live record, emits either one bundled draw-mode packet 0xE1000620 followed by eight POLY_G4 semi-transparent quads of a four-point star (half-world view depth under 0x2000) or two opaque LINE_F2 of a plain cross (at or above it), chained into a bucket off D_OT_BASE"

[[symbol]]
name = "D_GLINT_POOL"
addr = 0x8006DEF8
note = "the gem-glint pool the renderer walks, 16 records of 0x10 bytes: +0x00 world X, +0x04 Y, +0x08 Z, +0x0C packed {remaining lifetime, size, spin phase, colour-table row}; a zero lifetime byte is a free slot and func_8002F040 allocates one, called from all 37 level-moby overlays. The colour table is D_80066B64 (asm/data/game.data.s:3098), six rows of three words {pale centre, spike tip, near-black waist}, every word carrying 0x3A in its top byte"

[[symbol]]
name = "F_GLINT2_DRAW"
addr = 0x8002F5B4
kind = "function"
note = "func_8002F5B4 (asm/mobyfunc.s:2547-2937), the jittered-beam renderer: called by fDrawWorld func_8001E460 (asm/nonmatchings/draw/func_8001E460.s:32), its only caller. Walks the 8-slot pool at D_GLINT2_POOL and, per live record, interpolates count+1 camera-relative points from the head world position to the tail one, displaces each interior point by the signed 8-bit fields of its own stored random halfword, widens every point into a pair perpendicular to the local path direction, RTPSes the pairs into the scratchpad at 0x1F800100 and appends one or two 8-word POLY_FT3 semi-transparent per segment, each linked into a bucket off D_OT_BASE keyed on its four corners mean SZ3. The whole record is dropped when the four screen outcodes of every corner share a bit or when the middle point SZ3 reaches 0x5000; between 0x4000 and 0x5000 a DPCS fades the record colour toward black"

[[symbol]]
name = "D_GLINT2_POOL"
addr = 0x80072430
note = "the jittered-beam pool the renderer walks, 8 records of 0x30 bytes: +0x00 head world XYZ, +0x0C tail world XYZ, +0x18 the primitive colour word whose top byte the spawner sets to 0x26 (POLY_FT3 semi-transparent), +0x1C packed {segment count, jitter shift, re-randomize flag halfword}, +0x20 one random halfword per interior point. A zero count byte is a free slot and func_8002F540 allocates the first one it finds, seeding the halfwords from rand (asm/mobyfunc.s:2511-2543)"

[[symbol]]
name = "F_TRACER_RIBBON"
addr = 0x8002FB68
kind = "function"
note = "func_8002FB68 (asm/mobyfunc.s:2940-3181), the point-ring tracer ribbon: called by fDrawWorld func_8001E460 under mask bit 0x10 (asm/nonmatchings/draw/func_8001E460.s:32). Walks the 0x20-slot array at D_TRACER_RING, projects each live record's ring points into the scratchpad and appends one 13-word POLY_GT4 per consecutive pair, linked into a bucket off D_OT_BASE"

[[symbol]]
name = "F_TRACER_MESH"
addr = 0x8002FEE0
kind = "function"
note = "func_8002FEE0 (asm/mobyfunc.s:3182-3418), the indexed tracer mesh: called eight times per tick by fDrawWorld func_8001E460 over the 0x14-byte descriptors at D_80070260 (asm/nonmatchings/draw/func_8001E460.s:45). Projects the descriptor's vertex list into the scratchpad as {screen XY, MAC3 and outcode} pairs and appends one 13-word POLY_GT4 per index entry; it also stores the highest ordering-table bucket it touched to D_OT_TOP, so its body must run exactly once"

[[symbol]]
name = "D_TRACER_RING"
addr = 0x80070610
note = "D_80070610, the tracer ribbon array (games/spyro-3/spyro-3/include/tracers.h types it as Tracer[0x20]): 0x6C bytes per record, +0x00 the live pointer, +0x04 a 16-entry circular buffer of packed unsigned XYZ halves, +0x64 packed {head index, point count, signed half-width byte}, +0x68 the colour-plus-command word the DPCS fade starts from"

[[symbol]]
name = "F_FLAME_DRAW"
addr = 0x8002D2C4
kind = "function"
note = "func_8002D2C4 (asm/mobyfunc.s:153) - the fire-breath ribbon emitter, the other game's func_80058D64 over all 446 instructions but for constants and addresses. Two call sites in func_8001EC5C, the second only when the game word is 6 (asm/nonmatchings/drawutil/func_8001EC5C.s:81-102); the flame feeder's hook site"

[[symbol]]
name = "D_FLAME_STATE"
addr = 0x8007179C
note = "the flame state block, 0xC4 bytes: ribbon origin +0x00, the strip's two texture words +0x10 and +0x14, per-strand keyframe counter +0x20 and length +0x28, active flag +0x98, attach SHORTMATRIX +0xB0 (five words, ending the block). The emitter loads the base at asm/mobyfunc.s:174 and the matrix at :212"

[[symbol]]
name = "D_FLAME_CONN"
addr = 0x80069490
note = "flame strip connectivity, one word per keyframe counter value: bits 24-31 the spine offset in 8-byte records, bits 8-15 the colour/UV ramp start, bits 16-23 the cross-section count. Strands 4-7 read the same table +0x78 (asm/mobyfunc.s:231,247)"

[[symbol]]
name = "D_FLAME_GEOM"
addr = 0x800695F8
note = "flame cross-section spine, 8-byte records of packed {X, Z, index, sine phase}. Strand s < 4 starts at +0xB0*s, strand s >= 4 at +0x2C0 + 0xE0*(s-4) (asm/mobyfunc.s:239,244,246,253). Byte-identical to the other game's table"

[[symbol]]
name = "D_FLAME_CAP_COLOURS"
addr = 0x80069C38
note = "the first-cell cap colour sets, two runs of four words. The emitter reads the set at +0x00 unless G_LEVELID holds 0x1F, when it reads the set at +0x10 (asm/mobyfunc.s:331,334-341)"
