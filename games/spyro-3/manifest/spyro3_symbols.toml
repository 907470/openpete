# Curated PSX symbol aliases for the Spyro 3 engine layout (renderer/layout.c).
#
# Hand-maintained: the readable ALIAS the layout uses, joined by address to
# the authoritative manifest (globals.toml / symbols.toml) at build time.
# tools/gen_symbols_header.py generates gen/spyro3_symbols.gen.h from this and
# FAILS the build if any `addr` is not a symbol start in the manifest.
#
# The decomp names almost nothing here, so each row's note carries the
# identification evidence: the asm site that reads or writes the address and
# the RAM dump / write census that confirmed it (Sunrise Spring, level 10,
# gameplay anchor at VBL 2500).

[[symbol]]
name = "G_ENVIRONMENT"
addr = 0x8006D048
note = "Unk_8006d048 (common.h); the world draw func_80022378 reads +0x00 sector list, +0x04 count, +0x30 visibility-computed flag, +0x34..+0x3C far colour (ctc2 $21..$23); func_8002D0D8 reads +0x08 world / +0x0C sky occlusion data and +0x10/+0x14 their enable words. Dump: list 0x8008DC84, 138 sectors, sorted pointers"

[[symbol]]
name = "G_CYCLORAMA"
addr = 0x8006E334
note = "sky header: +0x00 count (37), +0x04 sector pointer list, +0x08 background colour 0x00BBGGRR (equals the DRAWENV clear colour at DB+0x18 in the dump); read by the sky draw func_8001C368"

[[symbol]]
name = "G_CAMERA"
addr = 0x8006DFF8
note = "g_Camera; +0x00 sky matrix and +0x14 world matrix written per tick by func_8004F6C4, +0x28 position by the camera update, +0x34 the Draw-time position copy func_8002D0D8 reads, +0x44 rotation angles (pitch +0x46, yaw +0x48)"

[[symbol]]
name = "G_LEVELID"
addr = 0x8006C5BC
note = "currentLevel; the level number the loader loads (10..50); 10 in the dump"

[[symbol]]
name = "G_CUR_DB"
addr = 0x8006C600
note = "pointer to the draw buffer under construction; func_8001E640 flips it between G_DB and G_DB+0x74 at tick start"

[[symbol]]
name = "G_DB"
addr = 0x8006FBFC
note = "draw-buffer pair, stride 0x74: DRAWENV +0x00 (clip 512x216, clear colour +0x18), DISPENV +0x5C, polybuf base +0x70 (0x801A2508 / 0x801BE508)"

[[symbol]]
name = "D_POLYBUF_CURSOR"
addr = 0x8006C664
note = "primitive cursor: reset to the current DB's +0x70 by func_8001E640, advanced 0x1C per prim and stored at exit by both draws"

[[symbol]]
name = "D_POLYBUF_END"
addr = 0x8006C668
note = "primitive buffer end = base + D_POLYBUF_SIZE, written by func_8001E640; the sky draw guards against it minus 0x400"

[[symbol]]
name = "D_POLYBUF_SIZE"
addr = 0x8006C7DC
note = "primitive buffer size per half (0x1C000 in the dump)"

[[symbol]]
name = "D_OT_BASE"
addr = 0x8006C634
note = "ordering table base (0x801DA510), written at boot; both draws link prims into buckets off it"

[[symbol]]
name = "D_OT_TOP"
addr = 0x8006C7D4
note = "highest ordering-table bucket written: reset to D_OT_BASE + 0x1000 per tick, stored by both draws at exit"

# ---- function addresses (validated against symbols.toml) ----
[[symbol]]
name = "F_WORLD_DRAW"
addr = 0x80022378
kind = "function"
note = "func_80022378 — the world renderer (environment.s); the terrain hook site"

[[symbol]]
name = "F_SKY_DRAW"
addr = 0x8001C368
kind = "function"
note = "func_8001C368 — the dome renderer (cyclorama.s); the cyclorama hook site"

[[symbol]]
name = "F_VISIBILITY"
addr = 0x8002D0D8
kind = "function"
note = "func_8002D0D8(a0) — computes the sector visibility bytes in the scratchpad (a0=0 world at 0x1F800000, a0=1 sky at 0x1F8003C0) from the occlusion data and the camera's +0x34 position copy"

[[symbol]]
name = "F_CAMERA_MATRICES"
addr = 0x8004F6C4
kind = "function"
note = "func_8004F6C4 — builds the sky and world matrices from the angles at G_CAMERA+0x44"

[[symbol]]
name = "G_SIN"
addr = 0x800658A0
note = "g_Sin (psx.map); 256 s16 1.12 entries per circle, cos = g_Cos 0x80065920 at +0x80. asm/stdutil.s func_8004E9E4 (sin) and func_8004EA2C (cos) index it by angle>>4 with a 4-bit lerp; func_8004F6C4 builds the camera rotation matrix from the pair"

[[symbol]]
name = "G_MOBYSHADOWS"
addr = 0x8006E388
note = "moby drop-shadow descriptor {uv0+clut, uv1+tpage, list end}: func_8002DDA8 loads +0x00/+0x04 as the shadow sprite's two UV words and +0x08 as the drawn-moby list terminator (asm/mobyfunc.s:921-923); the level loader func_8002B810 writes the two UV words from the level asset table (asm/nonmatchings/loaders/func_8002B810.s:270-275); the moby draw stores the list cursor back to +0x08 (asm/mobydraw.s:579-582). Dump: uv0=0x2FE76000, uv1=0x80587F1F (tpage 0x8058, ABR 2 subtract, 4bpp), end=0x801BC940"

[[symbol]]
name = "F_MOBY_SHADOWS"
addr = 0x8002DDA8
kind = "function"
note = "func_8002DDA8 DrawMobyShadows (asm/mobyfunc.s:887-1229; named in include/mobyfunc.h) — the moby drop-shadow renderer, called fourth by fDrawSpyroAndMobys func_8001EC5C; the shared shadow feeder's hook site"

[[symbol]]
name = "D_PORTALS"
addr = 0x8006C530
note = "pointer to the level's portal record array (0x44 bytes per record: five world-space pentagon vertices +0x00, preview mesh pointer +0x3C, enable/draw radius +0x40, back-side flag +0x41, level id +0x42, opening counter +0x43); set at level load by func_loading_800795BC"

[[symbol]]
name = "D_PORTALCOUNT"
addr = 0x8006C5E0
note = "portal record count; the portal pass loops over it (asm/nonmatchings/drawutil/func_8001EDEC.s)"

[[symbol]]
name = "D_PORTAL_BLOCK"
addr = 0x8006ED88
note = "the portal pass's parameter block for the preview leaf: +0x00 y-min, +0x04 y-max, +0x08 x-min, +0x0C x-max, +0x10 preview mesh pointer, +0x14 depth >> 7, +0x18/+0x1A/+0x1C far colour halfwords at GTE scale, +0x1E IR0, +0x20 edge count, +0x24 8-byte edge entries of packed screen points; written by func_8001EDEC per portal, read only by func_8001C8C8"

[[symbol]]
name = "F_PORTAL_PASS"
addr = 0x8001EDEC
kind = "function"
note = "func_8001EDEC (fDrawSkyboxPortals) — per portal: gates, projects the pentagon with the sky matrix, fills D_PORTAL_BLOCK, calls F_PORTAL_LEAF with 1 then 0"

[[symbol]]
name = "F_PORTAL_LEAF"
addr = 0x8001C8C8
kind = "function"
note = "func_8001C8C8 (cyclorama.s:378) — draws one pre-projected preview mesh (a0 > 0 the base record, a0 == 0 the record at +0x3C) clipped to D_PORTAL_BLOCK's pentagon edges with two DPCS fades"
