# games/spyro-3/manifest/gameplay_state_regions.toml — the gameplay-readable
# bytes the oracle hashes every tick. Generated into the
# build by tools/gen_state_regions.py (cmake/openpete_game.cmake): the C
# table the exe registers, the flat table the DuckStation capture module
# reads, and their shared FNV-1a-64 in the trace header.
#
# Derivation (tools/derive_state_regions.py spyro-3): the main image's
# .data/.sdata/.sbss/.bss extents from spyro-3/build/psx.map, minus the
# psyq_internal extents and every [[expect]] range of ram_diff_expect.toml
# (load_timing and pad_model classes, measured at the loop anchor, hit 1,
# the only pre-load hit aligned on both sides), the named rows carved out,
# the rest coalesced: one row per extent, symbol names as comments. Then
# the overlay image union, the moby pool, and the libcd mirror rows.
#
# Row fields beyond the generator's (start/length or the indirect_array
# keys, mask_offsets/mask_per_element, cd_load_transient, gameplay_neutral,
# constant_ok): `class` is gameplay | render_scratch | psyq_mirror. Every
# row is gameplay on the stock path; the OT and primitive buffers inside
# the .bss extents become render_scratch rows when a presentation layer
# reaches this game (openpete-per-game-oracle D4).
#
# Carve-outs (commented rows; the ranges are subtracted above):
#   load_timing  D_8006C644, D_8006E484, D_8006C7CC, title overlay 0x80080EE0,
#                0x80080F64-0x80080F69, 0x80080FC4-0x80080FE1 — counters the
#                title's VSync loop advances while the reference spends
#                0.4 VBL/sector on the 13 pre-anchor reads; owner
#                openpete-per-game-oracle (D5d pre-anchor charge)
#   pad_model    D_8007143C, D_800718DC, pad2 — the analog pad's poll
#                answer; owner openpete-spyro2-3-bringup P16

[[region]]
name        = "levelIndex"
start       = 0x8006C58C
length      = 0x4
class       = "gameplay"
description = "Current level index (decomp name; psx.map:7624), carved out of the .sbss extent as its own row"

[[region]]
name        = "psyq_rand_seed"
start       = 0x80073F3C
length      = 0x4
class       = "gameplay"
description = "PSYQ rand/srand seed word D_80073F3C (libc .bss, inside the subtracted psyq_internal extent). Seeded from root counter 2 (func_80054E5C: srand(*0x1F801120)) at boot and with 1234 when the demo starts (loaders/func_8002B810)"

