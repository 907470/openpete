# games/spyro-3/manifest/gameplay_state_regions.toml - the gameplay-readable
# bytes the oracle hashes every tick. Generated into the
# build by tools/gen_state_regions.py (cmake/openpete_game.cmake): the C
# table the exe registers, the flat table the DuckStation capture module
# reads, and their shared FNV-1a-64 in the trace header.
#
# Derivation (tools/derive_state_regions.py spyro-3): the main image's
# .data/.sdata/.sbss/.bss extents from spyro-3/build/psx.map, minus the
# psyq_internal extents and every [[expect]] range of ram_diff_expect.toml
# (none remain: the load-timing, VBL-count and pad-model classes measured
# at the loop anchor's hit 1 converge under the reference's schedule and
# openpete's DualShock pad model), the named rows carved out, the rest
# coalesced: one row per extent, symbol names as comments. Then the
# overlay image union (--overlay 0x800742D0:0x2D800: one row, every byte a
# CdRead destination), the moby array, and the libcd mirror rows.
#
# Row fields beyond the generator's (start/length or the indirect_array
# keys, mask_offsets/mask_per_element, cd_load_transient, gameplay_neutral,
# constant_ok): `class` is gameplay | render_scratch | psyq_mirror. No row
# is render_scratch: no OT or primitive buffer of this game has been
# located inside the main image (Spyro 2's DR_MODE packets and both games'
# ordering tables sit in level RAM, outside these rows). A render-side
# range found inside an extent when the golden lands is split out as a
# named render_scratch row, never absorbed by a flag on the extent.

# The arguments tools/derive_state_regions.py derived the direct rows from;
# `--check` re-derives and compares (ctest state_regions_derivation_spyro-3).
[derivation]
named   = ["psyq_rand_seed=0x80073F3C:4", "levelIndex=0x8006C58C:4", "g_ActiveSounds=0x8006FCE4:0x420"]
overlay = "0x800742D0:0x2D800"
min_row = 4

[[region]]
name        = "levelIndex"
start       = 0x8006C58C
length      = 0x4
class       = "gameplay"
description = "Current level index (decomp name; psx.map:7624), carved out of the .sbss extent as its own row"

[[region]]
name        = "psyq_rand_seed"
start       = 0x80073F3C
length      = 0x4
class       = "gameplay"
description = "PSYQ rand/srand seed word D_80073F3C (libc .bss, inside the subtracted psyq_internal extent). Seeded from root counter 2 (func_80054E5C: srand(*0x1F801120)) at boot and with 1234 when the demo starts (loaders/func_8002B810)"

# .data extent 0: 273 symbols; named: g_CheatCodes, speedwayRecords, sparx, sparxDefaults, g_Sin, g_Cos, SkillPoints, lvlIdToIndex, levelIndexToHomeworldLevelId, g_HudEntries, g_LoadingScreenStrings, g_LoadingScreenStringTables
[[region]]
name   = "main_data_80064f9c"
start  = 0x80064F9C
length = 0x4F60
class  = "gameplay"

# .sdata extent 1: 67 symbols; named: speechLba, localDifficultyOverride
[[region]]
name   = "main_sdata_8006c3b0"
start  = 0x8006C3B0
length = 0x144
class  = "gameplay"

# .sbss extent 2: 43 symbols; named: loadStage, g_Portals, currentDemoInput, g_MobyArrayPtr, mobyArrayPtr
[[region]]
name   = "main_sbss_8006c4f4"
start  = 0x8006C4F4
length = 0x98
class  = "gameplay"

# .sbss extent 3: 167 symbols; named: dragonModelPtr, g_CurrentLevel, currentLevel, area, pauseMenuButtonPresses, g_PortalCount, deltaTime, soundTablePtr, g_SoundTablePtr, isDemoMode, g_SpuDefinitionsPtr, spuDataPtr, g_AllocatedMobyArrayPtr, allocatedMobysPtr, language, collectionAreaOffset
[[region]]
name   = "main_sbss_8006c590"
start  = 0x8006C590
length = 0x264
class  = "gameplay"

# .bss extent 4: 356 symbols; named: unsavedData, savedData, wadHeader, g_Camera, camera, game, g_Layout, streamingData, g_Pad, pad, speedwayData, g_CheatFlags, pauseData, pauseData2
[[region]]
name   = "main_bss_8006c7f8"
start  = 0x8006C7F8
length = 0x34EC
class  = "gameplay"

# The 24 voice slots of the game's sound allocator (stride 0x2C), carved
# out of the .bss extent as a host_precision row. Each slot's state byte
# (+0) is stepped by func_8003C184 from SpuGetAllKeysStatus; the step from
# playing (2) to keyed off (5) waits for SPU_ON_ENV_OFF, the envelope's
# arrival at zero, which the host SPU resolves at whole-VBL granularity and
# hardware sample by sample, so on some ticks a slot frees one tick apart.
# PlaySound's scan then takes a different free slot, and the slot's other
# fields (the request's volume, pitch and owner) follow the choice until
# the slots empty again. The rows around it (the mobys' sound handles,
# g_Spyro, the rand seed) stay strict, so a slot choice reaching gameplay
# fails the gate there.
[[region]]
name   = "g_ActiveSounds"
start  = 0x8006FCE4
length = 0x420
class  = "gameplay"
host_precision = true
diverge_baseline = 7401
description = "g_ActiveSounds[24] (ActiveSound, stride 0x2C): the sound allocator's voice slots, resolved from the host SPU's whole-VBL envelope"

# .bss extent 5: 443 symbols; named: eggsCollectedArray, spyro, g_Spyro, g_CheatBuffer, demoPadState, progressFlags, g_CollisionData, g_Hud, pad2, levelWadHeader, loadingData
[[region]]
name   = "main_bss_80070104"
start  = 0x80070104
length = 0x24E8
class  = "gameplay"

# overlay image union 0x800742D0-0x800A1AD0, cut at 0 expect range(s) into 1 row(s); every piece is a CdRead destination
[[region]]
name   = "overlay_image_0"
start  = 0x800742D0
length = 0x2D800
class  = "gameplay"
cd_load_transient = true

# The moby array in level RAM: g_MobyArrayPtr (0x8006C550) points at the
# first Moby (stride 0x58: savepoint.c divides by 0x58), the level's mobys
# run to g_AllocatedMobyArrayPtr (0x8006C704) and allocated mobys follow;
# the array ends at the first element whose state byte (+0x48) is -1
# (updatemobys.s 0x800556D8 loop exits on it; no count word exists). Both
# pointers sit inside the .sbss rows above. Cap 1024 elements; the attract
# demo holds 97-119.
[[region]]
name          = "moby_array"
kind          = "indirect_array"
base_ptr      = 0x8006C550
element_size  = 0x58
max_elements  = 1024
live_sentinel = { offset = 0x48, value = 0xFF }
class         = "gameplay"
description   = "Level and allocated mobys behind *g_MobyArrayPtr, to the state == -1 terminator"
cd_load_transient = true

# libcd's state block, written by the shared CD thunks and read by the
# translated CdStatus/CdLastPos/CdMode/CdLastCom every tick
# (ram_diff_expect.toml [[populated]]). A differing byte is a thunk defect.
[[region]]
name        = "libcd_CdStatus"
start       = 0x8006B574
length      = 0x1
class       = "psyq_mirror"
description = "libcd block 0x8006B568: CD status byte (CdStatus)"

[[region]]
name        = "libcd_CdLastPos"
start       = 0x8006B580
length      = 0x3
class       = "psyq_mirror"
description = "libcd block 0x8006B568: last CdlSetloc position (CdLastPos), minute/second/sector; the fourth byte libcd copies is the caller's track slot, which CdIntToPos leaves as the stack held it"

[[region]]
name        = "libcd_CdMode_CdLastCom"
start       = 0x8006B584
length      = 0x2
class       = "psyq_mirror"
description = "libcd block 0x8006B568: drive mode (mode | 0x20 after a CdRead) and last command"

# crt0 mirrors, set once at boot.
[[region]]
name        = "crt0_heap"
start       = 0x80069F00
length      = 0x8
class       = "psyq_mirror"
description = "heap base and size (crt0, InitHeap)"
constant_ok = true

[[region]]
name        = "crt0_exec_return"
start       = 0x8006C7F4
length      = 0x4
class       = "psyq_mirror"
description = "BIOS Exec return address stored by the crt0"
constant_ok = true
