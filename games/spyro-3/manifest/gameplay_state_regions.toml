# Every overlay (title, loading, cutscenes, levels: 60 images, largest
# .level_50 at 0x2D800) loads at 0x800742D0 (recomp.conf OVERLAY_LOAD_ADDR,
# psx.map ovlHeader). The union is one row. It is a CdRead destination
# (20-89 sector reads in the attract loop), so it diverges while the
# reference lands sectors that openpete landed at issue.
[[region]]
name        = "overlay_image"
start       = 0x800742D0
length      = 0x2D800
class       = "gameplay"
description = "Union of every overlay image at the overlay vaddr (.text, .data, .bss of the resident overlay; stale bytes of larger earlier overlays past its end)"
cd_load_transient = true
# The three title-overlay load_timing ranges of ram_diff_expect.toml
# (0x80080EE0, 0x80080F64-0x80080F69, 0x80080FC4-0x80080FE1), as offsets
# from the overlay vaddr; owner openpete-per-game-oracle (D5d).
mask_offsets = [0xCC10,
                0xCC94, 0xCC95, 0xCC96, 0xCC97, 0xCC98,
                0xCCF4, 0xCCF5, 0xCCF6, 0xCCF7, 0xCCF8, 0xCCF9, 0xCCFA, 0xCCFB,
                0xCCFC, 0xCCFD, 0xCCFE, 0xCCFF, 0xCD00, 0xCD01, 0xCD02, 0xCD03,
                0xCD04, 0xCD05, 0xCD06, 0xCD07, 0xCD08, 0xCD09, 0xCD0A, 0xCD0B,
                0xCD0C, 0xCD0D, 0xCD0E, 0xCD0F, 0xCD10]
mask_reason  = "title overlay load_timing counters (ram_diff_expect.toml)"

# The moby array in level RAM: g_MobyArrayPtr (0x8006C550) points at the
# first Moby (stride 0x58: savepoint.c divides by 0x58), the level's mobys
# run to g_AllocatedMobyArrayPtr (0x8006C704) and allocated mobys follow;
# the array ends at the first element whose state byte (+0x48) is -1
# (updatemobys.s 0x800556D8 loop exits on it; no count word exists). Both
# pointers sit inside the .sbss rows above. Cap 1024 elements; the attract
# demo holds 97-119.
[[region]]
name          = "moby_array"
kind          = "indirect_array"
base_ptr      = 0x8006C550
element_size  = 0x58
max_elements  = 1024
live_sentinel = { offset = 0x48, value = 0xFF }
class         = "gameplay"
description   = "Level and allocated mobys behind *g_MobyArrayPtr, to the state == -1 terminator"
cd_load_transient = true

# libcd's state block, written by the shared CD thunks and read by the
# translated CdStatus/CdLastPos/CdMode/CdLastCom every tick
# (ram_diff_expect.toml [[populated]]). A differing byte is a thunk defect.
[[region]]
name        = "libcd_CdStatus"
start       = 0x8006B574
length      = 0x1
class       = "psyq_mirror"
description = "libcd block 0x8006B568: CD status byte (CdStatus)"

[[region]]
name        = "libcd_CdLastPos"
start       = 0x8006B580
length      = 0x4
class       = "psyq_mirror"
description = "libcd block 0x8006B568: last CdlSetloc position (CdLastPos)"

[[region]]
name        = "libcd_CdMode_CdLastCom"
start       = 0x8006B584
length      = 0x2
class       = "psyq_mirror"
description = "libcd block 0x8006B568: drive mode (mode | 0x20 after a CdRead) and last command"

# crt0 mirrors, set once at boot.
[[region]]
name        = "crt0_heap"
start       = 0x80069F00
length      = 0x8
class       = "psyq_mirror"
description = "heap base and size (crt0, InitHeap)"
constant_ok = true

[[region]]
name        = "crt0_exec_return"
start       = 0x8006C7F4
length      = 0x4
class       = "psyq_mirror"
description = "BIOS Exec return address stored by the crt0"
constant_ok = true
