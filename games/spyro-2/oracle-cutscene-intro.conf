# Reference capture of the Spyro 2 intro cutscene (the cutscene after a new
# game), sourced by scripts/capture_psx_oracle_ds.sh --game spyro-2 --recipe
# games/spyro-2/oracle-cutscene-intro.conf and by
# tests/harness/check_psx_oracle.sh --game spyro-2 --recipe
# games/spyro-2/oracle-cutscene-intro.conf. The attract-demo recipe's
# recorders, plus:
#   - the movie games/spyro-2/bk2/s2-cutscene-intro.bk2 (three Cross presses
#     that start a new game; no input past its end while the cutscene plays),
#     keyed on the consume key as in games/spyro-2/oracle-card-save.conf: both
#     sides play row j of group E, E the entries of the pad-ring consumer
#     func_8001271C, the reference one VBL early (--bk2-lead 1);
#   - the watched word D_80068C50 (0x80068C50) is the speech ring's chunk
#     index: -1 at the stream read issue (0x8007487C), the chunk at the ring
#     refill (0x80073C7C); rows carry the exact tick;
#   - .spuq spuwrite rows (SpuWrite 0x8005AAA8) carry the voice heads at
#     each SPU transfer;
#   - the SPU final mix is written to <golden>.wav.
# Generated, never committed. FRAMES is the capture's record count, which
# the gate requires the golden's header to equal: the load that follows the
# cutscene starts at record 1233 (CdRead to 0x8007FA64 in <golden>.loads),
# and the capture ends 14 records into it.
# Past record 215 the stock run diverges in main_bss_80068328: records 213
# and 214 (the load into the cutscene, VBLs 1488-1778) take 272 VBLANKs
# inside work, in the loaders' poll loops that call func_80013690; the clock
# row (OPENPETE_ORACLE_CLOCK=1 OPENPETE_ORACLE_GTE_STRICT=1) delivers them
# at their recorded positions and every region and GTE hash matches over
# every record. In record 856 the reference's VBLANK lands inside
# func_8004C66C before its load of the VBL counter D_8006700C (0x8004CB98),
# from which it computes the cyclorama's far colour D_80068C08; that
# `.vblpos` row's rt is D_8006700C, and the row is delivered before the load.
# The cutscene starts one music stream (mode_rt_cleared=1), not the attract
# demo's 22.
source games/spyro-2/oracle.conf
GOLDEN="tests/golden/spyro-2/psxtrace-cutscene-intro.bin"
FRAMES=1247
MOVIE="games/spyro-2/bk2/s2-cutscene-intro.bk2"
CAPTURE_ARGS+=(--watch-word 0x80068C50 --spuq spuwrite:0x8005AAA8 --spu-dump
    --bk2 "$MOVIE" --bk2-consume-pc 0x8001271C --bk2-lead 1)
RUN_ARGS=(--no-card --bk2 "$MOVIE")
MODE_RT_CLEARED_MIN=1
READS_RT_CLEAR_MAX=0
# Regions constant over the 1247 records, each measured by a write census
# (OPENPETE_WRITE_CENSUS) on this run and on the attract demo: every CPU
# store this run makes into them writes the bytes already there, and the
# code that changes them on the demo never runs here. The overlay rows lie
# inside the titlescreen_and_loading image (0x8006D264-0x8007FA60), which
# reads 0-1 load before record 0 and which only a CdRead of level code to
# 0x8006D264 replaces (demo record 1346, after the level data read of record
# 1332; here the level data read starts at record 1233).
declare -A CONSTANT_REGION_REASON=(
    [main_data_8006012c]="the demo changes it only at D_80061AAC, set to 1 by level_41's func_level_41_8007E998 and reset by func_8001AAA4's copy on the return to the title; no level overlay runs before record 1247"
    [main_sdata_80066d38]="the demo changes it only at D_80066D40, the attract-demo index func_titlescreen_and_loading_80079DF0 advances as it starts a demo; a new game starts no demo"
    [overlay_image_0]="titlescreen_and_loading code and data, written only by CdRead; the run ends before the level code read replaces it"
    [overlay_image_5]="titlescreen_and_loading event-wait words 0x8007F169-0x8007F17F (func_titlescreen_and_loading_8007E70C, 8007E814, handler 8007E404), equal at every record; replaced only by the level code read"
)
# scripts/check_psx_oracle_all.sh runs this recipe as a clock row only: the
# stock run's record-215 divergence is a hard failure in a strict region,
# outside what games/spyro-2/manifest/oracle_ratchet.toml lists (GTE
# events, VBL events, gameplay bursts), and every record after it cascades.
STOCK_ROW_OUT="in-work VBLANKs of records 213-214 diverge main_bss_80068328 at record 215; the clock row covers the recipe"
