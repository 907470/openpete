# Reference capture of the Spyro 2 load movie into the level, for the clock
# row (OPENPETE_ORACLE_CLOCK=1 OPENPETE_ORACLE_GTE_STRICT=1), sourced by
# scripts/capture_psx_oracle_ds.sh --game spyro-2 --recipe
# games/spyro-2/oracle-card-load-clock.conf and by
# tests/harness/check_psx_oracle.sh --game spyro-2 --recipe
# games/spyro-2/oracle-card-load-clock.conf. The recorders, movie and card
# of games/spyro-2/oracle-card-load.conf, with its own golden and 1300
# records: the level the load enters (CD reads from record 331) diverges
# on the stock run from record 346 (GTE first, then main_bss_80068328) and
# passes under the clock row, which delivers the VBLANKs the reference took
# inside the game tick at their recorded function entries (<golden>.vblpos).
# FRAMES ends after the streaming read issued at record 1246 completes
# (record 1252) and before the next (record 1306). Generated, never
# committed.
source games/spyro-2/oracle-card-load.conf
GOLDEN="tests/golden/spyro-2/psxtrace-card-load-clock.bin"
FRAMES=1300
CARD1_FIXTURE="$GOLDEN.card1.mcd"
CARD1_END="$GOLDEN.card1-end.mcd"
_clock_args=(); _prev=""
for _a in "${CAPTURE_ARGS[@]}"; do
    [[ "$_a" == --card-export || "$_prev" == --card-export || "$_a" == --card-export-end ||
       "$_prev" == --card-export-end ]] || _clock_args+=("$_a")
    _prev="$_a"
done
CAPTURE_ARGS=("${_clock_args[@]}" --card-export "$CARD1_FIXTURE" --card-export-end "$CARD1_END")
CONSTANT_REGIONS_REASON="the 1300 records end before the code that changes them runs"
unset _a _prev _clock_args
