# Card-present reference capture of the Spyro 2 attract demo, sourced by
# scripts/capture_psx_oracle_ds.sh --game spyro-2 --recipe
# games/spyro-2/oracle-card.conf. The attract-demo recipe's recorders with
# the card fixture in place of --no-card: slot 1 holds the fork's
# non-persistent card (MemoryCardImage::Format's output, the image
# `-card-export 1:0:PATH` writes before the first frame), slot 2 is empty.
# The capture is the clock-replay schedule and the card timing source of
# the card-present runs; tests/harness/check_psx_oracle.sh --game spyro-2
# --recipe games/spyro-2/oracle-card.conf runs openpete with that image
# copied to a scratch path (`--card1 PATH --no-card2`). Generated, never
# committed.
source games/spyro-2/oracle.conf
GOLDEN="tests/golden/spyro-2/psxtrace-demo-20k-card.bin"
_card_args=()
for _a in "${CAPTURE_ARGS[@]}"; do
    [[ "$_a" == --no-card ]] || _card_args+=("$_a")
done
CARD1_FIXTURE="tests/golden/spyro-2/card-v6-blank.mcd"
# --card-active: the card driver's transfer-active byte, whose starts
# (<golden>.card) time the card model's steps against the anchors.
CAPTURE_ARGS=("${_card_args[@]}" --card-export "$CARD1_FIXTURE" --card-active 0x8000755A)
RUN_ARGS=(--no-card2)
unset _a _card_args
