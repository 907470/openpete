# Reference capture of the Spyro 2 format movie past record 502, for the
# clock row (OPENPETE_ORACLE_CLOCK=1 OPENPETE_ORACLE_GTE_STRICT=1), sourced by
# scripts/capture_psx_oracle_ds.sh --game spyro-2 --recipe
# games/spyro-2/oracle-card-format-clock.conf and by
# tests/harness/check_psx_oracle.sh --game spyro-2 --recipe
# games/spyro-2/oracle-card-format-clock.conf. The recorders, movie, card and
# root-counter-2 answers of games/spyro-2/oracle-card-format.conf, with its
# own golden and 800 records: from record 502 every record holds one VBLANK
# the reference takes inside the game tick, whose VSync callback
# func_800125C8 increments D_8006700C before func_8004C66C reads it for the
# far colour of func_800296D0's DPCS. The stock run charges that VBL at the
# next wait and diverges at record 502; the clock row delivers it at its
# recorded function entry (<golden>.vblpos).
# Generated, never committed.
source games/spyro-2/oracle-card-format.conf
GOLDEN="tests/golden/spyro-2/psxtrace-card-format-clock.bin"
FRAMES=800
CARD1_END="tests/golden/spyro-2/psxtrace-card-format-clock.bin.card1-end.mcd"
_clock_args=()
_next_end=0
for _a in "${CAPTURE_ARGS[@]}"; do
    if (( _next_end )); then _clock_args+=("$CARD1_END"); _next_end=0; continue; fi
    [[ "$_a" == --card-export-end ]] && _next_end=1
    _clock_args+=("$_a")
done
CAPTURE_ARGS=("${_clock_args[@]}")
CONSTANT_REGIONS_REASON="the 800 records end before the code that changes them runs"
unset _a _clock_args _next_end
