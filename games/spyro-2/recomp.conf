# Per-game inputs for scripts/regen-recomp.sh and scripts/regen-manifest.sh.
# Sourced as shell; every path is relative to the repo root.

DECOMP_DIR="games/spyro-2/spyro-2"
PSX_EXE="$DECOMP_DIR/build/PSX.EXE"
WAD_DIR="$DECOMP_DIR/build/wad"
ASM_DIR="$DECOMP_DIR/asm"

# main_BSS_END from the decomp's psx.map; the largest overlay is 0x1f000.
OVERLAY_LOAD_ADDR=0x8006D264
OVERLAY_RANGE=0x8006D264:0x8008C264

# No render-channel substitutions: that table is a set of Spyro 1 addresses.
CHANNEL_MANIFEST=""

# Split-target convergence is needed here: this decomp emits no
# `glabel D_<addr>`, so extract_asm_dispatch_targets.py harvests nothing
# and cross-piece jumps in handwritten asm have no dispatch entry.
MAIN_EXE_THIRD_PASS=1

# `jr <reg>` sites the recompiler rewrites to `return` because the register
# reloads a spilled $ra (see code_generator.cpp, saved-ra pattern); the regen
# fails when the count differs.
RA_SPILL_RETURNS=1

# The word the level-setup switch reads to pick a case (g_LevelId for
# Spyro 1, g_NextLevelNum for Spyro 2); tools/extract_overlay_func_pointers.py
# attributes each case's callback constants to `level_<id>`.
LEVEL_ID_ADDR=0x80066F90
