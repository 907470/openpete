# Per-game inputs for scripts/regen-recomp.sh, scripts/regen-manifest.sh and
# tools/gen_game_identity.py. Sourced as shell; every path is relative to the
# repo root.

# Identity, compiled into the exe as generated/game_identity.c by
# tools/gen_game_identity.py at build time.
DISPLAY_NAME="Spyro 2: Ripto's Rage!"
EXE_FILENAME="SCUS_944.25"

DECOMP_DIR="games/spyro-2/spyro-2"
PSX_EXE="$DECOMP_DIR/build/PSX.EXE"
WAD_DIR="$DECOMP_DIR/build/wad"
ASM_DIR="$DECOMP_DIR/asm"

# main_BSS_END from the decomp's psx.map; the largest overlay is 0x1f000.
OVERLAY_LOAD_ADDR=0x8006D264
OVERLAY_RANGE=0x8006D264:0x8008C264

# libcd's state block (D_80066700), read by the translated CdStatus,
# CdLastPos, CdMode and CdLastCom; and the slot the translated CdReadCallback
# stores the read-completion handler in.
LIBCD_BLOCK_ADDR=0x80066700
CD_READ_CB_ADDR=0x800663B8

# No render-channel substitutions: that table is a set of Spyro 1 addresses.
CHANNEL_MANIFEST=""

# Split-target convergence is needed here: this decomp emits no
# `glabel D_<addr>`, so extract_asm_dispatch_targets.py harvests nothing
# and cross-piece jumps in handwritten asm have no dispatch entry.
MAIN_EXE_THIRD_PASS=1

# `jr <reg>` sites the recompiler rewrites to `return` because the register
# reloads a spilled $ra (see code_generator.cpp, saved-ra pattern); the regen
# fails when the count differs.
RA_SPILL_RETURNS=1

# Word-table `jr` sites emitted without an index switch, as
# `<binary>:<lw address>`; tools/check_jumptable_dispatch.py fails on any
# other in-image site, and on a name here with no such site. level_31's two
# loops address their 12-entry tables (0x8006DAB8, 0x8006DAE8) with an offset
# register the loop advances by 4 (s2 at 0x8007EDDC, fp at 0x8007EF98)
# instead of an `sll` of the bounded index, so the recompiler has no index to
# switch on. Every entry of both tables is a dispatch entry of level_31, so
# the `jr` reaches it through call_by_address.
JUMPTABLE_UNSWITCHED="level_31:0x8007EC8C level_31:0x8007EE24"

# The word the level-setup switch reads to pick a case (g_LevelId for
# Spyro 1, g_NextLevelNum for Spyro 2); tools/extract_overlay_func_pointers.py
# attributes each case's callback constants to `level_<id>`.
LEVEL_ID_ADDR=0x80066F90

# The game has a first-boot module build: the regen emits its converged
# manifest (scripts/emit-recomp-manifest.sh) into manifest/recomp/<serial>/,
# with each overlay's WAD.WAD entry index, which the first-boot extractor
# (games/common/recomp_extract_wad_entry.cpp) carves.
FIRST_BOOT=1
FIRST_BOOT_CARVE=wad_entry
