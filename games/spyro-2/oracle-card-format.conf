# Reference capture of a Spyro 2 card format along a movie, sourced by
# scripts/capture_psx_oracle_ds.sh --game spyro-2 --recipe
# games/spyro-2/oracle-card-format.conf and by tests/harness/check_psx_oracle.sh
# --game spyro-2 --recipe games/spyro-2/oracle-card-format.conf. The
# attract-demo recipe's recorders with a card in slot 1, plus:
#   - the movie games/spyro-2/bk2/s2-format-card.bk2 (a new game on an
#     unformatted card answers "format it?" with Format, then creates and
#     writes BASCUS-94425SP2RR), keyed on the consume key with the reference
#     one VBL early (--bk2-lead 1), as in games/spyro-2/oracle-card-save.conf;
#   - slot 1 imports CARD1_FIXTURE, an unformatted card (131072 zero bytes)
#     that tests/harness/check_card_boot.sh writes before each format row
#     (by hand: head -c 131072 /dev/zero > <path>); openpete's run copies it
#     to a scratch path; slot 2 is empty;
#   - the card the reference left after the last record is exported to
#     CARD1_END, which the gate compares with the card openpete left;
#   - the card window (<golden>.cardwin) logs every card command;
#   - the game's reads of root counter 2 at 0x8001C2DC are recorded
#     (<golden>.rcnt2), as for the save.
# FRAMES ends before record 502, from which the level takes a VBLANK inside
# the game tick that the stock schedule charges at the next wait (see
# games/spyro-2/oracle-card-format-clock.conf).
# Generated, never committed.
source games/spyro-2/oracle.conf
GOLDEN="tests/golden/spyro-2/psxtrace-card-format.bin"
FRAMES=500
_card_args=()
for _a in "${CAPTURE_ARGS[@]}"; do
    [[ "$_a" == --no-card ]] || _card_args+=("$_a")
done
CARD1_FIXTURE="tests/golden/spyro-2/card-unformatted.mcd"
CARD1_END="tests/golden/spyro-2/psxtrace-card-format.bin.card1-end.mcd"
MOVIE="games/spyro-2/bk2/s2-format-card.bk2"
CAPTURE_ARGS=("${_card_args[@]}" --card-active 0x8000755A
    --card-import "$CARD1_FIXTURE" --card-export-end "$CARD1_END" --card-window
    --bk2 "$MOVIE" --bk2-consume-pc 0x8001271C --bk2-lead 1 --rcnt2-pc 0x8001C2DC)
RUN_ARGS=(--no-card2 --bk2 "$MOVIE")
# Measured on this capture: the run starts one stream and clears RT after one.
MODE_RT_CLEARED_MIN=1
READS_RT_CLEAR_MAX=0
CONSTANT_REGIONS_REASON="the 500 records end before the code that changes them runs"
unset _a _card_args
