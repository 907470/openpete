# Reference capture of a Spyro 2 save along a movie, sourced by
# scripts/capture_psx_oracle_ds.sh --game spyro-2 --recipe
# games/spyro-2/oracle-card-save.conf and by tests/harness/check_psx_oracle.sh
# --game spyro-2 --recipe games/spyro-2/oracle-card-save.conf. The
# attract-demo recipe's recorders with a card in slot 1, plus:
#   - the movie games/spyro-2/bk2/s2-create-save.bk2 (a new game that creates
#     and writes BASCUS-94425SP2RR), keyed on the consume key: both sides
#     play row j of group E, E the entries of the pad-ring consumer
#     func_8001271C, so the reference's longer BIOS boot moves no press; the
#     reference sets each row one VBL early (--bk2-lead 1), since its pad
#     handler writes the buffer from the previous vsync's exchange and
#     openpete delivers a row at the vsync it stamps it;
#   - slot 1 imports the blank formatted card CARD1_FIXTURE, the image
#     openpete's run copies to a scratch path; slot 2 is empty;
#   - the card the reference left after the last record is exported to
#     CARD1_END, which the gate compares with the card openpete left;
#   - the card window (<golden>.cardwin) logs every card command;
#   - the game's reads of root counter 2 are recorded (<golden>.rcnt2): the
#     save stores the count func_8001C2D8 reads at 0x8001C2DC, and openpete,
#     which holds the register at a constant, answers that read from the
#     capture. The game's other reads (0x8005B898, 0x8005BAC8, 0x8005F88C,
#     0x8005F8AC) are inside library functions openpete replaces.
# FRAMES covers the save's create, write and read back (the last card command
# falls in record 406) and ends before record 432, from which an in-level
# divergence unrelated to the card follows (GTE from record 432).
# Generated, never committed.
source games/spyro-2/oracle.conf
GOLDEN="tests/golden/spyro-2/psxtrace-card-save.bin"
FRAMES=420
_card_args=()
for _a in "${CAPTURE_ARGS[@]}"; do
    [[ "$_a" == --no-card ]] || _card_args+=("$_a")
done
CARD1_FIXTURE="tests/golden/spyro-3/card-v6-blank.mcd"
CARD1_END="tests/golden/spyro-2/psxtrace-card-save.bin.card1-end.mcd"
MOVIE="games/spyro-2/bk2/s2-create-save.bk2"
CAPTURE_ARGS=("${_card_args[@]}" --card-active 0x8000755A
    --card-import "$CARD1_FIXTURE" --card-export-end "$CARD1_END" --card-window
    --bk2 "$MOVIE" --bk2-consume-pc 0x8001271C --bk2-lead 1 --rcnt2-pc 0x8001C2DC)
RUN_ARGS=(--no-card2 --bk2 "$MOVIE")
# Measured on this capture: the run starts one stream and clears RT after none.
MODE_RT_CLEARED_MIN=0
READS_RT_CLEAR_MAX=0
CONSTANT_REGIONS_REASON="the 420 records end before the code that changes them runs"
unset _a _card_args
