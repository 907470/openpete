# Reference capture of the Spyro 2 save movie on a full card, for the clock
# row (OPENPETE_ORACLE_CLOCK=1 OPENPETE_ORACLE_GTE_STRICT=1), sourced by
# scripts/capture_psx_oracle_ds.sh --game spyro-2 --recipe
# games/spyro-2/oracle-card-full-save-clock.conf and by
# tests/harness/check_psx_oracle.sh --game spyro-2 --recipe
# games/spyro-2/oracle-card-full-save-clock.conf. The recorders, movie and
# root-counter-2 answers of games/spyro-2/oracle-card-save.conf, with:
#   - slot 1 importing CARD1_FIXTURE, the blank formatted card
#     tests/golden/spyro-3/card-v6-blank.mcd with all 15 blocks taken by
#     foreign one-block saves, written by tests/harness/make_full_card.py
#     (tests/harness/check_card_boot.sh --row=full-save-ref-clock writes it
#     before each run, tests/harness/check_psx_oracle.sh through
#     card1_fixture_make below when it is missing). The game finds no free
#     block, writes only the write-test frame (block 0 frame 63) and creates
#     no save;
#   - its own golden and 520 records. After the card step the level takes
#     a VBLANK inside the game tick (the in-level class of
#     games/spyro-2/oracle-card-save-clock.conf) that
#     the stock schedule charges at the next wait, diverging at record 389
#     in main_bss_80068328; the clock row delivers it at its recorded
#     function entry (<golden>.vblpos). A stock row would end at record 388.
# Generated, never committed.
source games/spyro-2/oracle.conf
GOLDEN="tests/golden/spyro-2/psxtrace-card-full-save-clock.bin"
FRAMES=520
_card_args=()
for _a in "${CAPTURE_ARGS[@]}"; do
    [[ "$_a" == --no-card ]] || _card_args+=("$_a")
done
CARD1_FIXTURE="tests/golden/spyro-2/card-full-15.mcd"
# card1_fixture_make DST: the full card, a function of the blank card alone;
# tests/harness/check_psx_oracle.sh writes CARD1_FIXTURE with it when missing.
card1_fixture_make() {
    python3 tests/harness/make_full_card.py tests/golden/spyro-3/card-v6-blank.mcd "$1" 15
}
CARD1_END="tests/golden/spyro-2/psxtrace-card-full-save-clock.bin.card1-end.mcd"
MOVIE="games/spyro-2/bk2/s2-create-save.bk2"
CAPTURE_ARGS=("${_card_args[@]}" --card-active 0x8000755A
    --card-import "$CARD1_FIXTURE" --card-export-end "$CARD1_END" --card-window
    --bk2 "$MOVIE" --bk2-consume-pc 0x8001271C --bk2-lead 1 --rcnt2-pc 0x8001C2DC)
RUN_ARGS=(--no-card2 --bk2 "$MOVIE")
# Measured on this capture: the run starts one stream and clears RT after one.
MODE_RT_CLEARED_MIN=1
READS_RT_CLEAR_MAX=0
CONSTANT_REGIONS_REASON="the 520 records end before the code that changes them runs"
unset _a _card_args
