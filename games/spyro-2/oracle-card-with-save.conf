# Card-with-save reference capture of the Spyro 2 attract demo, sourced by
# scripts/capture_psx_oracle_ds.sh --game spyro-2 --recipe
# games/spyro-2/oracle-card-with-save.conf and by
# tests/harness/check_psx_oracle.sh --game spyro-2 --recipe
# games/spyro-2/oracle-card-with-save.conf. The card-present recipe
# (games/spyro-2/oracle-card.conf) with slot 1 holding the save BASCUS-94425SP2RR:
#   - the reference imports CARD1_IMPORT, the card the save capture
#     (CARD1_SOURCE_RECIPE) left after its last record; the gate captures
#     that recipe first when the card is missing;
#   - the card as the reference booted with it is exported before the first
#     frame to CARD1_FIXTURE, the image openpete's run copies to a scratch
#     path, so the golden carries its own fixture; slot 2 is empty;
#   - the card the reference left after the last record is exported to
#     CARD1_END, which the gate compares with the card openpete left;
#   - the card window (<golden>.cardwin) logs every card command.
# The title's card probe opens the save and reads one sector of it (an
# asynchronous read of 0x80 bytes). Generated, never committed.
source games/spyro-2/oracle-card.conf
GOLDEN="tests/golden/spyro-2/psxtrace-demo-20k-card-with-save.bin"
CARD1_SOURCE_RECIPE="games/spyro-2/oracle-card-save.conf"
CARD1_IMPORT="tests/golden/spyro-2/psxtrace-card-save.bin.card1-end.mcd"
CARD1_FIXTURE="$GOLDEN.card1.mcd"
CARD1_END="$GOLDEN.card1-end.mcd"
_card_args=(); _prev=""
for _a in "${CAPTURE_ARGS[@]}"; do
    [[ "$_a" == --card-export || "$_prev" == --card-export ]] || _card_args+=("$_a")
    _prev="$_a"
done
CAPTURE_ARGS=("${_card_args[@]}" --card-import "$CARD1_IMPORT" --card-export "$CARD1_FIXTURE"
    --card-export-end "$CARD1_END" --card-window)
unset _a _prev _card_args
