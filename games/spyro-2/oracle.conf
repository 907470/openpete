# Oracle golden recipe, sourced as shell by scripts/capture_psx_oracle_ds.sh
# --game and tests/harness/check_psx_oracle.sh --game. The golden is derived from
# the disc and DuckStation patched by third_party/duckstation-patches, so it
# is generated into tests/golden/ on the first gate run and never committed
# (.gitignore); two captures from the same applied head are byte-identical. Every path is
# relative to the repo root; every PC comes from manifest/psyq.toml.

GOLDEN="tests/golden/spyro-2/psxtrace-demo-20k.bin"
FRAMES=20000
DISC="games/spyro-2/spyro-2/build/SCUS-94425.cue"
MANIFEST="games/spyro-2/manifest/gameplay_state_regions.toml"
# func_8001B140: the first call of each main-loop iteration, one hit per
# game tick (manifest/ram_diff_expect.toml anchors.loop).
ANCHOR_PC=0x8001B140
# CdRead, the read-complete handler slot (recomp.conf CD_READ_CB_ADDR),
# CdControl, libetc VSync, the two callback registrars, srand, the
# controller's commands and interrupts (the game's own code never touches
# the registers, so no --cd-read-pc-min), controller commands, CdSync, the
# kernel's SIO0 port-flip word, and libcd's own VSync(-1) timeout polls
# (CD_sync..CD_flush) skipped. The VBLANK positions outside
# waits and the libspu calls SpuSetKey, SpuGetAllKeysStatus and
# SpuSetVoiceAttr are recorded, with their SPU register accesses (the KON
# stores, the sample-rate store, the envelope-level load). --no-card: openpete's Spyro 2 stalls at its
# first card wait with a card present, and the gate runs with --no-card.
CAPTURE_ARGS=(--cd-read-pc 0x80058108 --cd-read-cb-slot 0x800663B8
    --cd-control-pc 0x80058858 --vsync-pc 0x80058EDC
    --vsync-cb-pc 0x80054934 --vsync-cb-pc 0x80054968 --srand-pc 0x80059D5C
    --cd-irq --pad-cmds --cdsync-pc 0x80058810 --sio0-word 0x80007264
    --vsync-query-skip 0x8005C900:0x8005CF8C --no-card
    --vblpos --spuq setkey:0x8005A23C --spuq allkeys:0x8005A3FC --spuq voiceattr:0x8005A4A8
    --spureg kon:0x8005A314 --spureg kon:0x8005A31C --spureg pitch:0x8005A520
    --spureg envx:0x8005A434)
RUN_ARGS=(--no-card)
# Music-routing engagement bounds measured on this golden: data-mode
# CdlSetmode clears RT after a stream start at least this often, and no
# CdlReadS is issued with RT clear.
MODE_RT_CLEARED_MIN=22
READS_RT_CLEAR_MAX=0
