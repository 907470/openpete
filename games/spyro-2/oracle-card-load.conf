# Reference capture of a Spyro 2 save load along a movie, sourced by
# scripts/capture_psx_oracle_ds.sh --game spyro-2 --recipe
# games/spyro-2/oracle-card-load.conf and by tests/harness/check_psx_oracle.sh
# --game spyro-2 --recipe games/spyro-2/oracle-card-load.conf. The
# card-with-save recipe's card (games/spyro-2/oracle-card-with-save.conf:
# CARD1_IMPORT, CARD1_FIXTURE, CARD1_END, the card window) plus the movie
# games/spyro-2/bk2/s2-load-save.bk2, keyed on the consume key (consumer
# 0x8001271C, each row one VBL early on the reference; see
# games/spyro-2/oracle-card-save.conf): from the title the game reads the
# save's first sector at boot, loads the save (one asynchronous read of 0x1400
# bytes, 40 sectors) and enters the level. Generated, never committed.
source games/spyro-2/oracle-card-with-save.conf
GOLDEN="tests/golden/spyro-2/psxtrace-card-load.bin"
# FRAMES covers the boot read and the load (the last card command at reference
# VBLANK 1506) and ends before the level load's first CD read (issued after
# record 330 on both sides). In the level the stock run diverges from record
# 346 (GTE first, then main_bss_80068328) where the clock row passes; that leg
# is games/spyro-2/oracle-card-load-clock.conf.
FRAMES=320
CARD1_FIXTURE="$GOLDEN.card1.mcd"
CARD1_END="$GOLDEN.card1-end.mcd"
MOVIE="games/spyro-2/bk2/s2-load-save.bk2"
_card_args=(); _prev=""
for _a in "${CAPTURE_ARGS[@]}"; do
    [[ "$_a" == --card-export || "$_prev" == --card-export || "$_a" == --card-export-end ||
       "$_prev" == --card-export-end ]] || _card_args+=("$_a")
    _prev="$_a"
done
CAPTURE_ARGS=("${_card_args[@]}" --card-export "$CARD1_FIXTURE" --card-export-end "$CARD1_END"
    --bk2 "$MOVIE" --bk2-consume-pc 0x8001271C --bk2-lead 1)
RUN_ARGS=(--no-card2 --bk2 "$MOVIE")
MODE_RT_CLEARED_MIN=0
READS_RT_CLEAR_MAX=0
CONSTANT_REGIONS_REASON="the records end before the code that changes them runs"
unset _a _prev _card_args
