# Live-pad recipe, sourced by tests/harness/check_livepad.sh --game spyro-2
# and, through it, by scripts/capture_psx_oracle_ds.sh and
# tests/harness/check_psx_oracle.sh as --recipe: the attract-demo recipe's
# recorders and disc, the stream, the pad-ring consumer that keys the
# recorded rows (the game descriptor's consume_pc), Spyro's position (three
# words at the player struct, game_layout.player.base + pos_off) and the
# record count, which reaches past the stream's last event.
source games/spyro-2/oracle.conf
GOLDEN=""
LIVEPAD_STREAM="tests/livepad/spyro-2.stream"
LIVEPAD_CONSUME_PC=0x8001271C
LIVEPAD_POS_WORDS=0x80069FF0:3
LIVEPAD_RECORDS=2000
FRAMES=$LIVEPAD_RECORDS
RUN_ARGS=(--no-card)
