# Curated PSX symbol aliases for the Spyro 2 engine layout (renderer/layout.c).
#
# Hand-maintained: the readable alias the layout uses, joined by address to
# the authoritative manifest (globals.toml / symbols.toml) at build time.
# tools/gen_symbols_header.py generates gen/spyro2_symbols.gen.h from this and
# Fails the build if any `addr` is not a symbol start in the manifest.
#
# The decomp names nothing here, so each row's note carries the identification
# evidence: the asm site in games/spyro-2/spyro-2/asm that reads or writes the
# address.

[[symbol]]
name = "G_ENVIRONMENT"
addr = 0x800673D4
note = "environment header: the world draw func_80023BB4 reads +0x00 sector list and +0x04 count (environment.s:1593-1594), stores the visibility return at +0x30 (environment.s:1569), reads the 48-byte texture table pointer at +0x20 (environment.s:2212), the LP far cull at +0x2C shifted right 7 minus 1 (environment.s:6924-6935) and the three far-colour words at +0x34/+0x38/+0x3C into ctc2 $21..$23 (environment.s:2479-2481); func_80048D18 reads the enable word at +0x10 and the world occlusion data at +0x08 (mobyfunc.s:16,29); the animation walkers read the block pointer at +0x1C (environment.s:1239)"

[[symbol]]
name = "G_CYCLORAMA"
addr = 0x800681B8
note = "sky header: +0x00 sector count and +0x04 sector pointer list, read by the sky draw func_80029170 (cyclorama.s:46-49); +0x08 the background colour 0x00BBGGRR, which the moby depth cue splits into three 0xFF0 fields for ctc2 $21..$23 (mobydraw.s:2597-2599). The word at +0x00 is written by the level loader func_8001C5EC (loaders/func_8001C5EC.s:27-28)"

[[symbol]]
name = "G_CAMERA"
addr = 0x80067E84
note = "camera: +0x00 the sky rotation matrix and +0x40 the depth-cue IR0 the sky draw loads (cyclorama.s:32-39), +0x14 the world rotation matrix the world draw loads into ctc2 $0..$4 (environment.s:1572-1576), +0x28 the position the world draw shifts right 4 for the sector cull (environment.s:1585-1587) and right 2 for the GTE translation (environment.s:2215-2220), +0x44 the rotation angles"

[[symbol]]
name = "G_SPYRO"
addr = 0x80069FF0
note = "player state block; opens with the world position, three int32"

[[symbol]]
name = "G_LEVELID"
addr = 0x80066F90
note = "the level number the loader loads; written by func_8001A9B0 (update/func_8001A9B0.s:36-37) and read by func_800151F0 (draw/func_800151F0.s:84-85)"

[[symbol]]
name = "G_GAMESTATE"
addr = 0x80066EEC
note = "the loader/simulation regime word: -1 level resident, 0 title, 2 load g_LEVELID, and the intermediate values the transition steps through. The tick dispatcher func_8001A79C branches the regime on it at three sites, each `slti $v0, 0x2` taking the loading path (update/func_8001A79C.s:26-31,55-58,98-103); func_8001A9B0 writes it (update/func_8001A9B0.s:22-23) and clears it (:34-35), func_8001A6F8 clears it (update/func_8001A6F8.s:40-41) and func_800176A4 writes and re-reads it (update/func_800176A4.s:469-475)"

[[symbol]]
name = "G_CUR_DB"
addr = 0x80066FC0
note = "pointer to the draw buffer under construction; func_8004D810 flips it between G_DB and G_DB+0x74 (drawutil/func_8004D810.s:44-53)"

[[symbol]]
name = "G_DB"
addr = 0x80069928
note = "draw-buffer pair, stride 0x74 (drawutil/func_8004D810.s:46-52); DRAWENV at +0x00, the primitive buffer base at +0x70 (drawutil/func_8004D810.s:57)"

[[symbol]]
name = "D_POLYBUF_CURSOR"
addr = 0x80067030
note = "primitive cursor: set from the draw buffer's +0x70 base (drawutil/func_8004D810.s:57-62, draw/func_800145AC.s:162-163) and read by the sky draw (cyclorama.s:54-56)"

[[symbol]]
name = "D_POLYBUF_END"
addr = 0x80067034
note = "primitive buffer end = base + size, written beside the cursor (draw/func_800145AC.s:164-167); the world draw carves its scratch at end - 0x3000 (environment.s:1559-1563)"

[[symbol]]
name = "G_SIN"
addr = 0x80061BD8
note = "sin table, 256 s16 1.12 entries; func_8001B61C interpolates it from a 12-bit angle (stdutil.s:308-318) and func_8001B6C8 pairs it with the cos table D_80061C58 at +0x80 (stdutil.s:375-378)"

[[symbol]]
name = "D_ENV_ANIM_REGISTRY"
addr = 0x800681D4
note = "the environment-animation registry: seven {count, descriptor-pointer array} pairs at +0x00 through +0x34, walked in order by func_800225F8 (environment.s:14-19,89-90) and func_800231F4 (environment.s:832-835,871-872). Pair 0 memcpys whole 48-byte texture entries between tiles (environment.s:864-871); pair 1 is the UV scroll, whose descriptor holds a u16 tile index at +4 and a u16 accumulator at +6 and commits texel rows into the 48-byte entry (environment.s:138-155)"

[[symbol]]
name = "D_ENV_ANIM_LIVE"
addr = 0x8006B300
note = "liveness byte table indexed by an animation entry's low byte; the three arena walkers gate on it (environment.s:1240-1241,1272-1274)"

[[symbol]]
name = "G_MOBYARRAY"
addr = 0x80066F14
note = "pointer to the first Moby; the cull func_80043858 loads it and walks 0x58-byte records, ending at the record whose state byte at +0x48 is -1 (mobydraw.s:31-33,63-70)"

[[symbol]]
name = "G_MOBYMODELS"
addr = 0x80068C94
note = "the level model table, indexed by the Moby class halfword at +0x36 times 4; the entry's sign selects the model kind, a positive (KUSEG) entry going to the static queue (mobydraw.s:49-50,113-119)"

# ---- function addresses (validated against symbols.toml) ----
[[symbol]]
name = "F_WORLD_DRAW"
addr = 0x80023BB4
kind = "function"
note = "func_80023BB4, the world renderer (environment.s:1544); the terrain hook site"

[[symbol]]
name = "F_SKY_DRAW"
addr = 0x80029170
kind = "function"
note = "func_80029170, the cyclorama renderer (cyclorama.s:13); the sky hook site"

[[symbol]]
name = "F_VISIBILITY"
addr = 0x80048D18
kind = "function"
note = "func_80048D18, the per-sector visibility pre-pass (mobyfunc.s:13); called with a0 = 0 by the world draw (environment.s:1565-1566) and a0 = 1 by the sky draw (cyclorama.s:28-29)"

[[symbol]]
name = "F_MOBY_CULL"
addr = 0x80043858
kind = "function"
note = "func_80043858, the moby cull: carves the draw scratch at D_POLYBUF_END - 0x3000, builds the animated record queue at +0x2000 of it and the static queue at +0x1C00, and writes each moby's drawn verdict byte at +0x4D (mobydraw.s:13,26-46,73,224)"

[[symbol]]
name = "F_MOBY_DRAW_ANIM"
addr = 0x80044504
kind = "function"
note = "func_80044504, the animated moby draw: walks the 0x44-byte record queue, decodes each model's vertex and face streams and emits (mobydraw.s:869). One routine here where the other game's disassembly splits the same code into a function plus three data labels"

[[symbol]]
name = "F_MOBY_DRAW_STATIC"
addr = 0x80046FD8
kind = "function"
note = "func_80046FD8, the second model kind's draw: walks the stride-0x10 static queue at draw scratch +0x1C00 (mobydraw.s:3843)"

[[symbol]]
name = "F_PLAYER_DRAW"
addr = 0x80041DBC
kind = "function"
note = "the player avatar's own draw (spyrodraw.s:13, the whole translation unit at 0x1A9C bytes), run twice a tick: the mirrored copy with g_Spyro+0x2C set, then the avatar with it clear. It saves $s0..$s6 into the spill block D_8006A9EC and restores them before returning (spyrodraw.s:14-22). The shared player feeder's hook site"

[[symbol]]
name = "D_SPYRO_ANIMS"
addr = 0x80066F24
note = "pointer to the 256-entry Animation table the player draw indexes by the animation word's low byte (spyrodraw.s:35-37, entries at :56-60); the player-shadow draw reads the avatar's animation through the same pointer (mobyfunc.s:688). Written at level load"

[[symbol]]
name = "D_SPYRO_BLEND"
addr = 0x80062868
note = "the 256-byte table the player draw looks the keyframe blend byte up in (g_Spyro+0x1C for the body, +0x1D for the head) before shifting the result left four into the part record's IR0 field (spyrodraw.s:41-46,111-114,136). The moby cull maps Moby+0x40 through the same table (mobydraw.s:460-462)"

[[symbol]]
name = "D_PLAYERSHADOW"
addr = 0x800698D0
note = "the player's ground-shadow state block, read by the player-shadow draw func_800495E8 (mobyfunc.s:623-885): +0x00 a flag scaling every silhouette radius by 3/4, +0x04/+0x08/+0x0C the shadow's world position, +0x10 a packed byte-angle triple whose top byte at +0x13 suppresses the draw, +0x14 the ordering-key bias"

[[symbol]]
name = "D_SHADOW_RING"
addr = 0x800632CC
note = "16 packed s16 XZ direction pairs, one per player-shadow ring point; the player-shadow draw func_800495E8 loads the base (mobyfunc.s:774-775), reads a pair per point and shifts the product right 10 to form the local corner (mobyfunc.s:790)"

[[symbol]]
name = "F_PLAYER_SHADOW"
addr = 0x800495E8
kind = "function"
note = "the player's ground-shadow renderer (mobyfunc.s:622-888), called once after the two player draws by func_8004C534 (drawutil/func_8004C534.s:70); its 251 instructions align one for one onto the other game's func_8002D9BC, differing only in the six global addresses it loads"

[[symbol]]
name = "F_MOBY_SHADOWS"
addr = 0x800499D4
kind = "function"
note = "the moby drop-shadow renderer (mobyfunc.s:889-1235), called by func_8004C534 (drawutil/func_8004C534.s:23); its 330 instructions align one for one onto the other game's func_8002DDA8, differing only in the global addresses it loads"

[[symbol]]
name = "G_MOBYSHADOWS"
addr = 0x8006820C
note = "moby drop-shadow descriptor {uv0+clut, uv1+tpage, list end}: func_800499D4 loads +0x00/+0x04 as the shadow sprite's two UV words and +0x08 as the drawn-moby list terminator (mobyfunc.s:919-923), then subtracts 0x1F00 from the second to make the top-right corner (mobyfunc.s:924)"

[[symbol]]
name = "F_PARTICLES_DRAW"
addr = 0x80048128
kind = "function"
note = "the particle renderer (partsdraw.s:13-796, handwritten: it spills s0-s7/gp/sp/fp/ra and uses those registers as its own), called by the world-draw driver func_800155A0 (draw/func_800155A0.s:73). Walks the 0x20-byte pool at D_PARTS_ARRAY and appends one primitive per drawn record, stopping when the polybuf cursor comes within 0x400 bytes of D_POLYBUF_END (partsdraw.s:65). Classes 0-4 dispatch at partsdraw.s:81-89 and link at their own depth bucket; class 5 and up fall through and link at the fixed front entry"

[[symbol]]
name = "D_PARTS_ARRAY"
addr = 0x80066F18
note = "the word holding the base of the particle pool the renderer walks (partsdraw.s:57-59), 0x20 bytes per record: +0x00 the signed selector halfword (bits 8-11 the class, arithmetic shift by 8 equal to -1 ends the pool, otherwise negative = inactive slot), +0x03 the drawn stamp (partsdraw.s:225 cleared, :360 set), +0x04 X in the low half and Y in the high half, +0x08 Z in the low half (partsdraw.s:91-92), all in quarter world units"

[[symbol]]
name = "F_UI_OT_INSERT"
addr = 0x8001B390
kind = "function"
note = "func_8001B390 (stdutil.s:87-103) - links a0 into the 2D ordering table whose head word is D_80067000, instruction-for-instruction the other game's func_8004E758 with a different head global; called by drawutil, hud, draw and the level overlays and by no 3D translation unit, so it is the 2D feeder's chokepoint hook site"

[[symbol]]
name = "F_UI_OT_INSERT_SLOT"
addr = 0x8001B354
kind = "function"
note = "func_8001B354(prim, slot) (stdutil.s:66-82, handwritten) - the slotted form of func_8001B390: it loads the table base from the word at D_80066FFC, adds slot << 3, and runs the same three-store tag splice on that entry instead of on a fixed head word. Eight call sites in five files, all screen emitters in the titlescreen_and_loading and credits overlays and no 3D translation unit, so it is a second chokepoint of the same shape; the title screen's func_titlescreen_and_loading_80079878 links its DR_MODE and its SPRT through it"

[[symbol]]
name = "F_UI_FADE"
addr = 0x8004D748
kind = "function"
note = "func_8004D748(abrMode, r, g, b) (drawutil/func_8004D748.s:7-56) - the full-screen fade emitter: func_8005A01C(prim, 1, 0, abrMode << 5, 0) then a 0x2A POLY_F4 spanning x 0..0x200, y 0x0C..0xE4 with rgb at +0x10..+0x12, each linked through func_8001B390 and the polybuf cursor D_80067030 advanced 0x24. draw/func_800155A0.s:82,91 drives it from D_80066F68 at ABR 2 and D_80067150 at ABR 1; drawutil/func_8004D810.s:73 is the blocking 16-step variant"

[[symbol]]
name = "F_UI_FB_GRID"
addr = 0x8004DF84
kind = "function"
note = "func_8004DF84(step) (drawutil/func_8004DF84.s:6-123) - the pause window's per-tick framebuffer grid: two black 0x28 POLY_F4 borders through func_8004DD28 (drawutil/func_8004DD28.s:6-34, rect x0..x1, y0..y1 from a0..a3), the first spanning x 0..D_800633BA[step], y D_800633DF[step]..D_800633E0[step] and the second x D_800633BC[step]..D_800633BA[step], y D_800633E0[step]..0xE4, then a 4x4 grid of 0x2C POLY_FT4 cells over x 0..D_800633BC[step], y D_800633E0[step]..0xE4, every primitive linked through func_8001B390 in that order. The borders are the band between the box of step-1 and the box of step. draw/func_800145AC.s:95 calls it for steps 1..16 (the shrink on pause), :336 for steps 14, 12, ..., 2 (the grow back on unpause)"

[[symbol]]
name = "F_TEXT_SPRT"
addr = 0x8004A374
kind = "function"
note = "func_8004A374 (mobyfunc.s:1538-1690) - handwritten glyph emitter: one 0xC-byte DR_MODE carrying tpage 0x618 (mobyfunc.s:1570) then one 0x14-byte SPRT per glyph with clut 0x4922 (mobyfunc.s:1654), chained tag-to-tag and linked into D_80067000 inline without calling func_8001B390"

[[symbol]]
name = "F_TEXT_SPRT_PER_GLYPH"
addr = 0x8004A59C
kind = "function"
note = "func_8004A59C (mobyfunc.s:1692-1851) - the quad-form variant of func_8004A374: one 0x28-byte POLY_FT4 per glyph, command byte 0x2C at packet offset 7 (mobyfunc.s:1822-1823), tpage 0x618 in the packet's own tpage halfword at +0x16 (mobyfunc.s:1722) and clut 0x4922/0x4962 at +0xE (mobyfunc.s:1821), chained tag-to-tag and linked into D_80067000 inline; it carries no DR_MODE"

[[symbol]]
name = "F_LOADING_SPRT"
addr = 0x800732D8
kind = "function"
note = "func_titlescreen_and_loading_800732D8(otIndex) (overlays/titlescreen_and_loading/leveldata/func_titlescreen_and_loading_800732D8.s:6-62) - the loading-screen image emitter: four iterations, each one 0xC-byte DR_MODE built by func_8005A01C with tpage 0x108 + 2*i (the 128-px-wide pages of the picture in VRAM) then a 0x14-byte SPRT of code word 0x64808080 at x = i << 7, y 0xC, u/v 0, 0x80 x 0xD8, both linked through func_8001B354 rather than the chokepoint func_8001B390, with the polybuf cursor D_80067030 advanced 0x20 per iteration. Lives in the titlescreen_and_loading overlay (id 34), whose vaddr every level overlay shares, so its hook is overlay-qualified"

[[symbol]]
name = "D_PORTALS"
addr = 0x80066F00
note = "pointer to the level's portal record array, 0x44 bytes per record: five world-space pentagon vertices +0x00, preview mesh pointer +0x3C, enable/draw radius +0x40, back-side flag +0x41. The pass loads the pointer and indexes it by its byte cursor (drawutil/func_8004C66C.s:27-33), gates on +0x40 (:33), reads the back-side flag at +0x41 (:141) and the mesh pointer at +0x3C (:371-375), and advances the cursor by 0x44 (:716). It never reads +0x42 or +0x43"

[[symbol]]
name = "D_PORTALCOUNT"
addr = 0x80066FA8
note = "portal record count; the pass loops over it (drawutil/func_8004C66C.s:7-8,719-725)"

[[symbol]]
name = "D_PORTAL_BLOCK"
addr = 0x80068BF0
note = "the portal pass's parameter block for the preview leaf: +0x00 y-min, +0x04 y-max, +0x08 x-min, +0x0C x-max, +0x10 preview mesh pointer, +0x14 depth >> 7, +0x18/+0x1A/+0x1C far colour halfwords at GTE scale, +0x1E IR0, +0x20 edge count, +0x24 8-byte edge entries of packed screen points. Written per portal by func_8004C66C: the clip rect at :363-369 after its 0..512 and 12..228 clamps (:338-352), the mesh pointer at :375, the depth at :92, the far colours at :389-398, the IR0 at :686-698 and the edge count at :448; read only by func_800296D0"

[[symbol]]
name = "F_PORTAL_PASS"
addr = 0x8004C66C
kind = "function"
note = "func_8004C66C (drawutil/func_8004C66C.s) - per portal: gates, projects the pentagon with the sky matrix, fills D_PORTAL_BLOCK, calls F_PORTAL_LEAF (:701) with a descending argument, 0 on the last call (:704-711). The same routine as the other game's func_8001EDEC minus its opening animation on the record's +0x43 counter"

[[symbol]]
name = "F_PORTAL_LEAF"
addr = 0x800296D0
kind = "function"
note = "func_800296D0 (cyclorama.s:382) - draws one pre-projected preview mesh (a0 > 0 the base record, a0 == 0 the record at +0x3C) clipped to D_PORTAL_BLOCK's pentagon edges with two DPCS fades. Word-for-word the other game's func_8001C8C8 over all 525 instructions but for 49 addresses"

[[symbol]]
name = "F_FLAME_DRAW"
addr = 0x80048F04
kind = "function"
note = "func_80048F04 (mobyfunc.s:157) - the fire-breath ribbon emitter, the other game's func_80058D64 over all 441 instructions but for constants and addresses. One call site, gated on the flame state's +0x98 byte (drawutil/func_8004C534.s:72-77); the flame feeder's hook site"

[[symbol]]
name = "D_FLAME_STATE"
addr = 0x8006AA1C
note = "the flame state block, 0xC4 bytes: ribbon origin +0x00, the strip's two texture words +0x10 and +0x14, per-strand keyframe counter +0x20 and length +0x28, active flag +0x98, attach SHORTMATRIX +0xB0 (five words, ending the block). The emitter loads the base at mobyfunc.s:178 and the matrix at :216"

[[symbol]]
name = "D_FLAME_CONN"
addr = 0x80062968
note = "flame strip connectivity, one word per keyframe counter value: bits 24-31 the spine offset in 8-byte records, bits 8-15 the colour/UV ramp start, bits 16-23 the cross-section count. Strands 4-7 read the same table +0x78 (mobyfunc.s:235,251)"

[[symbol]]
name = "D_FLAME_GEOM"
addr = 0x80062AD0
note = "flame cross-section spine, 8-byte records of packed {X, Z, index, sine phase}. Strand s < 4 starts at +0xB0*s, strand s >= 4 at +0x2C0 + 0xE0*(s-4) (mobyfunc.s:243,248,250,257)"

[[symbol]]
name = "D_FLAME_CAP_COLOURS"
addr = 0x80063110
note = "the first-cell cap colour set, four words read in order at +0x00..+0x0C (mobyfunc.s:335). The second set at +0x10 has no selector in this game"

# The glow/glint/tracer effect family: five handwritten renderers the draw
# driver func_800155A0 calls in sequence between the world draw and the sky
# draw, each linking its own primitives into the 3D ordering table. Each is the
# other game's routine over the same instructions but for constants and
# addresses (see each row).

[[symbol]]
name = "F_GLOW_DRAW"
addr = 0x8004A8D4
kind = "function"
note = "func_8004A8D4 (mobyfunc.s:1936-2146), the glow-ring renderer: one call site, in the draw driver func_800155A0 under mask bit 0x10 (draw/func_800155A0.s:30). Walks the 16-slot pool at D_GLOW_POOL and, per live record, emits one bundled draw-mode packet 0xE1000620 followed by up to sixteen POLY_G3 semi-transparent fanned from the record's projected centre, all chained into one bucket off D_OT_BASE. The other game's func_8002ECA8 over 208 of its 211 instructions; this image lacks that one's game-state pre-check and its front-entry branch for records whose ordering-table bias byte is 0x7F (mobyfunc.s:2050-2053 clamps the bucket at zero instead)"

[[symbol]]
name = "D_GLOW_POOL"
addr = 0x80068078
note = "the glow-ring pool the renderer walks, 16 records of 0x14 bytes ending at +0x140 (mobyfunc.s:1945-1947): +0x00 world X, +0x04 Y, +0x08 Z, +0x0C the primitive colour word, +0x10 packed {shape index, size, rotation phase, signed ordering-table bias}; a zero shape byte is a free slot (mobyfunc.s:1968). The shape table is D_8006430C, 64-byte entries indexed by the shape byte (mobyfunc.s:2012-2015)"

[[symbol]]
name = "F_GLINT_DRAW"
addr = 0x8004AC78
kind = "function"
note = "func_8004AC78 (mobyfunc.s:2192-2489), the gem-glint renderer: one call site, in the draw driver func_800155A0 under mask bit 0x10 (draw/func_800155A0.s:32), the write census's ra 0x800155FC. Walks the 16-slot pool at D_GLINT_POOL and, per live record, emits either one bundled draw-mode packet 0xE1000620 followed by eight POLY_G4 semi-transparent quads of a four-point star (half-world view depth under 0x2000, mobyfunc.s:2344) or two opaque LINE_F2 of a plain cross (at or above it), chained into a bucket off D_OT_BASE. The other game's func_8002F098 over 297 of its 298 instructions, the odd one a scratchpad slot"

[[symbol]]
name = "D_GLINT_POOL"
addr = 0x80067D00
note = "the gem-glint pool the renderer walks, 16 records of 0x10 bytes ending at +0x100 (mobyfunc.s:2205-2207): +0x00 world X, +0x04 Y, +0x08 Z, +0x0C packed {remaining lifetime, size, spin phase, colour-table row}; the renderer subtracts the tick's elapsed count from the lifetime byte and stores it back, so a zero byte is a free or expired slot (mobyfunc.s:2230-2238). The colour table is D_8006460C, rows of three words {pale centre, spike tip, near-black waist}, every word carrying 0x3A in its top byte"

[[symbol]]
name = "F_GLINT2_DRAW"
addr = 0x8004B194
kind = "function"
note = "func_8004B194 (mobyfunc.s:2548-2905), the jittered-beam renderer: one call site, in the draw driver func_800155A0 (draw/func_800155A0.s:34). Walks the 8-slot pool at D_GLINT2_POOL and, per live record, interpolates count+1 camera-relative points from the head world position to the tail one, displaces each interior point by the signed 8-bit fields of its own stored random halfword, widens every point into a pair perpendicular to the local path direction, RTPSes the pairs into the scratchpad at 0x1F800100 and appends one or two 8-word POLY_FT3 semi-transparent per segment, each linked into a bucket off D_OT_BASE keyed on its four corners mean SZ3. The whole record is dropped when the head offset leaves the +/-0x5400 box (mobyfunc.s:2608-2620) or when the middle point SZ3 reaches 0x5000 (mobyfunc.s:2819). The other game's func_8002F5B4 over the 358 instructions the two share; that one adds a game-state test suppressing the per-present re-randomize"

[[symbol]]
name = "D_GLINT2_POOL"
addr = 0x8006B400
note = "the jittered-beam pool the renderer walks, 8 records of 0x30 bytes ending at +0x180 (mobyfunc.s:2562-2564): +0x00 head world XYZ, +0x0C tail world XYZ, +0x18 the primitive colour word, +0x1C packed {segment count, jitter shift, re-randomize flag halfword} (mobyfunc.s:2589), +0x20 one random halfword per interior point. A zero count byte is a free slot"

[[symbol]]
name = "F_TRACER_RIBBON"
addr = 0x8004B72C
kind = "function"
note = "func_8004B72C (mobyfunc.s:2936-3157), the point-ring tracer ribbon: one call site, in the draw driver func_800155A0 under mask bit 0x10 (draw/func_800155A0.s:36). Walks the 0x20-slot array at D_TRACER_RING, projects each live record's ring points into the scratchpad at 0x1F800000 and appends one 13-word POLY_GT4 per consecutive pair, linked into a bucket off D_OT_BASE. A record is dropped whole when any point leaves the +/-0x6000 box (mobyfunc.s:2979-2989) or when its first point's SZ3 reaches 0x4000 (mobyfunc.s:3061). The other game's func_8002FB68 over 217 of its 222 instructions; the five that differ are this image's smaller record (0x30 bytes against 0x6C, packed word +0x28 against +0x64)"

[[symbol]]
name = "D_TRACER_RING"
addr = 0x8006A2B4
note = "the tracer ribbon array the renderer walks, 0x20 records of 0x30 bytes ending at +0x600 (mobyfunc.s:2938-2940): +0x00 the live pointer, zero = free slot, +0x04 a 6-entry circular buffer of packed unsigned XYZ halves (6 bytes each, mobyfunc.s:2947), +0x28 packed {head index, point count, signed half-width byte} (mobyfunc.s:2945), +0x2C the colour-plus-command word the DPCS fade starts from (mobyfunc.s:3056)"

[[symbol]]
name = "F_TRACER_MESH"
addr = 0x8004BAA4
kind = "function"
note = "func_8004BAA4 (mobyfunc.s:3180-3402), the indexed tracer mesh: called up to eight times per tick by the draw driver func_800155A0 over the 0x14-byte descriptors at D_80069F30, skipping a descriptor whose first word is zero (draw/func_800155A0.s:37-49). Projects the descriptor's vertex list into the scratchpad at 0x1F800000 as {screen XY, MAC3 and outcode} pairs and appends one 13-word POLY_GT4 per index entry; it also stores the highest ordering-table bucket it touched, so its body must run exactly once. The other game's func_8002FEE0 over the same arithmetic under a different load-delay schedule"
