# Curated PSX symbol aliases for the Spyro 2 engine layout (renderer/layout.c).
#
# Hand-maintained: the readable alias the layout uses, joined by address to
# the authoritative manifest (globals.toml / symbols.toml) at build time.
# tools/gen_symbols_header.py generates gen/spyro2_symbols.gen.h from this and
# Fails the build if any `addr` is not a symbol start in the manifest.
#
# The decomp names nothing here, so each row's note carries the identification
# evidence: the asm site in games/spyro-2/spyro-2/asm that reads or writes the
# address.

[[symbol]]
name = "G_ENVIRONMENT"
addr = 0x800673D4
note = "environment header: the world draw func_80023BB4 reads +0x00 sector list and +0x04 count (environment.s:1593-1594), stores the visibility return at +0x30 (environment.s:1569), reads the 48-byte texture table pointer at +0x20 (environment.s:2212), the LP far cull at +0x2C shifted right 7 minus 1 (environment.s:6924-6935) and the three far-colour words at +0x34/+0x38/+0x3C into ctc2 $21..$23 (environment.s:2479-2481); func_80048D18 reads the enable word at +0x10 and the world occlusion data at +0x08 (mobyfunc.s:16,29); the animation walkers read the block pointer at +0x1C (environment.s:1239)"

[[symbol]]
name = "G_CYCLORAMA"
addr = 0x800681B8
note = "sky header: +0x00 sector count and +0x04 sector pointer list, read by the sky draw func_80029170 (cyclorama.s:46-49); +0x08 the background colour 0x00BBGGRR, which the moby depth cue splits into three 0xFF0 fields for ctc2 $21..$23 (mobydraw.s:2597-2599). The word at +0x00 is written by the level loader func_8001C5EC (loaders/func_8001C5EC.s:27-28)"

[[symbol]]
name = "G_CAMERA"
addr = 0x80067E84
note = "camera: +0x00 the sky rotation matrix and +0x40 the depth-cue IR0 the sky draw loads (cyclorama.s:32-39), +0x14 the world rotation matrix the world draw loads into ctc2 $0..$4 (environment.s:1572-1576), +0x28 the position the world draw shifts right 4 for the sector cull (environment.s:1585-1587) and right 2 for the GTE translation (environment.s:2215-2220), +0x44 the rotation angles"

[[symbol]]
name = "G_SPYRO"
addr = 0x80069FF0
note = "player state block; opens with the world position, three int32"

[[symbol]]
name = "G_LEVELID"
addr = 0x80066F90
note = "the level number the loader loads; written by func_8001A9B0 (update/func_8001A9B0.s:36-37) and read by func_800151F0 (draw/func_800151F0.s:84-85)"

[[symbol]]
name = "G_CUR_DB"
addr = 0x80066FC0
note = "pointer to the draw buffer under construction; func_8004D810 flips it between G_DB and G_DB+0x74 (drawutil/func_8004D810.s:44-53)"

[[symbol]]
name = "G_DB"
addr = 0x80069928
note = "draw-buffer pair, stride 0x74 (drawutil/func_8004D810.s:46-52); DRAWENV at +0x00, the primitive buffer base at +0x70 (drawutil/func_8004D810.s:57)"

[[symbol]]
name = "D_POLYBUF_CURSOR"
addr = 0x80067030
note = "primitive cursor: set from the draw buffer's +0x70 base (drawutil/func_8004D810.s:57-62, draw/func_800145AC.s:162-163) and read by the sky draw (cyclorama.s:54-56)"

[[symbol]]
name = "D_POLYBUF_END"
addr = 0x80067034
note = "primitive buffer end = base + size, written beside the cursor (draw/func_800145AC.s:164-167); the world draw carves its scratch at end - 0x3000 (environment.s:1559-1563)"

[[symbol]]
name = "G_SIN"
addr = 0x80061BD8
note = "sin table, 256 s16 1.12 entries; func_8001B61C interpolates it from a 12-bit angle (stdutil.s:308-318) and func_8001B6C8 pairs it with the cos table D_80061C58 at +0x80 (stdutil.s:375-378)"

[[symbol]]
name = "D_ENV_ANIM_REGISTRY"
addr = 0x800681D4
note = "the environment-animation registry: seven {count, descriptor-pointer array} pairs at +0x00 through +0x34, walked in order by func_800225F8 (environment.s:14-19,89-90) and func_800231F4 (environment.s:832-835,871-872). Pair 0 memcpys whole 48-byte texture entries between tiles (environment.s:864-871); pair 1 is the UV scroll, whose descriptor holds a u16 tile index at +4 and a u16 accumulator at +6 and commits texel rows into the 48-byte entry (environment.s:138-155)"

[[symbol]]
name = "D_ENV_ANIM_LIVE"
addr = 0x8006B300
note = "liveness byte table indexed by an animation entry's low byte; the three arena walkers gate on it (environment.s:1240-1241,1272-1274)"

[[symbol]]
name = "G_MOBYARRAY"
addr = 0x80066F14
note = "pointer to the first Moby; the cull func_80043858 loads it and walks 0x58-byte records, ending at the record whose state byte at +0x48 is -1 (mobydraw.s:31-33,63-70)"

[[symbol]]
name = "G_MOBYMODELS"
addr = 0x80068C94
note = "the level model table, indexed by the Moby class halfword at +0x36 times 4; the entry's sign selects the model kind, a positive (KUSEG) entry going to the static queue (mobydraw.s:49-50,113-119)"

# ---- function addresses (validated against symbols.toml) ----
[[symbol]]
name = "F_WORLD_DRAW"
addr = 0x80023BB4
kind = "function"
note = "func_80023BB4, the world renderer (environment.s:1544); the terrain hook site"

[[symbol]]
name = "F_SKY_DRAW"
addr = 0x80029170
kind = "function"
note = "func_80029170, the cyclorama renderer (cyclorama.s:13); the sky hook site"

[[symbol]]
name = "F_VISIBILITY"
addr = 0x80048D18
kind = "function"
note = "func_80048D18, the per-sector visibility pre-pass (mobyfunc.s:13); called with a0 = 0 by the world draw (environment.s:1565-1566) and a0 = 1 by the sky draw (cyclorama.s:28-29)"

[[symbol]]
name = "F_MOBY_CULL"
addr = 0x80043858
kind = "function"
note = "func_80043858, the moby cull: carves the draw scratch at D_POLYBUF_END - 0x3000, builds the animated record queue at +0x2000 of it and the static queue at +0x1C00, and writes each moby's drawn verdict byte at +0x4D (mobydraw.s:13,26-46,73,224)"

[[symbol]]
name = "F_MOBY_DRAW_ANIM"
addr = 0x80044504
kind = "function"
note = "func_80044504, the animated moby draw: walks the 0x44-byte record queue, decodes each model's vertex and face streams and emits (mobydraw.s:869). One routine here where the other game's disassembly splits the same code into a function plus three data labels"

[[symbol]]
name = "F_MOBY_DRAW_STATIC"
addr = 0x80046FD8
kind = "function"
note = "func_80046FD8, the second model kind's draw: walks the stride-0x10 static queue at draw scratch +0x1C00 (mobydraw.s:3843)"

[[symbol]]
name = "F_PLAYER_DRAW"
addr = 0x80041DBC
kind = "function"
note = "the player avatar's own draw (spyrodraw.s:13, the whole translation unit at 0x1A9C bytes), run twice a tick: the mirrored copy with g_Spyro+0x2C set, then the avatar with it clear. It saves $s0..$s6 into the spill block D_8006A9EC and restores them before returning (spyrodraw.s:14-22). The shared player feeder's hook site"

[[symbol]]
name = "D_SPYRO_ANIMS"
addr = 0x80066F24
note = "pointer to the 256-entry Animation table the player draw indexes by the animation word's low byte (spyrodraw.s:35-37, entries at :56-60); the player-shadow draw reads the avatar's animation through the same pointer (mobyfunc.s:688). Written at level load"

[[symbol]]
name = "D_SPYRO_BLEND"
addr = 0x80062868
note = "the 256-byte table the player draw looks the keyframe blend byte up in (g_Spyro+0x1C for the body, +0x1D for the head) before shifting the result left four into the part record's IR0 field (spyrodraw.s:41-46,111-114,136). The moby cull maps Moby+0x40 through the same table (mobydraw.s:460-462)"

[[symbol]]
name = "D_PLAYERSHADOW"
addr = 0x800698D0
note = "the player's ground-shadow state block, read by the player-shadow draw func_800495E8 (mobyfunc.s:623-885): +0x00 a flag scaling every silhouette radius by 3/4, +0x04/+0x08/+0x0C the shadow's world position, +0x10 a packed byte-angle triple whose top byte at +0x13 suppresses the draw, +0x14 the ordering-key bias"

[[symbol]]
name = "D_SHADOW_RING"
addr = 0x800632CC
note = "16 packed s16 XZ direction pairs, one per player-shadow ring point; the player-shadow draw func_800495E8 loads the base (mobyfunc.s:774-775), reads a pair per point and shifts the product right 10 to form the local corner (mobyfunc.s:790)"

[[symbol]]
name = "F_PLAYER_SHADOW"
addr = 0x800495E8
kind = "function"
note = "the player's ground-shadow renderer (mobyfunc.s:622-888), called once after the two player draws by func_8004C534 (drawutil/func_8004C534.s:70); its 251 instructions align one for one onto the other game's func_8002D9BC, differing only in the six global addresses it loads"

[[symbol]]
name = "F_MOBY_SHADOWS"
addr = 0x800499D4
kind = "function"
note = "the moby drop-shadow renderer (mobyfunc.s:889-1235), called by func_8004C534 (drawutil/func_8004C534.s:23); its 330 instructions align one for one onto the other game's func_8002DDA8, differing only in the global addresses it loads"

[[symbol]]
name = "G_MOBYSHADOWS"
addr = 0x8006820C
note = "moby drop-shadow descriptor {uv0+clut, uv1+tpage, list end}: func_800499D4 loads +0x00/+0x04 as the shadow sprite's two UV words and +0x08 as the drawn-moby list terminator (mobyfunc.s:919-923), then subtracts 0x1F00 from the second to make the top-right corner (mobyfunc.s:924)"

[[symbol]]
name = "F_PARTICLES_DRAW"
addr = 0x80048128
kind = "function"
note = "the particle renderer (partsdraw.s:13-796, handwritten: it spills s0-s7/gp/sp/fp/ra and uses those registers as its own), called by the world-draw driver func_800155A0 (draw/func_800155A0.s:73). Walks the 0x20-byte pool at D_PARTS_ARRAY and appends one primitive per drawn record, stopping when the polybuf cursor comes within 0x400 bytes of D_POLYBUF_END (partsdraw.s:65). Classes 0-4 dispatch at partsdraw.s:81-89 and link at their own depth bucket; class 5 and up fall through and link at the fixed front entry"

[[symbol]]
name = "D_PARTS_ARRAY"
addr = 0x80066F18
note = "the word holding the base of the particle pool the renderer walks (partsdraw.s:57-59), 0x20 bytes per record: +0x00 the signed selector halfword (bits 8-11 the class, arithmetic shift by 8 equal to -1 ends the pool, otherwise negative = inactive slot), +0x03 the drawn stamp (partsdraw.s:225 cleared, :360 set), +0x04 X in the low half and Y in the high half, +0x08 Z in the low half (partsdraw.s:91-92), all in quarter world units"

[[symbol]]
name = "F_UI_OT_INSERT"
addr = 0x8001B390
kind = "function"
note = "func_8001B390 (stdutil.s:87-103) — links a0 into the 2D ordering table whose head word is D_80067000, instruction-for-instruction the other game's func_8004E758 with a different head global; called by drawutil, hud, draw and the level overlays and by no 3D translation unit, so it is the 2D feeder's chokepoint hook site"

[[symbol]]
name = "F_UI_FADE"
addr = 0x8004D748
kind = "function"
note = "func_8004D748(abrMode, r, g, b) (drawutil/func_8004D748.s:7-56) — the full-screen fade emitter: func_8005A01C(prim, 1, 0, abrMode << 5, 0) then a 0x2A POLY_F4 spanning x 0..0x200, y 0x0C..0xE4 with rgb at +0x10..+0x12, each linked through func_8001B390 and the polybuf cursor D_80067030 advanced 0x24. draw/func_800155A0.s:82,91 drives it from D_80066F68 at ABR 2 and D_80067150 at ABR 1; drawutil/func_8004D810.s:73 is the blocking 16-step variant"

[[symbol]]
name = "F_TEXT_SPRT"
addr = 0x8004A374
kind = "function"
note = "func_8004A374 (mobyfunc.s:1538-1690) — handwritten glyph emitter: one 0xC-byte DR_MODE carrying tpage 0x618 (mobyfunc.s:1570) then one 0x14-byte SPRT per glyph with clut 0x4922 (mobyfunc.s:1654), chained tag-to-tag and linked into D_80067000 inline without calling func_8001B390"

[[symbol]]
name = "F_TEXT_SPRT_PER_GLYPH"
addr = 0x8004A59C
kind = "function"
note = "func_8004A59C (mobyfunc.s:1692-1851) — the per-glyph-DR_MODE variant of func_8004A374, rewriting the tpage halfword inside every packet"

[[symbol]]
name = "D_PORTALS"
addr = 0x80066F00
note = "pointer to the level's portal record array, 0x44 bytes per record: five world-space pentagon vertices +0x00, preview mesh pointer +0x3C, enable/draw radius +0x40, back-side flag +0x41. The pass loads the pointer and indexes it by its byte cursor (drawutil/func_8004C66C.s:27-33), gates on +0x40 (:33), reads the back-side flag at +0x41 (:141) and the mesh pointer at +0x3C (:371-375), and advances the cursor by 0x44 (:716). It never reads +0x42 or +0x43"

[[symbol]]
name = "D_PORTALCOUNT"
addr = 0x80066FA8
note = "portal record count; the pass loops over it (drawutil/func_8004C66C.s:7-8,719-725)"

[[symbol]]
name = "D_PORTAL_BLOCK"
addr = 0x80068BF0
note = "the portal pass's parameter block for the preview leaf: +0x00 y-min, +0x04 y-max, +0x08 x-min, +0x0C x-max, +0x10 preview mesh pointer, +0x14 depth >> 7, +0x18/+0x1A/+0x1C far colour halfwords at GTE scale, +0x1E IR0, +0x20 edge count, +0x24 8-byte edge entries of packed screen points. Written per portal by func_8004C66C: the clip rect at :363-369 after its 0..512 and 12..228 clamps (:338-352), the mesh pointer at :375, the depth at :92, the far colours at :389-398, the IR0 at :686-698 and the edge count at :448; read only by func_800296D0"

[[symbol]]
name = "F_PORTAL_PASS"
addr = 0x8004C66C
kind = "function"
note = "func_8004C66C (drawutil/func_8004C66C.s) — per portal: gates, projects the pentagon with the sky matrix, fills D_PORTAL_BLOCK, calls F_PORTAL_LEAF (:701) with a descending argument, 0 on the last call (:704-711). The same routine as the other game's func_8001EDEC minus its opening animation on the record's +0x43 counter"

[[symbol]]
name = "F_PORTAL_LEAF"
addr = 0x800296D0
kind = "function"
note = "func_800296D0 (cyclorama.s:382) — draws one pre-projected preview mesh (a0 > 0 the base record, a0 == 0 the record at +0x3C) clipped to D_PORTAL_BLOCK's pentagon edges with two DPCS fades. Word-for-word the other game's func_8001C8C8 over all 525 instructions but for 49 addresses"
