# Curated PSX symbol aliases for the Spyro 2 engine layout (renderer/layout.c).
#
# Hand-maintained: the readable alias the layout uses, joined by address to
# the authoritative manifest (globals.toml / symbols.toml) at build time.
# tools/gen_symbols_header.py generates gen/spyro2_symbols.gen.h from this and
# Fails the build if any `addr` is not a symbol start in the manifest.
#
# The decomp names nothing here, so each row's note carries the identification
# evidence: the asm site in games/spyro-2/spyro-2/asm that reads or writes the
# address.

[[symbol]]
name = "G_ENVIRONMENT"
addr = 0x800673D4
note = "environment header: the world draw func_80023BB4 reads +0x00 sector list and +0x04 count (environment.s:1593-1594), stores the visibility return at +0x30 (environment.s:1569), reads the 48-byte texture table pointer at +0x20 (environment.s:2212), the LP far cull at +0x2C shifted right 7 minus 1 (environment.s:6924-6935) and the three far-colour words at +0x34/+0x38/+0x3C into ctc2 $21..$23 (environment.s:2479-2481); func_80048D18 reads the enable word at +0x10 and the world occlusion data at +0x08 (mobyfunc.s:16,29); the animation walkers read the block pointer at +0x1C (environment.s:1239)"

[[symbol]]
name = "G_CYCLORAMA"
addr = 0x800681B8
note = "sky header: +0x00 sector count and +0x04 sector pointer list, read by the sky draw func_80029170 (cyclorama.s:46-49); +0x08 the background colour 0x00BBGGRR, which the moby depth cue splits into three 0xFF0 fields for ctc2 $21..$23 (mobydraw.s:2597-2599). The word at +0x00 is written by the level loader func_8001C5EC (loaders/func_8001C5EC.s:27-28)"

[[symbol]]
name = "G_CAMERA"
addr = 0x80067E84
note = "camera: +0x00 the sky rotation matrix and +0x40 the depth-cue IR0 the sky draw loads (cyclorama.s:32-39), +0x14 the world rotation matrix the world draw loads into ctc2 $0..$4 (environment.s:1572-1576), +0x28 the position the world draw shifts right 4 for the sector cull (environment.s:1585-1587) and right 2 for the GTE translation (environment.s:2215-2220), +0x44 the rotation angles"

[[symbol]]
name = "G_SPYRO"
addr = 0x80069FF0
note = "player state block; opens with the world position, three int32"

[[symbol]]
name = "G_LEVELID"
addr = 0x80066F90
note = "the level number the loader loads; written by func_8001A9B0 (update/func_8001A9B0.s:36-37) and read by func_800151F0 (draw/func_800151F0.s:84-85)"

[[symbol]]
name = "G_CUR_DB"
addr = 0x80066FC0
note = "pointer to the draw buffer under construction; func_8004D810 flips it between G_DB and G_DB+0x74 (drawutil/func_8004D810.s:44-53)"

[[symbol]]
name = "G_DB"
addr = 0x80069928
note = "draw-buffer pair, stride 0x74 (drawutil/func_8004D810.s:46-52); DRAWENV at +0x00, the primitive buffer base at +0x70 (drawutil/func_8004D810.s:57)"

[[symbol]]
name = "D_POLYBUF_CURSOR"
addr = 0x80067030
note = "primitive cursor: set from the draw buffer's +0x70 base (drawutil/func_8004D810.s:57-62, draw/func_800145AC.s:162-163) and read by the sky draw (cyclorama.s:54-56)"

[[symbol]]
name = "D_POLYBUF_END"
addr = 0x80067034
note = "primitive buffer end = base + size, written beside the cursor (draw/func_800145AC.s:164-167); the world draw carves its scratch at end - 0x3000 (environment.s:1559-1563)"

[[symbol]]
name = "G_SIN"
addr = 0x80061BD8
note = "sin table, 256 s16 1.12 entries; func_8001B61C interpolates it from a 12-bit angle (stdutil.s:308-318) and func_8001B6C8 pairs it with the cos table D_80061C58 at +0x80 (stdutil.s:375-378)"

[[symbol]]
name = "D_ENV_ANIM_REGISTRY"
addr = 0x800681D4
note = "the environment-animation registry: seven {count, descriptor-pointer array} pairs at +0x00 through +0x34, walked in order by func_800225F8 (environment.s:14-19,89-90) and func_800231F4 (environment.s:832-835,871-872). Pair 0 memcpys whole 48-byte texture entries between tiles (environment.s:864-871); pair 1 is the UV scroll, whose descriptor holds a u16 tile index at +4 and a u16 accumulator at +6 and commits texel rows into the 48-byte entry (environment.s:138-155)"

[[symbol]]
name = "D_ENV_ANIM_LIVE"
addr = 0x8006B300
note = "liveness byte table indexed by an animation entry's low byte; the three arena walkers gate on it (environment.s:1240-1241,1272-1274)"

[[symbol]]
name = "G_MOBYARRAY"
addr = 0x80066F14
note = "pointer to the first Moby; the cull func_80043858 loads it and walks 0x58-byte records, ending at the record whose state byte at +0x48 is -1 (mobydraw.s:31-33,63-70)"

[[symbol]]
name = "G_MOBYMODELS"
addr = 0x80068C94
note = "the level model table, indexed by the Moby class halfword at +0x36 times 4; the entry's sign selects the model kind, a positive (KUSEG) entry going to the static queue (mobydraw.s:49-50,113-119)"

# ---- function addresses (validated against symbols.toml) ----
[[symbol]]
name = "F_WORLD_DRAW"
addr = 0x80023BB4
kind = "function"
note = "func_80023BB4, the world renderer (environment.s:1544); the terrain hook site"

[[symbol]]
name = "F_SKY_DRAW"
addr = 0x80029170
kind = "function"
note = "func_80029170, the cyclorama renderer (cyclorama.s:13); the sky hook site"

[[symbol]]
name = "F_VISIBILITY"
addr = 0x80048D18
kind = "function"
note = "func_80048D18, the per-sector visibility pre-pass (mobyfunc.s:13); called with a0 = 0 by the world draw (environment.s:1565-1566) and a0 = 1 by the sky draw (cyclorama.s:28-29)"

[[symbol]]
name = "F_MOBY_CULL"
addr = 0x80043858
kind = "function"
note = "func_80043858, the moby cull: carves the draw scratch at D_POLYBUF_END - 0x3000, builds the animated record queue at +0x2000 of it and the static queue at +0x1C00, and writes each moby's drawn verdict byte at +0x4D (mobydraw.s:13,26-46,73,224)"

[[symbol]]
name = "F_MOBY_DRAW_ANIM"
addr = 0x80044504
kind = "function"
note = "func_80044504, the animated moby draw: walks the 0x44-byte record queue, decodes each model's vertex and face streams and emits (mobydraw.s:869). One routine here where the other game's disassembly splits the same code into a function plus three data labels"

[[symbol]]
name = "F_MOBY_DRAW_STATIC"
addr = 0x80046FD8
kind = "function"
note = "func_80046FD8, the second model kind's draw: walks the stride-0x10 static queue at draw scratch +0x1C00 (mobydraw.s:3843)"

[[symbol]]
name = "F_PLAYER_DRAW"
addr = 0x80041DBC
kind = "function"
note = "the player avatar's own draw (spyrodraw.s:13, the whole translation unit at 0x1A9C bytes), run twice a tick: the mirrored copy with g_Spyro+0x2C set, then the avatar with it clear. It saves $s0..$s6 into the spill block D_8006A9EC and restores them before returning (spyrodraw.s:14-22). The shared player feeder's hook site"

[[symbol]]
name = "D_SPYRO_ANIMS"
addr = 0x80066F24
note = "pointer to the 256-entry Animation table the player draw indexes by the animation word's low byte (spyrodraw.s:35-37, entries at :56-60); the player-shadow draw reads the avatar's animation through the same pointer (mobyfunc.s:688). Written at level load"

[[symbol]]
name = "D_SPYRO_BLEND"
addr = 0x80062868
note = "the 256-byte table the player draw looks the keyframe blend byte up in (g_Spyro+0x1C for the body, +0x1D for the head) before shifting the result left four into the part record's IR0 field (spyrodraw.s:41-46,111-114,136). The moby cull maps Moby+0x40 through the same table (mobydraw.s:460-462)"

[[symbol]]
name = "D_PLAYERSHADOW"
addr = 0x800698D0
note = "the player's ground-shadow state block, read by the player-shadow draw func_800495E8 (mobyfunc.s:623-885): +0x00 a flag scaling every silhouette radius by 3/4, +0x04/+0x08/+0x0C the shadow's world position, +0x10 a packed byte-angle triple whose top byte at +0x13 suppresses the draw, +0x14 the ordering-key bias"
