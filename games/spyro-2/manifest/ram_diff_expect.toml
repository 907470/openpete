# games/spyro-2/manifest/ram_diff_expect.toml — what a whole-RAM diff against
# the DuckStation reference is expected to show at this game's anchors
# (scripts/check_ram_diff.sh, tools/ram_diff.py).
#
# A range leaves this file only by a fix that makes the bytes agree, never
# by a re-bless. Every listed class is capped at 25% of RAM by the tool.

map = "games/spyro-2/spyro-2/build/psx.map"

[disc]
id = "SCUS-94425"

[openpete]
args = []

[reference]
# openpete's Spyro 2 stalls at its first card wait with a card present (P8):
# no card on either side.
card = "none"
# The reference module's configuration these baselines were taken under:
# SCPH-1001 BIOS with the regtest host's fast-boot patch, NTSC-U disc, analog
# controller in port 1. A changed setting moves the kernel and bios_stack
# baselines; state the change here when it happens.
bios      = "SCPH-1001"
fast_boot = true

[anchors]
# first: entry of the function issuing the game's first CdRead
# (ra 0x800138E8); no load has been issued on either side at hit 1.
first = 0x80013810
# loop: func_8001B140, the first call of each main-loop iteration in
# func_80011ADC (init, then { func_8001B140; func_800156FC } forever).
loop  = 0x8001B140

# psyq_internal ratchet: differing bytes, ranges, a digest of the differing
# offsets and the hit, measured inside the PSYQ extents when this file was
# written; the tool fails on any change in either direction (a drop tightens
# the baseline in the same change as its fix) and refuses another hit. A
# hex-spelled anchor needs its own row, keyed by that spelling.
[psyq_internal_baseline]
first = { bytes = 204, ranges = 26, digest = "7123af76d85ea4c5", hit = 1 }
# The loop count includes 0x8006671B, the track byte of the last CdlSetloc
# position: libcd copies the caller's 4-byte CdlLOC, CdIntToPos fills three,
# and the fourth is dead stack content that differs between the sides.
loop  = { bytes = 1254, ranges = 88, digest = "74ef5af6fe887edb", hit = 1700 }

[bios_stack]
low = 0x801FFB50

# PSYQ library sections, from the decomp link map (spyro-2/build/psx.map).
[[psyq_internal]]
start  = 0x80064F14
length = 0x1E24
source = "psx.map:5208 .data psyq.data.o"

[[psyq_internal]]
start  = 0x80067188
length = 0x4
source = "psx.map:6096 .sbss psyq.sbss.o"

[[psyq_internal]]
start  = 0x8006B580
length = 0x1CE4
source = "psx.map:7552 .bss psyq.bss.o"

# Named ranges at the loop anchor.
[[expect]]
class  = "vbl_count"
start  = 0x80066F9C
end    = 0x80066FA4
name   = "D_80066F9C, D_80066FA0 (VBL counters, draw/func_800156FC)"
reason = "advance per VBL; hardware spends the load's wall time in VBLs that openpete's synchronous CdRead does not"
owner  = "openpete-psx-oracle-ci"

[[expect]]
class  = "pad_model"
start  = 0x8006A960
end    = 0x8006A964
name   = "D_8006A960 (stick centre bytes, pad/func_800121B0)"
reason = "the analog pad answers 0x80 per axis; openpete's pad model answers 0x7F"
owner  = "P16"

[[expect]]
class  = "pad_model"
start  = 0x8006AB4C
end    = 0x8006AB54
name   = "D_8006AB4C (pad receive words, init.c)"
reason = "the analog pad's poll answer; openpete's pad model answers a digital poll"
owner  = "P16"

# libcd's state block: the bytes its translated getters read, written by the
# shared CD thunks. A differing byte here is a defective mirror.
[[populated]]
start  = 0x8006670C
length = 0x1
name   = "libcd block 0x80066700 CD status (CdStatus)"

[[populated]]
start  = 0x80066718
length = 0x3
name   = "libcd block 0x80066700 last CdlSetloc position (CdLastPos), minute/second/sector"

[[populated]]
start  = 0x8006671C
length = 0x2
name   = "libcd block 0x80066700 mode and last command (CdMode, CdLastCom)"

# Drive timing the game records; openpete fixes seeks at zero VBLs (drive
# model abandoned 2026-09-05), hardware's vary with head distance.
[[expect]]
class  = "cd_timing"
start  = 0x8006830C
end    = 0x80068314
name   = "D_8006830C, D_80068310 (stream driver: state-5 countdown and retry word, str/func_80012CBC)"
reason = "the countdown runs from 300 while the drive seeks; hardware's seek takes 13 to 15 iterations, openpete's none"
owner  = "openpete-spyro2-3-bringup"

[[expect]]
class  = "cd_timing"
start  = 0x80068324
end    = 0x80068328
name   = "D_80068324 (furthest CdlGetlocP position, str/func_80012CBC)"
reason = "hardware's head starts after its seek; openpete's virtual head starts at the CdlReadS"
owner  = "openpete-spyro2-3-bringup"

[[expect]]
class  = "pad_model"
start  = 0x80068370
end    = 0x80068374
name   = "D_80068370-D_80068373 (pad type, mode-set, actuator-set, DualShock flags, pad/func_8001271C)"
reason = "hardware's DualShock answers id 7 with two actuators; openpete's pad model answers a digital pad"
owner  = "P16"

[[expect]]
class  = "pad_model"
start  = 0x80068238
end    = 0x8006823C
name   = "D_80068238 (copy of D_80068370, spyroupdate/func_800313E4)"
reason = "copy of the pad flag bytes above"
owner  = "P16"

[[expect]]
class  = "vbl_count"
start  = 0x800682EC
end    = 0x800682F0
name   = "D_800682EC (VBLs since the last CdRead was issued; zeroed by str/func_80013810 and peers, incremented by the VBL callback pad/func_800125C8)"
reason = "advances per VBL; hardware spends the load's wall time in VBLs that openpete's synchronous CdRead does not"
owner  = "openpete-psx-oracle-ci"

# Words the crt0 and InitHeap write on the way to main: the heap base and
# size, and the BIOS return address the crt0 stores.
[[populated]]
start  = 0x80065098
length = 0x8
name   = "heap base and size (crt0, InitHeap)"

[[populated]]
start  = 0x80067188
length = 0x4
name   = "BIOS Exec return address stored by the crt0"
