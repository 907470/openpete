start  = 0x8007F071
length = 0x1F
class  = "gameplay"

[[region]]
name   = "overlay_image_3"
start  = 0x8007F091
length = 0x5B
class  = "gameplay"

[[region]]
name   = "overlay_image_4"
start  = 0x8007F0F1
length = 0x5B
class  = "gameplay"

[[region]]
name   = "overlay_image_5"
start  = 0x8007F169
length = 0x17
class  = "gameplay"

[[region]]
name   = "overlay_image_6"
start  = 0x8007F185
length = 0xD0DF
class  = "gameplay"

# The moby array in level RAM: D_80066F14 points at the first Moby (stride
# 0x58), and the array ends at the first element whose state byte (+0x48)
# is -1 (updatemobys.s 0x80040EEC loop exits on it; no count word). Cap
# 1024 elements; the attract demo holds up to 310.
[[region]]
name          = "moby_array"
kind          = "indirect_array"
base_ptr      = 0x80066F14
element_size  = 0x58
max_elements  = 1024
live_sentinel = { offset = 0x48, value = 0xFF }
class         = "gameplay"
description   = "Level and allocated mobys behind *D_80066F14, to the state == -1 terminator"

# libcd's state block, written by the shared CD thunks and read by the
# translated CdStatus/CdLastPos/CdMode/CdLastCom every tick
# (ram_diff_expect.toml [[populated]]). A differing byte is a thunk defect.
[[region]]
name        = "libcd_CdStatus"
start       = 0x8006670C
length      = 0x1
class       = "psyq_mirror"
description = "libcd block 0x80066700: CD status byte (CdStatus); reads 0x42 (seeking) on hardware for ~14 ticks at every XA stream start where the thunk mirrors 0x22, and the game's readers test only bit 0x10"
cd_load_transient = true
diverge_baseline = 311

[[region]]
name        = "libcd_CdLastPos"
start       = 0x80066718
length      = 0x3
class       = "psyq_mirror"
description = "libcd block 0x80066700: last CdlSetloc position (CdLastPos), minute/second/sector"

[[region]]
name        = "libcd_CdMode_CdLastCom"
start       = 0x8006671C
length      = 0x2
class       = "psyq_mirror"
description = "libcd block 0x80066700: drive mode (mode | 0x20 after a CdRead) and last command; the last command differs for the stream's seek phase (Nop on hardware, GetlocP in the thunk)"
cd_load_transient = true
diverge_baseline = 311

# crt0 mirrors, set once at boot.
[[region]]
name        = "crt0_heap"
start       = 0x80065098
length      = 0x8
class       = "psyq_mirror"
description = "heap base and size (crt0, InitHeap)"
constant_ok = true

[[region]]
name        = "crt0_exec_return"
start       = 0x80067188
length      = 0x4
class       = "psyq_mirror"
description = "BIOS Exec return address stored by the crt0"
constant_ok = true

# Kernel RAM (SCPH-1001), seeded at boot as the ROM leaves it at the EXE
# entry (openpete_psx_bios_seed_ram) and written by the file calls
# (B(32h), B(33h), B(35h), B(36h)) and A(39h) InitHeap. Every row is a
# struct extent; the gaps between them are uncompared:
# - open, the card-event phase's: the event table 0xE028-0xE28F,
#   InitCard's hook 0xCF0-0xCFB (libcard _patch_card, PCs 0x8007EEDC and
#   0x8007EEEC, reads once at boot the lui/addiu pair InitCard writes at
#   0xCF0 and 0xCF4; openpete seeds the same two words), card driver
#   state 0x7264-0x75CD, the bu state words 0xB9D0 and 0xB9D8, exception
#   chain slot 1's head 0xE00C-0xE00F (the kernel enqueues the card
#   driver's handler 0x7540 there at a card operation and dequeues it at
#   completion); the card-wait phase's: the bu broken lists, directory
#   cache and sector buffers 0xB9E8-0xBE51;
# - open, written by thunked libraries: B(19h) 0x75D0-0x75D3 and C(03h)
#   0x91E0-0x91E1 (libetc ResetCallback), exception chain slot 0's head
#   0xE004-0xE007 (C(03h)) and slot 2's head 0xE014-0xE017 (InitCard,
#   then libpad PadStartCom's C(02h)), fd 1's buffer and count
#   0x867C-0x8683 (printf's write(1)), event table entry 0 (libspu
#   SpuStart);
# - carved out, uncompared, proven inert: kernel code and ROM-copied
#   data outside these tables (0x500-0x673, 0x9F4-0x6EDF, 0x7200-0x863F,
#   0x8908-0x8FFF, 0x9010-0xDFFF, 0xE59C-0xFFFF, less the ranges listed
#   here): a read census of guest loads from 0x0-0xFFFF over the
#   cardless gate run (236 address-width-caller rows, 1766220 loads)
#   finds 2 game loads there, each once at boot, and neither changes a
#   store or a branch. PC 0x8005C298 (libgte InitGeom's exception-
#   handler patch) compares the words from 0xCA8 against its 6-word
#   template and patches only on a full match; hardware's ROM handler
#   mismatches at the fifth word (loads 0xCA8-0xCBB), openpete's zeros
#   at the first, and neither stores. PC 0x8007EF70 (libcard
#   _patch_card2) loads 0x4D98-0x4D9B into a register it never reads,
#   then stores its 5-word stub there unconditionally. The binary
#   carries no ROM content for these ranges;
# - carved out, uncompared: thread 0's register save 0xE2A4-0xE337 (the
#   registers at the last exception; the reference rewrites it from
#   0xE2A8 on) and the kernel stack 0x84BC-0x85D1 (frames of kernel and
#   interrupt code): the same census finds 0 game loads in either range.

[[region]]
name        = "kernel_low_words"
start       = 0x80000000
length      = 0x80
class       = "kernel"
description = "Exception vector copy (first word 3, as the boot leaves it), the RAM size word at 0x60 and the boot flags at 0x68; card sector 0x3F is written from these bytes"
constant_ok = true

[[region]]
name        = "kernel_table_of_tables"
