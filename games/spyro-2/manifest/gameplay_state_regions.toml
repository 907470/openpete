# games/spyro-2/manifest/gameplay_state_regions.toml - the gameplay-readable
# bytes the oracle hashes every tick. Generated into the
# build by tools/gen_state_regions.py (cmake/openpete_game.cmake): the C
# table the exe registers, the flat table the DuckStation capture module
# reads, and their shared FNV-1a-64 in the trace header.
#
# Derivation (tools/derive_state_regions.py spyro-2): the main image's
# .data/.sdata/.sbss/.bss extents from spyro-2/build/psx.map, minus the
# psyq_internal extents and every [[expect]] range of ram_diff_expect.toml
# (vbl_count and cd_timing classes established by the loop anchor PASS at
# hit 1700, load_timing at hit 1), the named rows carved out, the rest coalesced:
# one row per extent (Spyro 2's map names no roles; D_<addr> symbols are
# counted). Then the overlay image union (--overlay 0x8006D264:0x1F000: one
# row per piece between the [[expect]] ranges inside it, each a CdRead
# destination), the moby array, and the libcd mirror rows. The overlay
# pieces and the moby array are strict: every read of this game is
# synchronous and the golden's schedule lands it at the reference's
# VBLANK, so no partial landing is ever hashed.
#
# Row fields beyond the generator's (start/length or the indirect_array
# keys, mask_offsets/mask_per_element, cd_load_transient, gameplay_neutral,
# constant_ok): `class` is gameplay | render_scratch | psyq_mirror |
# kernel (kernel RAM below 0x10000, not derived from the image). No row
# is render_scratch yet: no OT or primitive buffer of this game has been
# located inside the main image (Spyro 2's DR_MODE packets and both games'
# ordering tables sit in level RAM, outside these rows). A render-side
# range found inside an extent when the golden lands is split out as a
# named render_scratch row, never absorbed by a flag on the extent.
#
# Carve-outs (commented rows; the ranges are subtracted above):
#   vbl_count   D_80066F9C/D_80066FA0 (VBL counters), D_800682EC (VBLs since
#               the last CdRead) - the reference spends the load's wall time
#               in VBLs that openpete's synchronous CdRead does not; removed
#               once openpete charges the reference's VBLs inside each
#               synchronous read
#   load_timing D_8006700C (word), D_80067160, title overlay 0x8007F02C, 0x8007F06C-
#               0x8007F071, 0x8007F090, 0x8007F0EC-0x8007F0F1, 0x8007F14C-
#               0x8007F169 (step index table), 0x8007F180-0x8007F185 (per-step
#               flags) - the title sequence sits one step further on the
#               reference at hit 1, its counters 6 VBLs ahead; removed
#               once openpete charges the pre-anchor reads their VBLs
#   cd_timing   D_8006830C/D_80068310, D_80068324 - stream-seek countdown and
#               head position; a stream-seek residual no read model removes

# The arguments tools/derive_state_regions.py derived the direct rows from;
# `--check` re-derives and compares (ctest state_regions_derivation_spyro-2).
[derivation]
named   = ["g_LevelIndex=0x80066F54:4", "psyq_rand_seed=0x8006D144:4", "spu_voice_table=0x80069A10:0x420"]
overlay = "0x8006D264:0x1F000"
min_row = 1

[[region]]
name        = "g_LevelIndex"
start       = 0x80066F54
length      = 0x4
class       = "gameplay"
description = "Linear level index 0..28 (D_80066F54; games/spyro-2/skip_to_level.c), carved out of the .sbss extent as its own row"

[[region]]
name        = "psyq_rand_seed"
start       = 0x8006D144
length      = 0x4
class       = "gameplay"
description = "PSYQ rand/srand seed word D_8006D144 (libc .bss, inside the subtracted psyq_internal extent). Seeded from root counter 2 (func_8001AAA4: srand(*0x1F801120)) and with 1234 by the loader in demo mode"

# .data extent 0: 876 symbols
[[region]]
name   = "main_data_8006012c"
start  = 0x8006012C
length = 0x4DE8
class  = "gameplay"

# .sdata extent 1: 139 symbols
[[region]]
name   = "main_sdata_80066d38"
start  = 0x80066D38
length = 0x1A0
class  = "gameplay"

# .sbss extent 2: 62 symbols
[[region]]
name   = "main_sbss_80066ed8"
start  = 0x80066ED8
length = 0x7C
class  = "gameplay"

# .sbss extent 3: 34 symbols
[[region]]
name   = "main_sbss_80066f58"
start  = 0x80066F58
length = 0x44
class  = "gameplay"

# .sbss extent 4: 54 symbols
[[region]]
name   = "main_sbss_80066fa4"
start  = 0x80066FA4
length = 0x68
class  = "gameplay"

# .sbss extent 5: 166 symbols
[[region]]
name   = "main_sbss_80067010"
start  = 0x80067010
length = 0x150
class  = "gameplay"

# .sbss extent 6: 18 symbols
[[region]]
name   = "main_sbss_80067161"
start  = 0x80067161
length = 0x27
class  = "gameplay"

# .bss extent 7: 504 symbols
[[region]]
name   = "main_bss_8006718c"
start  = 0x8006718C
length = 0x1160
class  = "gameplay"

# .bss extent 8: 14 symbols
[[region]]
name   = "main_bss_800682f0"
start  = 0x800682F0
length = 0x1C
class  = "gameplay"
# D_800682F4 (stream state) and D_800682FC (seek countdown): the XA
# stream's seek phase, which the drive spends ~14 ticks in at every stream
# start on hardware and openpete does not model (stream_timing; heals
# when the stream plays).
cd_load_transient = true
diverge_baseline = 380

# .bss extent 9: 6 symbols
[[region]]
name   = "main_bss_80068314"
start  = 0x80068314
length = 0x10
class  = "gameplay"

# .bss extent 10: 290 symbols
[[region]]
name   = "main_bss_80068328"
start  = 0x80068328
length = 0x16E8
class  = "gameplay"

# spu/func_80050720's voice table: the state the host SPU's envelope and
# voice allocation answer with, one tick apart from hardware in short
# bursts (host-precision residual, the class of Spyro 1's m_SoundChannel
# masks). Logged, never hard-fails; the count is the ratchet.
[[region]]
name   = "spu_voice_table"
start  = 0x80069A10
length = 0x420
class  = "gameplay"
host_precision = true
diverge_baseline = 946
description = "SPU voice table D_80069A10..D_80069E30 (spu/func_80050720, func_80050B74, func_80050D38): per-voice envelope and allocation state from the host SPU"

# .bss extent 11: after the voice table, 576 symbols
[[region]]
name   = "main_bss_80069e30"
start  = 0x80069E30
length = 0x1750
class  = "gameplay"
mask_offsets = [0x424, 0x425, 0x426, 0x427, 0x42C, 0x42D, 0x42E, 0x42F]
mask_reason  = "D_8006A254 and D_8006A25C (spyroupdate/func_800351D8: the voice handles spu/func_80050A40 returned for Spyro's own sounds): the SPU voice the host allocator answered (host-precision residual, the class of Spyro 1's m_damageSoundChannel/m_chargeSoundChannel masks)"

# overlay image union 0x8006D264-0x8008C264, cut at 6 expect range(s) into 7 row(s); every piece is a CdRead destination
[[region]]
name   = "overlay_image_0"
start  = 0x8006D264
length = 0x11DC8
class  = "gameplay"

[[region]]
name   = "overlay_image_1"
start  = 0x8007F02D
length = 0x3F
class  = "gameplay"

[[region]]
