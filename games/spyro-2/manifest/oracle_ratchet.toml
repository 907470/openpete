# games/spyro-2/manifest/oracle_ratchet.toml - the events the oracle tolerates
# on each stock row of this game, by name. One table per golden (its file
# name without `.bin`); tests/harness/check_psx_oracle.sh passes the file and
# the table to the verifier (core/diag/psxtrace_ratchet.c), which fails the
# row on any event the table does not list:
#
#   gte              records whose GTE hash row differs from the reference's
#                    (a hash-only row directly after an op-count row is the
#                    carry of that event and is not listed)
#   vbl              records that open a VBL deficit against the reference
#                    (the record after, which closes it, is the same event)
#   gameplay_bursts  "REGION@RECORD": a cd_load_transient burst that opens
#                    outside a load span (no CdRead issued by the reference
#                    at that record and no load burst open)
#
# Every entry is in-tick timing this engine does not replay yet (the
# reference's VBLANK positions inside a tick's work and its SPU clock); the
# clock row (OPENPETE_ORACLE_CLOCK=1) replays both and holds every list at
# zero. A listed entry a complete run does not produce is reported stale;
# `python3 tools/oracle_ratchet.py tighten LOG` drops it. A table only
# shrinks, unless `--accept REASON` admits a new event.

# accepted: GTE: the magnitude computation at func_8001BA20 0x8001BAA4,
# each on a host-SPU `spu_voice_table` burst (21 op-count rows, 4 carries
# folded, 26 hash-only rows). The clock row holds 0.

