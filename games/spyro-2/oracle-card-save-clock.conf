# Reference capture of the Spyro 2 save movie past the save, for the clock
# row (OPENPETE_ORACLE_CLOCK=1 OPENPETE_ORACLE_GTE_STRICT=1), sourced by
# scripts/capture_psx_oracle_ds.sh --game spyro-2 --recipe
# games/spyro-2/oracle-card-save-clock.conf and by
# tests/harness/check_psx_oracle.sh --game spyro-2 --recipe
# games/spyro-2/oracle-card-save-clock.conf. The recorders, movie, card and
# root-counter-2 answers of games/spyro-2/oracle-card-save.conf, with its own
# golden and 600 records: from record 432 the level the save returns to
# takes a VBLANK inside the game tick (VBL 2220), whose VSync callback
# func_800125C8 increments D_8006700C before func_8004C66C reads it. The
# stock run charges that VBL at the next wait and diverges at record 434;
# the clock row delivers it at its recorded function entry (<golden>.vblpos).
# A separate capture, since the gate requires the golden's record count and
# runs the whole trace: the stock recipe's 420 records end before that VBL.
# Generated, never committed.
source games/spyro-2/oracle-card-save.conf
GOLDEN="tests/golden/spyro-2/psxtrace-card-save-clock.bin"
FRAMES=600
CARD1_END="tests/golden/spyro-2/psxtrace-card-save-clock.bin.card1-end.mcd"
_clock_args=()
_next_end=0
for _a in "${CAPTURE_ARGS[@]}"; do
    if (( _next_end )); then _clock_args+=("$CARD1_END"); _next_end=0; continue; fi
    [[ "$_a" == --card-export-end ]] && _next_end=1
    _clock_args+=("$_a")
done
CAPTURE_ARGS=("${_clock_args[@]}")
CONSTANT_REGIONS_REASON="the 600 records end before the code that changes them runs"
unset _a _clock_args _next_end
