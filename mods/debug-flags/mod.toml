# debug-flags - sets progress flags the game otherwise reads from a memory
# card, from buttons in the Mods panel.
#
# The source holds a table of named actions: a guest address, its width,
# the value to write and the game it belongs to. The mod's section in the
# Mods panel draws one button per action of the running game, an "Apply
# all" button, and beside each button the value the address held at the
# last tick. A press queues the write; the per-tick hook writes it on the
# next tick, never from the panel.
#
# Actions:
# - Spyro 2, "Ripto defeated (opens the Dragon Shores portal)": the
#   halfword 0x800646AE = 1, entry 15 of the progress table at 0x80064670,
#   which Ripto's Arena (level 66) sets when Ripto is beaten. Winter
#   Tundra's portal-gate object (class 0x16D) tests it every tick and opens
#   the Dragon Shores portal while it is nonzero, so a press inside Winter
#   Tundra opens the portal without a reload. The game also reads it in
#   the pause menu (func_800176A4), the HUD (func_8004F6F4) and code in
#   every level overlay.
# - Spyro 2, "Swim (dive underwater)", "Climb (ladders)" and "Headbash
#   (triangle in the air)": the halfwords 0x80064682, 0x80064686 and
#   0x8006468A = 1, the paid flags of progress entries 4, 5 and 6, which
#   Moneybags' pay opcode stores when the lesson is bought (func_8003A568).
#   The player code reads each one at its gate every time: the swim code
#   of the overlays with water dives on Square at the surface only while
#   0x80064682 is nonzero, the ladder test (func_8002D328) returns at once
#   while 0x80064686 is zero, and the airborne triangle test
#   (func_80035D38) starts the headbash only while 0x8006468A is nonzero.
#   A press takes effect in the running level.
# - Spyro 2, "Permanent superflame": the byte 0x800698BB = 1, which the
#   powerup gate's permanent-superflame case sets. The flame button fires
#   the superflame shot while it is nonzero (func_8002FC20); the card
#   record keeps it.
# - Spyro 2, "Glimmer gem lamps lit (both big gems emit)": Glimmer's two
#   gem-lamp puzzles, each a big gem (class 0x40C) and six gem lamps
#   (class 0x21C). The row writes 0x3F to each waiting gem's lamp-bit byte
#   (moby +0x49) and the flame-hit bit 0x10000 to moby +0x18 of each unlit
#   lamp; the gem's update then completes the puzzle itself (camera
#   sequence, the gem cutter's dialogue, orbiting and emitted mobys) and
#   each lamp lights when it next updates. Queued outside Glimmer, it
#   applies once Glimmer is in play.
# - Spyro 3, "Permanent superflame": the byte 0x8006FB93 = 1
#   (g_CheatFlags + 3), set by the same powerup-gate case and read by the
#   flame code (func_80045D70) the same way.
#
# The flags are guest RAM and a save written after a press keeps them.
# Play on scratch cards (--card1/--card2) or --no-card to keep a save
# unchanged.
#
# - Spyro 3, "Atlas page stress (synthetic progress)": while the atlas
#   overlay is resident (two of its code words read back), the
#   Sorceress-defeated byte 0x8007158F = 1, 9999999 in each of the 39
#   per-level gem words at 0x80071A10 and 0xFF in each per-level egg mask
#   at 0x80070300. The values are synthetic: no save reaches them. Every
#   atlas number widens, so a page turn links more 2D primitives than any
#   real save.
#
# uses: `openpete_mod_ui.h` - the button panel; a press sets a host bit, never guest RAM
# uses: `api->override_name` - the Spyro 1 tick hook on GamestateUpdate
# uses: `api->override_addr` - the Spyro 2 and 3 tick hooks, by address
# uses: `api->base` - each hook is a pre-hook and runs the game update after the writes
# uses: `op_read_u8` / `op_read_u16` / `op_write_u8` / `op_write_u16` - reads each flag for the panel and writes queued ones
# uses: `api->game_id` - selects the running game's rows
# uses: `api->config_int` / `api->config_str` - the headless test trigger
# uses: `api->log` - one line per write

[mod]
id      = "debug-flags"
name    = "Debug Flags"
version = "0.1.0"
game    = ["spyro-1", "spyro-2", "spyro-3"]
api     = 13
state    = "none"      # the flags are guest RAM; the queue is host input
runahead = "host-fx"   # one log line per write
sim_mutative = true
