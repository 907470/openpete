# moby-instance-tint — per-instance material selector gallery rung
# (mod-shaders S8b). A selector on ALL mobys with a per-instance
# callback that tints each instance by a hash of its vaddr, so every
# moby renders a distinct stable colour — demonstrating that the
# callback runs per instance and the batcher splits draws by outcome.
# A real mod keys the callback on gameplay state (m_State FLAMED, a
# per-instance timer, distance) rather than the vaddr.
#
# COST NOTE: per-instance overrides split the ~70-draw batched scene by
# distinct outcome — this all-moby demo interns ~100 slots (~100 extra
# draws). Scope real selectors to a class + a rare state to stay cheap;
# the [gpu-pass] / draw-count instruments name the cost.

[mod]
id = "moby-instance-tint"
name = "Moby Instance Tint"
version = "0.1.0"
api = 2
sim_neutral = true

[test]
frames = 4000
gameplay_neutral = true
