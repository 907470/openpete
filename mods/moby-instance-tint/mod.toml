# moby-instance-tint — a refine callback made visible.
#
# A selector on all mobys with a refine callback that tints each instance
# by a hash of its guest address, so every moby renders a distinct stable
# colour. If the callback ran once per class rather than once per
# instance, every moby of a kind would come out identical.
#
# A real mod keys the callback on gameplay state (m_State, a per-instance
# timer, distance) and scopes the selector to a class first.
#
# Cost: instances whose uniform blocks are byte-identical share one slot
# and one batch, so cost follows distinct outcomes, not matches. A
# per-address hash is the worst case: this all-moby demo interns about
# 100 slots and costs about 100 extra draws.

[mod]
id = "moby-instance-tint"
name = "Moby Instance Tint"
version = "0.2.0"
api = 5            # material_register_refine; engine-owned main()
state = "none"     # GPU-only; nothing to save
runahead = "pure"  # no tick hooks
sim_mutative = false
