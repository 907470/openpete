# arena-probe — CI fixture: guest_alloc round trip.
#
# Allocates in the arena, writes through the host view, reads back through
# the guest path, and stays oracle-exact: the arena is host-backed, so
# using it perturbs no canonical guest RAM.

[mod]
id      = "arena-probe"
name    = "Guest Arena Probe"
version = "0.1.0"
api     = 1
state    = "none"      # one-shot entry probe, no hooks
runahead = "pure"      # no tick hooks at all
sim_mutative = false  # allocation alone touches no canonical RAM
