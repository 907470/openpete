# double-gems - every gem pickup counts double.
#
# The event-detection idiom: a post-hook on CollectItem diffs the gem total
# around base() and writes the doubled total back through api->guest. This
# changes gameplay state, so the mod is mutative and a memory card played
# with it is tagged.

[mod]
id      = "double-gems"
name    = "Double Gems"
version = "0.1.0"
game    = ["spyro-1", "spyro-2", "spyro-3"]
api     = 1
state    = "none"      # counters only; nothing world-derived
runahead = "host-fx"   # logs on pickup - suppressible
