# chain-duo-a - CI fixture: one of two mods overriding CameraUpdate.
#
# With chain-duo-b, checks that enabled-list order sets chain priority:
# the mod listed later runs first and base() descends toward the earlier
# one, then the original. tests/harness/check_mods.sh runs both orderings and
# asserts the nesting flips. Log-only.

[mod]
id      = "chain-duo-a"
name    = "Chain Duo A"
version = "0.1.0"
game    = ["spyro-1", "spyro-2", "spyro-3"]
api     = 1
state    = "none"      # call counter only
runahead = "host-fx"   # nesting logs - suppressible
