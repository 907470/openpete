# music-swap — one replacement music track, no code.
#
# Ships assets/music/track_20.wav (the title theme becomes a 440 Hz tone).
# Mod roots outrank the base assets/music/ directory, so this wins even
# when the player has their own track_20.wav installed.

[mod]
id      = "music-swap"
name    = "Music Swap"
version = "0.1.0"
api     = 1
