# mat-chain-ref2 - material composition fixture: one material whose shader is mat-chain-b over mat-chain-a written by hand, the reference a composed a,b capture must equal. exclusive, so it never composes.
# Never enable it to play.

[mod]
id      = "mat-chain-ref2"
name    = "Material Fixture: Chain Reference (2)"
version = "0.1.0"
game    = ["spyro-1", "spyro-2", "spyro-3"]
api     = 13
state    = "none"
runahead = "pure"
sim_mutative = false

[[material]]
frag    = "shaders/ref2.frag"
channel = "moby"
params  = [1.0, 0.0, 0.0, 0.5, 0.5, 1.0, 1.0, 0.0]
exclusive = true
