# sfx-single-sound — the asset overlay's sound namespace, declaratively.
#
# Ships assets/sfx/gemPickup.wav — a symbolic-identity replacement for
# the SoundTable slot the game plays when Spyro collects a gem. No code
# at all: a mod can be pure sounds. The file is a synthesized two-note
# chime (original content, not disc-derived) so the override is
# unmissable on the first gem.
#
# A symbolic file replaces the ROLE in every level; to replace one
# specific recording instead, name the file by its content hash from
# `--dump-sfx-pack` (see docs: Sounds). Sound mods are presentation-only:
# the substitution happens below everything the game can observe, so the
# oracle stays byte-exact.

[mod]
id      = "sfx-single-sound"
name    = "SFX Single Sound"
version = "0.1.0"
api     = 1
