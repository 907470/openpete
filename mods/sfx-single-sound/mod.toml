# sfx-single-sound — one replacement sound effect, no code.
#
# Ships assets/sfx/gemPickup.wav, a symbolic-identity replacement for the
# sound-table slot the game plays when Spyro collects a gem. The file is a
# synthesised two-note chime (original content, not disc-derived).
#
# A symbolic file replaces the role in every level; to replace one
# specific recording, name the file by its content hash from
# --dump-sfx-pack (see the Sounds page).

[mod]
id      = "sfx-single-sound"
name    = "SFX Single Sound"
version = "0.1.0"
api     = 1
