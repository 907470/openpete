# sfx-single-sound: one replacement sound effect, no code.
#
# Ships assets/sfx/gemPickup.wav, a replacement for the sound-table slot
# the game plays when Spyro collects a gem. The file is a synthesised
# two-note chime, original content and not derived from a disc.
#
# The file is named by symbolic identity, so it replaces that role in
# every level. To replace one specific recording instead, name the file
# by its content hash from --dump-sfx-pack; the Sounds page describes
# both forms. A mod with no src/ never loads code, so an asset-only mod
# is safe to install from any source.

[mod]
id      = "sfx-single-sound"
name    = "SFX Single Sound"
version = "0.1.0"
api     = 1
