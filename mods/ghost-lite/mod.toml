# ghost-lite — PoC ladder rung 16 (notes/plans/openpete-modding-framework.md)
#
# The actor render service proof: a translucent second Spyro replayed
# through the native draw service from RECORDED poses — no guest-side
# g_Spyro swap, no game code runs for the ghost, zero guest-RAM writes
# (this mod ENABLED must pass the observer-neutrality oracle gate while
# capturing + drawing). Two ghosts:
#   - trail ghost (blue, translucent): the live run, replayed DELAY ticks
#     behind from an in-memory ring;
#   - prior-run ghost (gold, translucent): the previous session's
#     recording, persisted via the data-dir service and replayed in
#     capture lockstep (a race ghost).
# The pose is evaluated in a PRESENT hook at ctx->alpha with mod-side
# position lerp — the sub-tick smoothness + render-purity proof.

[mod]
id      = "ghost-lite"
name    = "Ghost Lite"
version = "0.1.0"
api     = 2
sim_neutral = true  # observer/presentation-only: excluded from the save modset tag

[test]
frames        = 8000
expect_oracle = "pass"
expect_log    = ["ghost-lite: recording", "ghost-lite: ghost armed"]
