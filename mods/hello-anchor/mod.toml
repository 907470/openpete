# hello-anchor — the smallest code mod: a named override that logs and
# calls base().
#
# Log-only, so it writes no guest RAM and gameplay stays byte-identical
# with it enabled.

[mod]
id      = "hello-anchor"
name    = "Hello Anchor"
version = "0.1.0"
api     = 1
state    = "none"     # counts calls; nothing guest-history-derived
runahead = "host-fx"  # the hook logs — engine-suppressible speculation
sim_mutative = false  # writes no guest RAM: outside the save modset tag
