# hello-anchor: the smallest code mod. A named override that logs, calls
# base(), and publishes a counter to the Mods panel.
#
# CameraUpdate runs once per gameplay tick, so the override is a cheap
# anchor for anything that wants a per-tick heartbeat. The body counts
# calls, logs the first one, and hands control on. It reads and writes no
# guest RAM, so gameplay stays byte-identical with the mod enabled; the
# three keys below declare that to the engine.
#
# uses: `api->override_name` - attaches the body to CameraUpdate by name, the tier that keeps working when the decompilation renames a function
# uses: `api->base` - runs the rest of the chain and then the original, which is what makes this a pre-hook rather than a replacement
# uses: `api->log` - one stderr line on the first call, tagged with the mod id
# uses: `api->ui_status` - publishes the running count into the mod's block of the Mods panel

[mod]
id      = "hello-anchor"
name    = "Hello Anchor"
version = "0.1.0"
game    = "spyro-1"
api     = 1
# state: what the engine must carry for this mod across a state load.
# "none" = the mod keeps no data derived from guest history; a counter
# that restarts from zero after a load is acceptable.
state    = "none"
# runahead: how the mod behaves while the engine speculates ahead of the
# displayed tick. "host-fx" = the hook has host-side effects (a log
# line) that the engine may suppress during speculation.
runahead = "host-fx"
# sim_mutative: whether the mod writes guest RAM. false keeps the mod
# out of the modset tag written to memory cards played with it.
sim_mutative = false
