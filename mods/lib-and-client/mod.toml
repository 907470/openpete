# lib-and-client - CI fixture: the client half of demo-lib.
#
# Declares a hard dependency on demo-lib and checks that demo-lib's entry
# runs first even when this mod is listed before it in enabled.txt, and
# that enabling it without demo-lib produces the missing-dependency error.
# Log-only.

[mod]
id      = "lib-and-client"
name    = "Lib And Client"
version = "0.1.0"
api     = 1
state    = "none"    # entry log only
runahead = "pure"      # no hooks
deps    = ["demo-lib"]
