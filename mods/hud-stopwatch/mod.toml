# hud-stopwatch — PoC ladder rung 15 (notes/plans/openpete-modding-framework.md)
#
# The native draw service proof: screen-space HUD text via the vk
# renderer with ZERO guest-RAM writes — this mod ENABLED must pass the
# observer-neutrality oracle gate WHILE drawing. Also the per-present
# hook proof: the elapsed time is evaluated at ctx->alpha in a present
# hook, so the hundredths spin smoothly at high --render-fps (the mod
# owns its sub-tick curve; the engine never interpolates mod visuals).
#
# Draws: a dark backdrop rect (tick context, persists per tick) and the
# "M:SS.hh" gameplay stopwatch (present context, one present each).
# Time base: sim ticks / 29.913 — a gameplay-time stopwatch.

[mod]
id      = "hud-stopwatch"
name    = "HUD Stopwatch"
version = "0.1.0"
api     = 1
sim_mutative = false  # writes no guest RAM: outside the save modset tag

[[binding]]
name    = "reset"
key     = "T"
purpose = "zero the stopwatch"

# Settings schema — the engine renders these rows in the Mods panel and
# writes committed edits back into config.toml; entry re-reads them
# through api->config_* after the queued reload. Overlay space: x spans
# 0..aspect from the left edge, y spans 0..1 from the top edge; sizes
# are window-height fractions.

# Settings schema — the engine renders these rows in the Mods panel and
# writes committed edits back into config.toml; entry re-reads them
# through api->config_* after the queued reload. Overlay space: x spans
# 0..aspect from the left edge, y spans 0..1 from the top edge; sizes
# are window-height fractions.
[[config]]
key = "layout.x"
type = "float"
default = 0.022
min = 0.0
max = 1.7
label = "X"
group = "Layout"
help = "Readout origin: x spans 0..aspect from the left edge"

[[config]]
key = "layout.y"
type = "float"
default = 0.058
min = 0.0
max = 1.0
label = "Y"
group = "Layout"
help = "Readout origin: y spans 0..1 from the top edge"

[[config]]
key = "layout.cap_height"
type = "float"
default = 0.026
min = 0.010
max = 0.100
label = "Cap height"
group = "Layout"
help = "Glyph height; the backdrop panel scales with it"
