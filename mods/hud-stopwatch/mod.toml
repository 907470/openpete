# hud-stopwatch — an "M:SS.hh" gameplay stopwatch drawn as HUD text.
#
# The elapsed time is published from a tick hook and evaluated at
# ctx->alpha in a present hook, so the hundredths advance smoothly at high
# --render-fps: the mod owns its sub-tick curve, the engine never
# interpolates mod visuals. Time base: sim ticks / 29.913. Draws through
# draw_text only, so it writes no guest RAM. A [[binding]] resets the
# watch.

[mod]
id      = "hud-stopwatch"
name    = "HUD Stopwatch"
version = "0.1.0"
api     = 1
sim_mutative = false  # writes no guest RAM: outside the save modset tag

[[binding]]
name    = "reset"
key     = "T"
purpose = "zero the stopwatch"

# Settings schema — the engine renders these rows in the Mods panel and
# writes committed edits back into config.toml; entry re-reads them
# through api->config_* after the queued reload. Overlay space: x spans
# 0..aspect from the left edge, y spans 0..1 from the top edge; sizes
# are window-height fractions.

# Settings schema — the engine renders these rows in the Mods panel and
# writes committed edits back into config.toml; entry re-reads them
# through api->config_* after the queued reload. Overlay space: x spans
# 0..aspect from the left edge, y spans 0..1 from the top edge; sizes
# are window-height fractions.
[[config]]
key = "layout.x"
type = "float"
default = 0.022
min = 0.0
max = 1.7
label = "X"
group = "Layout"
help = "Readout origin: x spans 0..aspect from the left edge"

[[config]]
key = "layout.y"
type = "float"
default = 0.058
min = 0.0
max = 1.0
label = "Y"
group = "Layout"
help = "Readout origin: y spans 0..1 from the top edge"

[[config]]
key = "layout.cap_height"
type = "float"
default = 0.026
min = 0.010
max = 0.100
label = "Cap height"
group = "Layout"
help = "Glyph height"
