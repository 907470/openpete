# hud-stopwatch: an "M:SS.hh" gameplay stopwatch drawn as HUD text.
#
# A tick hook counts sim ticks and a present hook evaluates the time at
# ctx->alpha, so the hundredths advance smoothly at a high --render-fps
# rather than stepping 29.913 times a second. That split is the pattern
# for any mod with a moving visual: the engine never interpolates mod
# visuals, so the mod owns its own sub-tick curve. Time base is sim ticks
# divided by 29.913; the mod draws through draw_text only and writes no
# guest RAM.
#
# uses: `api->override_name` - a CameraUpdate pre-hook, used as the per-tick clock source
# uses: `api->override_addr` - the Spyro 2 and 3 arms, which bind the camera update by address until the decomp names it
# uses: `api->base` - hands control back so the camera still updates
# uses: `api->register_present_hook` - runs once per present, where the sub-tick time is evaluated
# uses: `api->draw_text` - draws the clock in overlay space, in the game's HUD gold
# uses: `api->binding_down` - reads the reset key, which the player can rebind without touching the mod
# uses: `api->config_float` - reads the three layout rows the Mods panel renders
# uses: `api->ui_status` - shows running state and the reset count
# uses: `api->log` - one line when the watch starts ticking

[mod]
id      = "hud-stopwatch"
name    = "HUD Stopwatch"
version = "0.1.0"
game    = ["spyro-1", "spyro-2", "spyro-3"]
api     = 1
sim_mutative = false  # writes no guest RAM: outside the save modset tag

# A binding is a named key the mod polls with api->binding_down. The
# engine owns the key assignment, so the player can rebind it without
# touching the mod, and the purpose string is what the rebinding UI shows.
[[binding]]
name    = "reset"
key     = "T"
purpose = "zero the stopwatch"

# Settings schema. The engine renders these rows in the Mods panel and
# writes committed edits back into config.toml; a commit reloads the mod,
# and entry re-reads the values through api->config_*. Overlay space: x
# spans 0..aspect from the left edge, y spans 0..1 from the top edge;
# sizes are window-height fractions, so a layout holds at any resolution.
[[config]]
key = "layout.x"
type = "float"
default = 0.022
min = 0.0
max = 1.7
label = "X"
group = "Layout"
help = "Readout origin: x spans 0..aspect from the left edge"

[[config]]
key = "layout.y"
type = "float"
default = 0.058
min = 0.0
max = 1.0
label = "Y"
group = "Layout"
help = "Readout origin: y spans 0..1 from the top edge"

[[config]]
key = "layout.cap_height"
type = "float"
default = 0.026
min = 0.010
max = 0.100
label = "Cap height"
group = "Layout"
help = "Glyph height"
