# hud-stopwatch: an "M:SS.hh" gameplay stopwatch drawn as HUD text.
#
# A tick hook counts sim ticks; a present hook evaluates the time at
# ctx->alpha and draws it, so the hundredths advance smoothly at a high
# --render-fps. The engine never interpolates mod visuals; the mod owns
# its sub-tick curve. Time base: sim ticks / 29.913. The mod draws
# through draw_text only and writes no guest RAM. A [[binding]] resets
# the watch.

[mod]
id      = "hud-stopwatch"
name    = "HUD Stopwatch"
version = "0.1.0"
game    = "spyro-1"
api     = 1
sim_mutative = false  # writes no guest RAM: outside the save modset tag

# A binding is a named key the mod polls with api->binding_down. The
# engine owns the key assignment, so the player can rebind it without
# touching the mod, and the purpose string is what the rebinding UI shows.
[[binding]]
name    = "reset"
key     = "T"
purpose = "zero the stopwatch"

# Settings schema. The engine renders these rows in the Mods panel and
# writes committed edits back into config.toml; a commit reloads the mod,
# and entry re-reads the values through api->config_*. Overlay space: x
# spans 0..aspect from the left edge, y spans 0..1 from the top edge;
# sizes are window-height fractions, so a layout holds at any resolution.
[[config]]
key = "layout.x"
type = "float"
default = 0.022
min = 0.0
max = 1.7
label = "X"
group = "Layout"
help = "Readout origin: x spans 0..aspect from the left edge"

[[config]]
key = "layout.y"
type = "float"
default = 0.058
min = 0.0
max = 1.0
label = "Y"
group = "Layout"
help = "Readout origin: y spans 0..1 from the top edge"

[[config]]
key = "layout.cap_height"
type = "float"
default = 0.026
min = 0.010
max = 0.100
label = "Cap height"
group = "Layout"
help = "Glyph height"
