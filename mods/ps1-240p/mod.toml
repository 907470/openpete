# ps1-240p — quantize the rendered scene to the PSX 512x240 raster.
#
# Image-space half of the "PS1 retro look": the engine renders high-res
# as usual, then this postfx resamples each output pixel at its virtual
# PSX-pixel cell centre. Pairs with --vertex-precision integer (the
# vertex wobble): the T-junction cracks the snap opens — up to ~1
# VIRTUAL pixel, i.e. many device pixels at high res — collapse back to
# the single-pixel sparkles real hardware produced, because the sample
# grid is the same 512x240 raster the snap quantizes to (op_scene_rect/
# op_scene_grid keep the two aligned under any aspect/window layout).
# Stack crt-filter after it for the full period look. GPU-only:
# sim-neutral by construction.

[mod]
id      = "ps1-240p"
name    = "PS1 240p Quantize"
version = "0.1.0"
api     = 2
sim_neutral = true  # GPU-only presentation: excluded from the save modset tag

[test]
frames        = 4000
gameplay_neutral = true
