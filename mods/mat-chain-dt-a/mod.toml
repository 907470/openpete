# mat-chain-dt-a - material composition fixture: a tint toward red on the player, the flame and moby shadows (shadow ident 0, decal contract), pinned at api 13 (composable).
# Never enable it to play.

[mod]
id      = "mat-chain-dt-a"
name    = "Material Fixture: Draw-time Chain A"
version = "0.1.0"
game    = ["spyro-1", "spyro-2", "spyro-3"]
api     = 13
state    = "none"
runahead = "pure"
sim_mutative = false

[[material]]
frag    = "shaders/tint.frag"
channel = "player"
params  = [1.0, 0.0, 0.0, 0.5]

[[material]]
frag    = "shaders/tint.frag"
channel = "flame"
params  = [1.0, 0.0, 0.0, 0.5]

[[material]]
frag    = "shaders/tint_decal.frag"
channel = "shadow"
ident   = 0
params  = [1.0, 0.0, 0.0, 0.5]
