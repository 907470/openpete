# sfx-neutral-probe — proves the SFX overlay service is sim-neutral by
# construction (notes/plans/openpete-mod-sfx-service.md, oracle-
# validation item).
#
# The probe replaces the spyro-charge sample (played constantly by the
# attract demos, so the full path actually FIRES during the golden;
# gem_pickup never would — the demos collect no gems) with a code-synthesized
# silent ADPCM body and drives a per-play pitch hook — exercising
# registration, addr->name resolution, lazy SPU-tail staging, host-copy
# substitution at key-on, and the per-voice pitch persistence across
# Spyro's SpuUpdate refresh. The [test] block replays the full 20k-tick
# golden with it enabled: verdict PASS = the entire path perturbed no
# gameplay-state byte vs real hardware.

[mod]
id      = "sfx-neutral-probe"
name    = "SFX Neutrality Probe"
version = "0.1.0"
api     = 3

[test]
frames        = 20000
expect_oracle = "pass"
expect_log    = ["replaced by sfx-neutral-probe", "staged at SPU", "sfx-probe: substitution live"]
