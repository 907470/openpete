# scene-sepia - a SCENE-point post-process pass.
#
# Sepia-tones the 3D scene, then draws a HUD marker from a present hook.
# The marker stays full-colour because the SCENE point runs under the HUD;
# a COMPOSITE pass would tint the HUD too.

[mod]
id = "scene-sepia"
name = "Scene Sepia"
version = "0.1.0"
game    = ["spyro-1", "spyro-2", "spyro-3"]
api     = 1
state    = "none"      # GPU-only postfx + present hook
runahead = "pure"      # no tick hooks
sim_mutative = false

[[config]]
key = "sepia.strength"
type = "float"
default = 1.0
min = 0.0
max = 1.0
label = "Sepia strength"
group = "Sepia"
help = "Blend between the untouched scene (0) and the full sepia tone (1)"

[[config]]
key = "sepia.marker"
type = "bool"
default = true
label = "Under-HUD proof marker"
group = "Sepia"
help = "Cyan HUD text drawn after the SCENE pass; stays cyan, which is what distinguishes SCENE from COMPOSITE"
