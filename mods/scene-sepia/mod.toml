# scene-sepia — SCENE injection-point gallery rung (mod-shaders S5).
# A SCENE-point postfx sepia-tones the 3D scene, then the mod draws a
# HUD marker AFTER — which stays crisp full-colour, proving the SCENE
# point runs UNDER the HUD (the property that distinguishes SCENE from
# COMPOSITE, which would tint the HUD too). GPU-only: sim-neutral.

[mod]
id = "scene-sepia"
name = "Scene Sepia"
version = "0.1.0"
api     = 5
sim_neutral = true

[[config]]
key = "sepia.strength"
type = "float"
default = 1.0
min = 0.0
max = 1.0
label = "Sepia strength"
group = "Sepia"
help = "Blend between the untouched scene (0) and the full sepia tone (1)"

[[config]]
key = "sepia.marker"
type = "bool"
default = true
label = "Under-HUD proof marker"
group = "Sepia"
help = "Yellow square drawn after the SCENE pass; stays full-colour, which is what distinguishes SCENE from COMPOSITE"
