# natural-gems — double-gems written against the typed wrappers.
#
# Same behaviour as double-gems (every gem pickup counts double) using the
# generated natural-signature surface: OP_OVERRIDE_IMPL_CollectItem gives
# a typed Moby* parameter, op_base_CollectItem falls through with natural
# arguments, and op_call_Sin shows a typed call into an unrelated game
# function.

[mod]
id      = "natural-gems"
name    = "Natural Gems"
version = "0.1.0"
api     = 1
state    = "none"      # counters only
runahead = "host-fx"   # logs on pickup — suppressible
