# sfx-replace-probe - CI fixture: sfx_replace leaves the sound's end tick
# stock.
#
# Registers, from code, a replacement for one sound-table slot: a
# synthesised two-second buzz, longer than any stock one-shot it can land
# on. The game polls each voice through SpuGetKeyStatus and frees the
# sound slot on the tick the stock sample ends; a replacement that moved
# that tick would diverge gameplay state. check_mods.sh runs the attract
# demo with and without this mod under OPENPETE_SFX_END_LOG=1 and requires
# every key-on and end transition to land on the same VBL.
#
# config.toml: probe.sound = the slot name to replace (default pickupDing
# on Spyro 1, a one-shot the attract demo keys about every 500 VBLs;
# flame on Spyro 2 and 3, keyed 15 times on each attract demo).

[mod]
id      = "sfx-replace-probe"
name    = "SFX Replace Probe"
version = "0.1.0"
game    = ["spyro-1", "spyro-2", "spyro-3"]
api     = 1
state    = "none"
runahead = "pure"
sim_mutative = false  # audible-only substitution: outside the save modset tag
