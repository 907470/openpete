# sfx-replace-probe — the sim-neutrality fixture for the sfx_replace verb.
#
# Registers, from code, a replacement for one SoundTable slot: a
# synthesized two-second buzz, deliberately far LONGER than any stock
# one-shot it can land on. The guest polls each voice through
# SpuGetKeyStatus and frees the sound slot (writing the sound-ref byte)
# on the tick the STOCK sample ends; a replacement that moved that tick
# would be a gameplay-state divergence. check_mods.sh runs the attract
# demo with and without this mod under OPENPETE_SFX_END_LOG=1 and
# requires every key-on/end transition to land on the same VBL.
#
# config.toml: probe.sound = the slot name to replace (default
# pickupDing — a one-shot the attract demo keys about every 500 VBLs;
# the charge sound loops, so its end is the game's key-off, not the
# sample's, and it cannot exhibit the defect).

[mod]
id      = "sfx-replace-probe"
name    = "SFX Replace Probe"
version = "0.1.0"
api     = 1
state    = "none"
runahead = "pure"
sim_mutative = false  # audible-only substitution: outside the save modset tag
