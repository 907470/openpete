# spyro3-chests — replace Spyro 1's two chest types with Spyro 3's
# containers: models + textures, destruction fragment models, break
# SFX, and COLLISION primitives (the first mod to port collision).
#
#   S1 wooden chest (194) <- S3 wicker basket (200)
#   S1 metal  chest (195) <- S3 vase/jar     (201)
#   S1 wooden fragments 255/256/257 <- S3 basket fragments (306)
#   S1 metal  fragments 309/310/311 <- S3 vase fragments (307/308)
#
# Pure mod-framework stress test: no core/engine changes. Assets are
# NOT shipped — run tools/extract_s3_chests.py + tools/convert_chests.py
# against your own Year of the Dragon disc to generate
# assets/s3/chests_s1pack.bin (gitignored), same legal posture as
# spyro3-gems.
#
# raw tier: pokes fixed PSX vaddrs (low model park, g_Models rows,
# VRAM texture upload via the game's own LoadImage) pinned to the
# SCUS-94228 binary.

[mod]
id      = "spyro3-chests"
name    = "Spyro 3 Chests"
version = "0.1.0"
api     = 1
tier    = "raw"

# Gameplay-divergent BY DESIGN: the ported collision primitives change
# where charge/flame connect, so the oracle must not be asserted PASS.
# Without the generated asset pack the mod is a pure observer
# (calibration mode) and only the log line below is expected.
[test]
frames        = 2500
expect_oracle = "skip"
args          = ["--skip-to-level", "stone_hill"]
expect_log    = ["override registered at 0x800133E0"]
