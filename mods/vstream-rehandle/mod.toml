# vstream-rehandle — CI fixture: every animated model's vertex streams
# routed through stream handles.
#
# After each model-install pass, walks g_Models and rewrites the 21-bit
# stream field of every animation frame word in the level to a stream
# handle. Mode 1 binds each handle to the stream where it already is (the
# data does not move); mode 2 copies each stream into the arena and binds
# the handle to the copy. Either way the rendered frame must match stock
# exactly. Frame words are gameplay-readable, so the mod is mutative and
# the oracle is expected to diverge.

[mod]
id      = "vstream-rehandle"
name    = "Vertex Streams via Handles"
version = "0.1.0"
game    = "spyro-1"
api     = 9
state    = "rebuildable"
runahead = "pure"
sim_mutative = true

[[config]]
key = "mode"
type = "int"
default = 1
min = 1
max = 2
label = "Mode"
help = "1 = handles to the streams in place; 2 = streams copied into the arena."
