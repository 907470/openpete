# arena-canary - CI fixture: proves guest_alloc memory is timeline state.
#
# Holds one mutable arena block and mirrors the game's tick counter into
# it from a tick hook; with `pools` on it also keeps copies of the mirror
# in the lower DMA-reachable segment and the general pool. Savestate
# load, rewind, runahead rollback and the --state-stress-rewind harness
# move guest RAM back in time; if the arena did not move with it the
# mirror would run ahead of the guest counter and the mod logs DESYNC, and
# a copy that moved apart from the mirror logs DESYNC naming its range. The allocation size is config-driven so the reload
# harness can change the allocation pattern and check that the ledger
# refuses a savestate written under the old layout. `bulk_kib` adds a
# mostly static general-pool block (one page rewritten per tick) that
# sizes the arena for rewind and runahead cost measurements.

[mod]
id      = "arena-canary"
name    = "Arena Timeline Canary"
version = "0.1.0"
game    = ["spyro-1", "spyro-2", "spyro-3"]
api     = 13
state    = "none"      # no host residue: everything lives in the arena
runahead = "pure"      # tick hook reads guest RAM and writes the arena only
sim_mutative = false  # writes no canonical guest RAM

[[config]]
key = "slots"
type = "int"
default = 4
min = 1
max = 64
label = "Mirror slots"
help = "Size of the arena block in 16-byte slots (changes the allocation pattern)."

[[config]]
key = "pools"
type = "bool"
default = true
label = "Blocks in every arena range"
help = "Also hold a block in the lower DMA-reachable segment and the general pool, each checked against the mirror every tick."

[[config]]
key = "bulk_kib"
type = "int"
default = 0
min = 0
max = 491520
label = "Bulk block (KiB)"
help = "A general-pool block of this many KiB, filled once and then rewritten one 4 KiB page per tick; 0 allocates none."
