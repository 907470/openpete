# arena-canary - CI fixture: proves guest_alloc memory is timeline state.
#
# Holds one mutable arena block and mirrors the game's tick counter into
# it from a tick hook. Savestate load, rewind, runahead rollback and the
# --state-stress-rewind harness move guest RAM back in time; if the arena
# did not move with it the mirror would run ahead of the guest counter and
# the mod logs DESYNC. The allocation size is config-driven so the reload
# harness can change the allocation pattern and check that the ledger
# refuses a savestate written under the old layout.

[mod]
id      = "arena-canary"
name    = "Arena Timeline Canary"
version = "0.1.0"
game    = "spyro-1"
api     = 8
state    = "none"      # no host residue: everything lives in the arena
runahead = "pure"      # tick hook reads guest RAM and writes the arena only
sim_mutative = false  # writes no canonical guest RAM

[[config]]
key = "slots"
type = "int"
default = 4
min = 1
max = 64
label = "Mirror slots"
help = "Size of the arena block in 16-byte slots (changes the allocation pattern)."
