# recolored-artisans — a level-data replacement produced by a generator.
#
# Mods may not ship derived game data, so this mod ships a generator: run
# ./generate.sh <your-disc.cue> once and it derives a recoloured Artisans
# data blob (magenta cyclorama background) from your disc into
# assets/wad/level10.data.bin. Ungenerated, the mod is inert.

[mod]
id      = "recolored-artisans"
name    = "Recolored Artisans"
version = "0.1.0"
api     = 1
