# crash-dummy — CI fixture: crashes the game on purpose.
#
# Dereferences NULL on the 100th CameraUpdate call so the crash report can
# be checked for the line naming this mod ("MOD ATTRIBUTION: ... mod
# 'crash-dummy'"). Never enable it to play.

[mod]
id      = "crash-dummy"
name    = "Crash Dummy"
version = "0.1.0"
game    = "spyro-1"
api     = 1
state    = "none"      # call counter only
runahead = "host-fx"   # binding read + deliberate fault

[[binding]]
name    = "crash"
key     = "F10"
purpose = "fault on the next CameraUpdate (attribution test)"

[[config]]
key = "crash.auto_arm"
type = "bool"
default = true
label = "Auto-crash on call 100"
group = "Crash"
help = "Fault automatically on the 100th CameraUpdate; off = crash only via the binding"
