# demo-lib — CI fixture: the library half of lib-and-client.
#
# Clients declare deps = ["demo-lib"]; the dependency sort guarantees this
# entry point has run before theirs. Log-only.

[mod]
id      = "demo-lib"
name    = "Demo Library"
version = "0.1.0"
api     = 1
state    = "none"      # entry log only
runahead = "pure"      # no hooks
