# demo-lib — the library half of PoC ladder rung 5 (lib-and-client).
#
# A dependency whose entry must run before any dependent's. Clients
# declare `deps = ["demo-lib"]`; the topo-sort guarantees this entry has
# already run when theirs does. Log-only: sim-neutral.

[mod]
id      = "demo-lib"
name    = "Demo Library"
version = "0.1.0"
api     = 1
state    = "none"      # entry log only
runahead = "pure"      # no hooks
