# imgui-panel: the full ImGui C API (openpete_imgui.h) driving a real panel.
#
# A tick hook (Spyro 1 GamestateUpdate; Spyro 2 and 3 the per-tick camera
# update, by address) counts the level's live mobys into a host-side ring and
# copies the ten nearest to Spyro. The UI section then draws that copy: a
# plot over the ring, a table of the ten, a floating window with a colour
# editor, and a foreground draw-list marker. Every guest read happens in
# the tick hook and the section reads the host copy only, which is the
# rule for a body running on the compose thread. The section is an always
# section, so the stats window and the marker draw every present while the
# detail window waits for the overlay.
#
# Two Containment toggles ship off. Each drives one of the engine's
# containment paths for tests/harness/check_mod_imgui.sh: one omits an
# ImGui_End so the error bracket has something to recover, the other
# calls ImGui_Text from a present hook so the guard has something to drop.
#
# uses: `openpete_imgui.h` - the whole ImGui C API through OPENPETE_MOD_IMGUI(), for the plot, table, colour editor and draw list the widget vtable cannot express
# uses: `OPENPETE_MOD_UI_SECTION_FLAGS` - registers the body as an always section, running on every present rather than only inside the Mods panel
# uses: `ui->overlay_open` - draws the interactive half only while the overlay is up, since an always window takes no input when it is closed
# uses: `ui->text`, `ui->text_disabled` - the vtable and the ImGui calls mix freely in one body
# uses: `api->override_name` - a GamestateUpdate hook, the per-tick sampler on Spyro 1
# uses: `api->override_addr` - the Spyro 2 and 3 arms, which bind the per-tick camera update by address until the decomp names a tick function
# uses: `api->base` - hands control back after sampling
# uses: `api->player_pose` - Spyro's position for the nearest-ten distances, through the game's own player reader
# uses: `api->register_present_hook` - registered only by the containment toggle, to make a call from the wrong context
# uses: `api->config_bool` - the two containment toggles
# uses: `api->ui_status` - explains in the Mods panel what the toggles do
# uses: `api->log` - one line when sampling starts

[mod]
id      = "imgui-panel"
name    = "ImGui Panel"
version = "0.1.0"
game    = ["spyro-1", "spyro-2", "spyro-3"]
api     = 13
state   = "none"       # host-side ring only; nothing to save
runahead = "pure"      # reads guest RAM, writes none
sim_mutative = false

# Deliberate misuse, for the containment harness. Leave both off unless
# you want to watch the engine catch a broken body.
[[config]]
key = "break_end"
type = "bool"
default = false
label = "Omit an ImGui_End"
group = "Containment"
help = "Leave the floating window open so the error bracket recovers it; three presents of that refuses the section"

[[config]]
key = "hook_call"
type = "bool"
default = false
label = "Call ImGui_Text from a present hook"
group = "Containment"
help = "Register a present hook that calls into ImGui from outside the UI section, where the guard drops it"
