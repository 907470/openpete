# modtest.toml: this repo's CI declaration for tools/modtest.py. Not part
# of the manifest format and not shipped with the mod.
[test]
frames        = 4000
expect_oracle = "pass"
expect_log    = ["loaded declarative-example",
                 "asset root registered:",
                 "material selector armed (channel 2 ident -1 class -1 flags 0x4)",
                 "[texpack] + mod declarative-example: 1 entry",
                 "(symbolic=0 hash="]

# Every game arms the material rows (the last row's selector line above)
# and registers the title logo's content-identity replacement; "symbolic=0"
# proves no symbolic name served a draw. Spyro 1 also has the music
# override.
[test.spyro-1]
expect_log    = ["declarative-example/assets/spyro-1/music/title_theme.wav",
                 "declarative-example: 5 declarative material row(s)"]

[test.spyro-2]
expect_log    = ["declarative-example/assets/spyro-2"]

[test.spyro-3]
expect_log    = ["declarative-example/assets/spyro-3"]
