# declarative-example: every feature a mod can use with no code, in one
# mod. No src/, no entry point, nothing compiled on the host: the mod is
# this manifest, its asset files and one fragment shader.
#
# Each asset root is matched by filename, so replacing a texture, a track
# or a sound is a matter of naming a file correctly. The assets sit in one
# subtree per game, assets/<game>/, each named in that game's own terms;
# Spyro 2 and 3 have no music override, so their subtrees carry no track.
# The [[material]] rows then reshade the engine's own draws through
# selector keys alone, on every game. Custom levels are the one declarative
# feature not shown here; the Custom levels page covers them. [[binding]]
# and [[config]] rows are read by a mod's own code, so they belong to a code
# mod, and hud-stopwatch shows both.
#
# uses: `[[material]]` rows - five selectors, each pairing one fragment shader with a different channel, so the same shader shades a different subset per row
# uses: `assets/<game>/` - one asset subtree per game, chosen by the running game
# uses: `assets/<game>/textures/` - one replacement per game, the title logo named by its content identity, the form the texture dump writes
# uses: `assets/spyro-1/music/` - a track replacement plus a manifest.txt mapping index to file
# uses: `assets/<game>/sfx/` - a symbolic slot replacement (gemPickup on Spyro 1, gemCollect on Spyro 2 and 3), the form that follows whatever the current level maps to that slot
# uses: `shaders/*.frag` - the material shader the rows share, written against openpete_psx_material.glsl

[mod]
id      = "declarative-example"
name    = "Declarative Example"
version = "0.1.0"
game    = ["spyro-1", "spyro-2", "spyro-3"]
api     = 5            # [[material]] rows; a mod with assets only could omit the pin
state    = "none"      # nothing derived from guest history
runahead = "pure"      # no tick hooks

# Spyro, tinted warm. The player has his own channel and is not a moby.
[[material]]
frag    = "shaders/tint.frag"
channel = "player"
params  = [1.0, 0.55, 0.15, 0.45]   # rgb + strength, the shader's std140 block

# The flame ribbon only. ident is the channel-local identity: for flame,
# 0 is the additive ribbon and 1 is the opaque base caps. The material
# inherits the ribbon's additive blend, so the tint reads as added light.
[[material]]
frag    = "shaders/tint.frag"
channel = "flame"
ident   = 0
params  = [0.30, 0.55, 1.00, 0.60]

# Untextured terrain faces only, both LOD tiers. textured keys on whether
# the face carries a texture; omitting it selects both.
[[material]]
frag    = "shaders/tint.frag"
channel  = "terrain"
textured = false
params   = [0.20, 0.90, 0.40, 0.35]

# Animated environment faces only: water and lava surfaces the game
# scrolls or cycles. env_anim = true narrows to those.
[[material]]
frag     = "shaders/tint.frag"
channel  = "terrain"
env_anim = true
params   = [0.60, 0.20, 1.00, 0.50]

# Shipped switched off. A row with enabled = false is registered and
# listed in the Mods panel, and the player can turn it on; the row
# isolates the LP terrain tier so it can be seen on its own.
[[material]]
frag    = "shaders/tint.frag"
channel = "terrain"
tier    = "lp"
enabled = false
params  = [1.0, 0.2, 0.6, 0.5]
