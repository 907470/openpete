# s3-scan-markers - Spyro 3's anti-piracy scanner mobys, coloured by scan state.
#
# Every moby whose class update is one of the resident level's scanner
# functions (looked up in the game's own MobyUpdate table) draws solid
# blue. It turns red while its scan advances, purple while a started scan
# stands still (the moby out of update range, or the scanner's own gate
# closed), and back to blue when the scan ends (green with mark_done).
#
# Presentation only: the refine callback reads guest RAM and writes none,
# so a bk2 recorded with the mod on replays the same with it off.
#
# uses: `api->material_register_refine` - per-moby colour from scan state
# uses: `api->config_bool` - mark_paused, mark_done
# uses: `api->log` - one line per state change, with running totals

[mod]
id      = "s3-scan-markers"
name    = "S3 Scan Markers"
version = "0.1.0"
game    = "spyro-3"
api     = 13
state    = "rebuildable" # per-moby cursor history, re-read from guest RAM within 4 drawn ticks
runahead = "host-fx"     # log lines on state changes
sim_mutative = false

[[config]]
key = "mark_paused"
type = "bool"
default = true
label = "Purple while paused"
help = "A scan that started and has not advanced for 4 drawn ticks draws purple; off draws it blue, so only an advancing scan is red."

[[config]]
key = "mark_done"
type = "bool"
default = false
label = "Green when finished"
help = "A finished scan draws green; off draws it blue, as before it started."
