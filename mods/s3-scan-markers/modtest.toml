# modtest.toml - this repo's CI declaration for tools/modtest.py.
# Engine-repo concern, not part of the mod manifest format.
# The mod declares spyro-3 only: under another --game it is filtered at
# discovery and the run checks a clean exit alone. Engagement (refine
# claims, state changes) needs presents, which plain headless never makes.
[test]
frames = 4000
gameplay_neutral = true

[test.spyro-3]
expect_log = ["loaded s3-scan-markers v0.1.0", "s3-scan-markers: material selector armed"]
