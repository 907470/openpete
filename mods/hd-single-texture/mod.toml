# hd-single-texture — PoC ladder rung 7: the asset overlay's texture
# namespace (reuses the landed HD-texture-pack identity model).
#
# Ships assets/textures/replacements/title_ui.png — a symbolic-identity
# replacement for the 512x256 title-screen UI atlas (the identity the
# game layer annotates as "title_ui"). No code at all: a mod can be pure
# assets. The magenta/cyan checker makes the override unmissable on the
# title screen (native renderer; live window / --record).
#
# Asset mods are display-only: the oracle must stay byte-exact.

[mod]
id      = "hd-single-texture"
name    = "HD Single Texture"
version = "0.1.0"
api     = 2
sim_neutral = true  # observer/presentation-only: excluded from the save modset tag

