# modtest.toml - this repo's CI declaration for tools/modtest.py.
# Engine-repo concern, not part of the mod manifest format.
# The mod declares spyro-3 only: under another --game it is filtered at
# discovery and the run checks a clean exit alone. The colours need presents,
# which plain headless never makes; the state lines come from the tick hook
# and appear headless. With its defaults the mod writes no guest RAM.
[test]
frames = 4000
gameplay_neutral = true

[test.spyro-3]
expect_log = ["loaded s3-antipiracy-sentinel v0.2.0", "s3-antipiracy-sentinel: material selector armed", "BOOT WALK: unseen -> PASS"]
