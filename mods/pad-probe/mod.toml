# pad-probe: what api->pad_read reports for every pad slot, checked
# against the synthetic pad stream the engine stages under
# OPENPETE_SYNTH_PADS.
#
# A CameraUpdate pre-hook reads slots 0-3 once per tick and recomputes,
# from the record's own `vbl`, the bytes the synthetic stream defines for
# that VBL and slot. The `expect` row names the slots the run is supposed
# to carry: a named slot that reads absent is counted as a check and as a
# mismatch, an unnamed slot is read and reported but never checked. The
# formula lives in the mod as well as in the engine because a mod links no
# engine symbol; the two copies disagreeing is a failure, which is the
# point of the check.
#
# Display-only: no guest RAM is written.
#
# uses: `api->pad_read` - slots 0-3 from the input-log record staged for the running tick
# uses: `api->pad_rumble` - a distinctive actuator byte pair on one slot, and the slot-0 refusal
# uses: `api->override_name` - a CameraUpdate pre-hook, the per-tick sampler
# uses: `api->override_addr` - the Spyro 2 and 3 arms, which bind the camera update by address until the decomp names it
# uses: `api->base` - hands control back after sampling
# uses: `api->config_str` - the expected slot set
# uses: `api->config_bool` - the rumble-drive row
# uses: `api->config_int` - the report interval and the rumble slot
# uses: `api->ui_status` - the running per-slot tallies in the Mods panel
# uses: `api->log` - the per-slot report lines the gate script parses

[mod]
id      = "pad-probe"
name    = "Pad Probe"
version = "0.1.0"
game    = ["spyro-1", "spyro-2", "spyro-3"]
api     = 12
state   = "none"       # host-side tallies only
runahead = "pure"      # reads the input-log record, writes no guest RAM
sim_mutative = false

[[config]]
key = "expect"
type = "string"
default = ""
label = "Expected slots"
group = "Probe"
help = "Comma-separated slots that must be present and carry the synthetic stream, e.g. 1,2,3"

[[config]]
key = "report_every"
type = "int"
default = 250
label = "Report interval (ticks)"
group = "Probe"
help = "Ticks between per-slot report lines; the last line of a run carries its final tallies"

[[config]]
key = "rumble"
type = "bool"
default = false
label = "Drive slot rumble"
group = "Probe"
help = "Drive a distinctive actuator byte pair on rumble_slot every tick, and probe slot 0 once"

[[config]]
key = "rumble_slot"
type = "int"
default = 1
label = "Rumble slot"
group = "Probe"
help = "The pad slot the rumble drive targets, 1..3"
