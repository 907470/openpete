# channel-gallery: one material selector per render channel, toggled live.
#
# Every row registers the same highlight shader with a different selector,
# so ticking a row shows exactly what that selector claims. It answers
# "can I shade only X?" for each channel and key, and shows which draw
# paths are not separately addressable. Materials are display-only: they
# reshade what the renderer already drew and cannot move, reorder or
# re-composite anything.
#
# uses: `api->shader_register` - compiles the one highlight shader every row shares
# uses: `api->material_register` - registers a row's selector against that shader
# uses: `api->material_register_refine` - the rows that need a per-instance decision, where a callback supplies the block or declines the match
# uses: `api->material_set_selector` - re-keys a live row when the class combo changes, instead of tearing the material down
# uses: `api->material_set_params` - pushes the highlight strength slider into the shared block
# uses: `api->material_enable` - a row's checkbox, since a material is registered disabled
# uses: `api->moby_classes` - lists the classes the current level actually loaded, so the combo offers only rows that can light
# uses: `api->guest` - reads the matched moby inside a refine callback to decide the instance's block
# uses: `api->register_present_hook` - counts what lit this present for the row tally
# uses: `api->config_float`, `api->config_int`, `api->config_str` - the rows the harness drives from config.toml
# uses: `openpete_mod_ui.h` widget vtable - checkbox, combo, sliders, tooltips and separators build the panel with no ImGui version in the mod's build

[mod]
id      = "channel-gallery"
name    = "Channel Gallery"
version = "0.1.0"
game    = "spyro-1"
api     = 6            # material_set_selector (live class picker)
state    = "none"      # GPU-only; nothing to carry across a state load
runahead = "pure"      # no tick hooks
sim_mutative = false

# Only load-time settings are declared here. A [[config]] row is rendered
# by the Mods panel and committed with Apply, which writes the file and
# reloads the mod. That is the wrong shape for a value swept while
# watching the picture, and declaring a row beside a live widget for the
# same value gives the panel two controls that disagree. So
# gallery.strength, gallery.class and gallery.refine_state are live
# widgets in the mod's own UI section instead.
#
# All three are still read from config.toml at load, which is how
# headless runs drive the gallery. Config keys are looked up by name, not
# through this schema: gallery.strength = 0.65, gallery.class = <moby
# class, -1 = any>, gallery.refine_state = <m_State, -1 = any>.

[[config]]
key = "gallery.rows"
type = "string"
default = ""
label = "Rows lit at load"
group = "Gallery"
help = "Comma-separated row numbers (0-based, in overlay order), or \"all\". Lets the gallery be driven without the dev overlay. Empty = every row starts off."

