# channel-gallery — a material selector per render channel, toggled live.
#
# Every row registers the SAME highlight shader with a DIFFERENT selector, so
# what you see when you tick a row is exactly what that selector claims. It is
# the quickest way to answer "can I shade only X?" for some X, and the quickest
# way to find out that X is not separately addressable.
#
# Display-only: materials reshade what the renderer already drew and cannot
# move, reorder or re-composite anything, so the simulation is untouched.
#
# KEEP THIS CURRENT. The rows are claims about the engine: one that lights
# says "selectable", one that stays dark says "not yet". Anything that
# changes what is selectable or routable updates this mod in the same
# change — a new channel or key gets a row, a newly-reachable draw path
# gets its row re-verified. Rows that cannot light yet STAY, labelled as
# known gaps; deleting them to look complete throws away the information
# that makes the gallery worth having.

[mod]
id      = "channel-gallery"
name    = "Channel Gallery"
version = "0.1.0"
api     = 4            # pillar 10 materials + material_register_refine
state    = "none"      # GPU-only; nothing to save
runahead = "pure"      # no tick hooks
sim_neutral = true

[[config]]
key = "gallery.strength"
type = "float"
default = 0.65
min = 0.0
max = 1.0
label = "Highlight strength"
group = "Gallery"
help = "0 leaves the stock look untouched, 1 replaces it with the flat highlight colour. The overlay slider changes it live."

[[config]]
key = "gallery.rows"
type = "string"
default = ""
label = "Rows lit at load"
group = "Gallery"
help = "Comma-separated row numbers (0-based, in overlay order), or \"all\". Lets the gallery be driven without the dev overlay. Empty = every row starts off."

[[config]]
key = "gallery.class"
type = "int"
default = 0
min = -1
max = 767
label = "Moby class"
group = "Gallery"
help = "The class both moby-keyed rows select. -1 matches every class. Set it here to drive the gallery without the dev overlay."

[[config]]
key = "gallery.refine_state"
type = "int"
default = -1
min = -1
max = 255
label = "Refine row: moby state"
group = "Gallery"
help = "The m_State the refine row's callback accepts. -1 claims every instance of the selected class; any other value makes the callback decline instances whose state differs. This is the predicate a selector alone cannot express."
