# Freecam-spot regression corpus for the terrain LP fill-tag mechanism
# (games/spyro-1/renderer/terrain.c tsc_tag_gapfill: the frozen,
# measurement-derived fill-face table in terrain_fill_tags.h — regenerate
# with scripts/gen-fill-tags.py from tests/freecam/fill-tags.verdicts).
#
# Each case boots headless (software Vulkan — deterministic), jumps the
# freecam to a recorded pose, screenshots at `frame`, and asserts metric
# expectations — never golden images, so unrelated renderer changes don't
# break it.  Check kinds (A/B knob = `ab_env`, default OPENPETE_TERRAIN_GAPFILL;
# the ON and OFF legs set it to `ab_on` / `ab_off`, default "1" / "0"):
#   ab-identical  ON vs OFF must differ by <= max_px (in bbox if set)
#                 -> encodes "this feature must NOT paint here"
#   ab-active     ON vs OFF must differ by >= min_px (in bbox if set)
#                 -> guards against the feature silently dying
#   bg-max        with the feature ON, pixels matching the background colour
#                 (sampled at `probe`, default [2,2]) inside bbox <= max_px
#                 -> encodes "the hole here must stay filled"
#
# WHAT THIS FILE DOES NOT COVER ANY MORE: the fill set is a static generated
# list, so there is no threshold left that could admit a face nobody reviewed.
# The dozen gapfill ab-identical "must not paint here" spots that guarded the
# v1-v12 classifier against exactly that are gone.  A wrongly-added ROW can
# still punch LP through HP — that is now the presentation golden's job, and it
# does it better: the golden named the two artisans s7 wedges by tile, which no
# threshold spot had caught.  Add spots here for fill that must HAPPEN; adjudicate
# fill that must not against the og reference.
#
# To add a spot: fly there windowed (F key freecam), read the pose off the
# `freecam: pos=(...) yaw=... pitch=...` log line, add a case, run
# tests/harness/check_gapfill_corpus.sh once to read the measured values, then
# set thresholds with margin.

# --- The original artisans repro: sparse-HP hole at a detached pose. ---
# Yaw 283 = historic hole (the yaw-284 bisection pair); the wedge between
# the LP band and the HP shore must stay filled.
[[case]]
name  = "artisans-yaw283-hole-filled"
level = "artisans"
pose  = "90094,104721,11484,283,227"
mode  = "terrain"
  [[case.check]]
  kind   = "ab-active"
  min_px = 20000
  [[case.check]]
  kind   = "bg-max"
  bbox   = [330, 200, 620, 340]
  max_px = 200

# Yaw 284: the other side of the historic 1-unit pop — same hole region
# must be filled (fill verdict is pose-stable).
[[case]]
name  = "artisans-yaw284-stable"
level = "artisans"
pose  = "90094,104721,11484,284,227"
mode  = "terrain"
  [[case.check]]
  kind   = "bg-max"
  bbox   = [330, 200, 620, 340]
  max_px = 200

# From-above water pose: the originally-reported gap (green cyclorama
# bands across the water).  Fill must stay active here.
[[case]]
name  = "artisans-water-bands-filled"
level = "artisans"
pose  = "90094,104721,11484,260,227"
mode  = "full"
  [[case.check]]
  kind   = "ab-active"
  min_px = 30000

# gnorc_cove water plane (z=1088 LP grid over sparse HP): the fills that
# shrink the water wedge must stay active.  (The residual
# small notch is a DIFFERENT, pre-existing fog-boundary class — see the
# investigation doc.)
[[case]]
name  = "gnorc-water-fills-active"
level = "gnorc_cove"
pose  = "36863,117108,30800,1448,343"
mode  = "full"
  [[case.check]]
  kind   = "ab-active"
  min_px = 8000

# haunted_towers top-down pose pair: under EXTENDED LOD the
# stencil holefill used to paint each far sector's fully-fogged LP
# silhouette wholesale (raw-lodThr distance gate), popping fog-coloured LP
# fringes around the island edges once the camera crossed the fog band.
# Fixed by skipping the fill for HP-bearing sectors under no-lod. Guard:
# holefill on/off must be pixel-identical at the fringing pose.
[[case]]
name   = "haunted-topdown-no-fill-fringes"
level  = "haunted_towers"
pose   = "100234,109750,63909,-1046,992"
lod    = "extended"
mode   = "full"
ab_env = "OPENPETE_TERRAIN_HOLEFILL"
  [[case.check]]
  kind   = "ab-identical"
  max_px = 0

# artisans outer-wall gap (--lod extended only): the level-
# boundary cliff LP (sectors 94/103) sits between HP territory and the
# LP-only outer region; v3's wall rule dropped it (unbacked dmed 117-178)
# leaving a cyclorama channel at the sector boundary.  v4 re-admits wall
# faces whose unbacked span continues into LP-authoritative territory
# (near-noHP rule, <=1200 to a no-HP/force-LP sector's LP).  The channel
# must stay filled and the classifier must stay ACTIVE here.
[[case]]
name  = "artisans-outer-wall-extended-filled"
level = "artisans"
pose  = "30400,127062,11872,-922,66"
lod   = "extended"
mode  = "terrain"
  [[case.check]]
  kind   = "ab-active"
  min_px = 3000
  [[case.check]]
  kind   = "bg-max"
  bbox   = [285, 180, 340, 300]
  max_px = 300

# peace_keepers missing water quad (extended-only visible): a
# 512x512 LP water quad over an authored ONE-CELL hole in the same
# sector's HP mesh measures cov = 27/30 = 0.900 exactly -- knife-edge
# rejected by the 0.9 gate, so under extended LOD (HP + gapfill-LP only)
# the missing HP cell showed cyclorama.  Mid-band [0.9,0.97) faces are
# admitted by the VOID test (an unbacked sample >TOL from ALL other
# geometry with nothing behind it along the winding normal) -- NOT by the
# v5 orientation rules, which the tree-tops case below proved unsafe here.
# The quad must draw (ab-active) and the hole cell must not show sky.
[[case]]
name  = "peacekeepers-water-quad-filled"
level = "peace_keepers"
pose  = "167657,116990,62434,323,438"
lod   = "extended"
mode  = "terrain"
  [[case.check]]
  kind   = "ab-active"
  bbox   = [244, 141, 384, 216]
  min_px = 4000
  [[case.check]]
  kind   = "bg-max"
  bbox   = [250, 145, 380, 212]
  max_px = 100

# cliff_town crest strip: the v9 near-floor fill backstop that served it is
# retired — the strip's sightlines measured as COVERED by authored HP in the
# pure-HP og reference (og with m_LodDistance doubled), i.e. the visible gap
# is a native HP coverage deficit, not missing LP. Tracked as a renderer bug,
# not a fill concern.

# magic_crafters waterfall room: the outside
# waterfall sheet and the room's inner wall are back-to-back surfaces a
# few world units apart -- under emit-all the sheet's BACK-face is
# genuinely nearer and wins the true-Z depth test, punching blue patches
# through the room (PSX hides it via the .s NCLIP cull, which
# native now mirrors exactly: two-half quad acceptance, w3&4
# draw-anyway, straddle bypass).  CULL on-vs-off must differ by the
# punch-through inside its bbox.  The near-band faces carry the authored
# OT slot bias, so with the cull off the back-face loses to the back wall
# and shows only through the right-hand wall (x 517-639); the bbox covers
# that wall.  The ON leg is the shipped mask 3 on the retained terrain
# cache (CACHE_FORCE waives the software-vk exclusion; any other mask
# routes terrain to the CPU walk); the OFF leg, mask 0, is the CPU walk.
# The cache and walk legs at mask 3 are pixel-identical at this pose.
[[case]]
name   = "magiccrafters-waterfall-room-culled"
level  = "magic_crafters"
pose   = "69519,93695,26535,619,26"
mode   = "terrain"
ab_env = "OPENPETE_TERRAIN_CULL"
ab_on  = "3"
pin_env = { OPENPETE_TERRAIN_CACHE_FORCE = "1" }
  [[case.check]]
  kind   = "ab-active"
  min_px = 3960
  bbox   = [520, 55, 639, 300]

# Dragon-rescue cutscene: the cutscene actors
# draw in FRONT of terrain (depth-isolated ACTOR pass, the HUD3D trick;
# moby_native actor_front <- GS_Dragon + g_DragonCutscene.m_State 1..6).
# Delvin's spread wing interpenetrates the town_square tower wall; true
# per-pixel Z amputated it while the PSX's coarse OT bucketing painted it
# over the wall.  bk2 replay (not a freecam pose): the movie walks into
# the rescue; frame 2621 is mid-wing-spread.  ON vs OFF must differ by
# the clipped wing region (calibrated 2171 px at the live frame, 2210 px
# after screenshots became reference-aligned -- ALL inside the
# bbox; the full-frame ON/OFF diff equals the bbox diff).
# NOTE (moby OT-bias): the game's own m_DepthOffset OT pull (mirrored as a
# 128-world-unit-per-slot depth bias, OPENPETE_MOBY_OTBIAS) now paints the wing
# over the tower on its own — in the default config the actor-front pass is
# redundant at this frame and its ON/OFF delta collapses to ~0.  Pin the pull
# OFF here so this case keeps guarding the actor-front MACHINERY in isolation;
# the sibling case below guards the pull itself.
[[case]]
name   = "townsquare-delvin-wing-front"
level  = "town_square"
bk2    = "games/spyro-1/bk2/town-square-delvin-rescue.bk2"
frame  = 2621
mode   = "full"
ab_env = "OPENPETE_ACTOR_FRONT"
pin_env = { OPENPETE_MOBY_OTBIAS = "0" }
  [[case.check]]
  kind   = "ab-active"
  min_px = 1000
  bbox   = [120, 150, 300, 260]

# Delbin pedestal disc: the level authors cut an HP
# ground hole under the platform moby (og's OT order always covered it with the
# disc), and the LP hole-fill used to read those pixels as uncovered and paint
# the LP backing OVER the disc. Fixed structurally: ACTOR opaques stencil-MARK
# coverage and the fill draws after them. Guard: fill on/off must be
# pixel-identical over the disc — the fill may never paint on the moby. A
# regression (fill before actors / marks dropped) re-eats the disc and fires
# this. (Judge in plain vk: the ab pane's lagged path still shows the strip.)
[[case]]
name   = "artisans-delbin-pedestal-fill-neutral"
level  = "artisans"
pose   = "73189,44026,7159,2465,160"
mode   = "full"
ab_env = "OPENPETE_TERRAIN_HOLEFILL"
  [[case.check]]
  kind   = "ab-identical"
  max_px = 50
  bbox   = [400, 190, 640, 340]

# Moby OT-bias pull (m_DepthOffset, record w0 bits 16-23): the .s keys every
# regular/specular moby prim into the world OT at (TR.z_raw>>5) − offset —
# one slot = 128 full-world view-Z units, default offset 4 — so a moby paints
# over terrain up to ~512 units nearer.  The subject is the gold chest beside
# the dragon: toggling the pull flips its edge-vs-tower occlusion band
# (~380 px, solid, >12/channel).  The DRAGON cannot be the subject — cutscene
# actors are ACTOR_FRONT-tagged (category 13) and og-key emission gates on
# category ACTOR, so no pull ever fires for the wing; its wing-over-tower
# look comes from the front pass (townsquare-delvin-wing-front guards that),
# which is pinned OFF here to keep this case about the OT keys alone.
[[case]]
name   = "townsquare-chest-otbias"
level  = "town_square"
bk2    = "games/spyro-1/bk2/town-square-delvin-rescue.bk2"
frame  = 2621
mode   = "full"
ab_env = "OPENPETE_MOBY_OTBIAS"
pin_env = { OPENPETE_ACTOR_FRONT = "0" }
  [[case.check]]
  kind   = "ab-active"
  min_px = 150
  bbox   = [205, 160, 250, 245]

# Dragon-rescue front pass leak under --lod extended:
# the actor front pass used to clear the WHOLE depth buffer, safe only while the
# LOD cull kept the cutscene draw list free of distant level mobys.  Extended LOD
# un-culls them (statues / chests / the level-end vortex + its critters), and the
# whole-frame clear made both their opaque AND transparent faces punch through
# terrain.  Fix: front-pass ONLY the cutscene actors (tagged by pointer match
# against g_DragonCutscene) and clear depth just within THEIR screen bbox
# (rhi_clear_depth_rect_ndc), so every other moby keeps true terrain occlusion.
# Guard: with --lod extended, toggling OPENPETE_ACTOR_FRONT leaves the CRITTER
# region (outside the dragon bbox) pixel-identical — the front pass no longer
# reaches it.  A regression to the whole-frame clear re-leaks ~311 px here (the
# dragon's own front-pass delta sits at x>=446, outside this bbox).  Companion to
# townsquare-delvin-wing-front, which proves the pass still fires (the wing draws
# over the tower).  --lod extended comes from the .bk2.args sidecar (pinned too).
# Repro: alban-rescue.bk2 @ f1756.
[[case]]
name   = "dark-hollow-alban-rescue-nolod-noleak"
level  = "dark_hollow"
lod    = "extended"
bk2    = "games/spyro-1/bk2/alban-rescue.bk2"
frame  = 1756
mode   = "full"
ab_env = "OPENPETE_ACTOR_FRONT"
  [[case.check]]
  kind   = "ab-identical"
  max_px = 100
  bbox   = [60, 300, 340, 430]

# Semi-transparent terrain unoccluded during a dragon-rescue cutscene: the
# front pass used to clear depth over the cutscene
# actors' whole screen BBOX, and the ALPHA / ADDITIVE / SUBTRACT-WORLD groups
# draw after it -- so every transparent face inside that rect tested wiped depth
# and passed.  In Dream Weavers that painted additive terrain slabs buried
# behind the ground over the ground AND over the rescued dragon (~14k px).
# Fixed structurally: the actors PUNCH depth per pixel (colour-write-off twins,
# depth compare ALWAYS) instead of clearing a rect, so nothing outside their own
# silhouettes ever loses its depth.  Guard: toggling OPENPETE_ACTOR_FRONT leaves
# the ground left of the dragon pixel-identical -- the front pass may not reach
# it.  A regression to the rect clear re-leaks ~10.4k px in this bbox; the
# dragon's own front-pass delta sits at x>=414, outside it.  Companion to
# townsquare-delvin-wing-front (the pass still fires) and
# dark-hollow-alban-rescue-nolod-noleak (opaque mobys at extended LOD).
[[case]]
name   = "dream-weavers-lateef-transparent-terrain-noleak"
level  = "dream_weavers"
bk2    = "games/spyro-1/bk2/dream-weavers-lateef-rescue.bk2"
frame  = 2755
mode   = "full"
ab_env = "OPENPETE_ACTOR_FRONT"
  [[case.check]]
  kind   = "ab-identical"
  max_px = 100
  bbox   = [236, 240, 400, 410]
