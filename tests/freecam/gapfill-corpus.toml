# haunted_towers top-down pose pair (found in testing): under EXTENDED LOD the
# stencil holefill used to paint each far sector's fully-fogged LP
# silhouette wholesale (raw-lodThr distance gate), popping fog-coloured LP
# fringes around the island edges once the camera crossed the fog band.
# Fixed by skipping the fill for HP-bearing sectors under no-lod. Guard:
# holefill on/off must be pixel-identical at the fringing pose.
[[case]]
name   = "haunted-topdown-no-fill-fringes"
level  = "haunted_towers"
pose   = "100234,109750,63909,-1046,992"
lod    = "extended"
mode   = "full"
ab_env = "OPENPETE_TERRAIN_HOLEFILL"
  [[case.check]]
  kind   = "ab-identical"
  max_px = 0

# artisans outer-wall gap (found in testing, --lod extended only): the level-
# boundary cliff LP (sectors 94/103) sits between HP territory and the
# LP-only outer region; v3's wall rule dropped it (unbacked dmed 117-178)
# leaving a cyclorama channel at the sector boundary.  v4 re-admits wall
# faces whose unbacked span continues into LP-authoritative territory
# (near-noHP rule, <=1200 to a no-HP/force-LP sector's LP).  The channel
# must stay filled and the classifier must stay ACTIVE here.
[[case]]
name  = "artisans-outer-wall-extended-filled"
level = "artisans"
pose  = "30400,127062,11872,-922,66"
lod   = "extended"
mode  = "terrain"
  [[case.check]]
  kind   = "ab-active"
  min_px = 3000
  [[case.check]]
  kind   = "bg-max"
  bbox   = [285, 180, 340, 300]
  max_px = 300

# magic_crafters ceiling skin (found in testing): the coarse LP room lids
# (z=1770 flat quads, signed n_z=+1.00, unbacked dmed 103-128 -- the exact
# sunny-skin band) were admitted by v4's UNSIGNED horizontal rule AND the
# near-noHP rule, painting a flat slab across the ornate HP ceiling.  v5:
# the horizontal exemption is floor-only (game winding: up-facing floors
# have n_z < 0; all 197 needed horizontal fillers in artisans/gnorc are
# n_z <= -0.85) and near-noHP requires wall-like orientation.  Interior
# room -- NO fill may ever appear in this view.
[[case]]
name  = "magic-ceiling-no-skin"
level = "magic_crafters"
pose  = "63187,89684,26826,4146,-159"
mode  = "terrain"
  [[case.check]]
  kind   = "ab-identical"
  max_px = 0

[[case]]
name  = "magic-ceiling-no-skin-extended"
level = "magic_crafters"
pose  = "63187,89684,26826,4146,-159"
lod   = "extended"
mode  = "terrain"
  [[case.check]]
  kind   = "ab-identical"
  max_px = 0

# peace_keepers missing water quad (found in testing, extended-only visible): a
# 512x512 LP water quad over an authored ONE-CELL hole in the same
# sector's HP mesh measures cov = 27/30 = 0.900 exactly -- knife-edge
# rejected by the 0.9 gate, so under extended LOD (HP + gapfill-LP only)
# the missing HP cell showed cyclorama.  Mid-band [0.9,0.97) faces are
# admitted by the VOID test (an unbacked sample >TOL from ALL other
# geometry with nothing behind it along the winding normal) -- NOT by the
# v5 orientation rules, which the tree-tops case below proved unsafe here.
# The quad must draw (ab-active) and the hole cell must not show sky.
[[case]]
name  = "peacekeepers-water-quad-filled"
level = "peace_keepers"
pose  = "167657,116990,62434,323,438"
lod   = "extended"
mode  = "terrain"
  [[case.check]]
  kind   = "ab-active"
  bbox   = [244, 141, 384, 216]
  min_px = 4000
  [[case.check]]
  kind   = "bg-max"
  bbox   = [250, 145, 380, 212]
  max_px = 100

# tree_tops mid-band poke-through guard (a v6 regression found in testing): three
# tree_tops LP faces sit in the [0.9,0.97) cov band (s47 branch-floor
# sliver + s155/s180 wall slivers).  Admitting them (as the plain cov-gate
# widening did) makes the s47 sliver POKE THROUGH the trunk HP at the
# default camera -- every unbacked sample touches other geometry (d_any=0)
# or has the trunk 31 units behind it, so the void test must reject all
# three.  Default camera, gapfill on/off must be pixel-identical.
[[case]]
name  = "treetops-midband-no-pokethrough"
level = "tree_tops"
  [[case.check]]
  kind   = "ab-identical"
  max_px = 0

# artisans grass poke-through (found in testing): LP floor tri s12 f#21 slices
# through the HP grass mound by the stone platform -- admitted by the bare
# floor rule (cov<0.9, nz=-0.99), its "void" samples are UNDER the grass
# surface (inside the hill: geometrically empty, visually solid).  v8:
# floor-rule admissions also require the void test, and the void test is
# TWO-SIDED (both normal directions clear within 256) -- the front ray
# from an under-grass sample hits the surface above.  Gapfill on/off must
# be pixel-identical at this pose.
[[case]]
name  = "artisans-grass-no-pokethrough"
level = "artisans"
pose  = "86800,69542,10184,243,447"
mode  = "terrain"
  [[case.check]]
  kind   = "ab-identical"
  max_px = 0

# cliff_town crest-strip floor gap (found in testing): fully-near HP sectors'
# dropped LP floors cover sightlines NOTHING else covers (ground strips
# past the HP mesh edge; cov reads 1.0 because samples hug the HP cliff
# within TOL -- a non-local class no point rule can see).  v9: near-floor
# fill backstop -- such sectors' LP FLOORS feed the stencil-gated
# WORLD_FILL pass (paints only uncovered pixels; walls/arches stay out).
# Fills fully under extended LOD (no fog -> true stencil-0); under
# original LOD the hole pixels are covered by fully-fogged far-LP WORLD
# geometry, so the patch renders fogged (PSX-faithful) -- documented
# residual.  DEFAULT OFF: the backstop cannot separate interior holes
# from coarse-LP silhouette overhangs (haunted island rims / sunny
# horizon: 1-2px terrain slivers on sky), so it is opt-in
# (OPENPETE_TERRAIN_FILLNEAR=1).  Guard: the mechanism must keep
# filling the strip under extended when enabled.
[[case]]
name   = "clifftown-crest-strip-filled-extended"
level  = "cliff_town"
pose   = "57191,104992,33420,1726,698"
lod    = "extended"
mode   = "terrain"
ab_env = "OPENPETE_TERRAIN_FILLNEAR"
  [[case.check]]
  kind   = "ab-active"
  bbox   = [209, 156, 503, 284]
  min_px = 8000
  [[case.check]]
  kind   = "bg-max"
  bbox   = [220, 165, 490, 275]
  max_px = 200

# Near-floor backstop blast-radius bound at the attract-demo gameplay
# cameras: FILLNEAR on/off may differ only by small seam fills (tick 2694:
# 154 px = the castle dome's truncated tip completed + a grass-on-grass
# sliver; ticks 4888/9775 = 0, portal masks untouched).
[[case]]
name   = "attract-demo-fillnear-bounded"
ticks  = [2694, 4888, 9775]
ab_env = "OPENPETE_TERRAIN_FILLNEAR"
  [[case.check]]
  kind   = "ab-identical"
  max_px = 300
