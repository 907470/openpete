# magic_crafters waterfall room (found in testing, 2026-07-09): the outside
# waterfall sheet and the room's inner wall are back-to-back surfaces a
# few world units apart -- under emit-all the sheet's BACK-face is
# genuinely nearer and wins the true-Z depth test, punching a blue
# column through the room (PSX hides it via the .s NCLIP cull, which
# native now mirrors exactly: two-half quad acceptance, w3&4
# draw-anyway, straddle bypass).  CULL on-vs-off must differ by the
# column (feature active) inside its bbox and nowhere else.
# pin_env: the face-mean depth flatten (OPENPETE_TERRAIN_OTFLAT) resolves the
# column-vs-wall z-fight this case's 4000-px calibration rode on (uncalled
# column pixels now lose deterministically), shrinking the on/off footprint to
# ~1400 px. Pin it off so the guard keeps its original calibration and stays a
# sensitive detector of the CULL feature dying.
[[case]]
name   = "magiccrafters-waterfall-room-culled"
level  = "magic_crafters"
pose   = "69519,93695,26535,619,26"
mode   = "terrain"
ab_env = "OPENPETE_TERRAIN_CULL"
pin_env = { OPENPETE_TERRAIN_OTFLAT = "0" }
  [[case.check]]
  kind   = "ab-active"
  min_px = 4000
  bbox   = [230, 45, 340, 285]

# Dragon-rescue cutscene (found in testing, 2026-07-10): the cutscene actors
# draw in FRONT of terrain (depth-isolated ACTOR pass, the HUD3D trick;
# moby_native actor_front <- GS_Dragon + g_DragonCutscene.m_State 1..6).
# Delvin's spread wing interpenetrates the town_square tower wall; true
# per-pixel Z amputated it while the PSX's coarse OT bucketing painted it
# over the wall.  bk2 replay (not a freecam pose): the movie walks into
# the rescue; frame 2621 is mid-wing-spread.  ON vs OFF must differ by
# the clipped wing region (calibrated 2171 px at the live frame, 2210 px
# after screenshots became reference-aligned 2026-07-10 -- ALL inside the
# bbox; the full-frame ON/OFF diff equals the bbox diff).
# NOTE (moby OT-bias): the game's own m_DepthOffset OT pull (mirrored as a
# 128-world-unit-per-slot depth bias, OPENPETE_MOBY_OTBIAS) now paints the wing
# over the tower on its own — in the default config the actor-front pass is
# redundant at this frame and its ON/OFF delta collapses to ~0.  Pin the pull
# OFF here so this case keeps guarding the actor-front MACHINERY in isolation;
# the sibling case below guards the pull itself.
[[case]]
name   = "townsquare-delvin-wing-front"
level  = "town_square"
bk2    = "games/spyro-1/bk2/town-square-delvin-rescue.bk2"
frame  = 2621
mode   = "full"
ab_env = "OPENPETE_ACTOR_FRONT"
pin_env = { OPENPETE_MOBY_OTBIAS = "0" }
  [[case.check]]
  kind   = "ab-active"
  min_px = 1000
  bbox   = [120, 150, 300, 260]

# Delbin pedestal disc (user repro, 2026-07-17): the flat platform moby sits
# interpenetrating a grazing ground face; the .s sorts that face at its corner
# MEAN so the disc paints whole over it. The face-mean depth clamp
# (OPENPETE_TERRAIN_OTFLAT) is what renders the disc's left rim here; toggling
# it must flip those pixels. (The ab renderer's comparison pane draws the
# native scene through a lagged path and still shows the strip — this case
# renders plain vk, the path players see.)
[[case]]
name   = "artisans-delbin-pedestal-otflat"
level  = "artisans"
pose   = "73189,44026,7159,2465,160"
mode   = "full"
ab_env = "OPENPETE_TERRAIN_OTFLAT"
  [[case.check]]
  kind   = "ab-active"
  min_px = 600
  bbox   = [400, 190, 640, 340]

# Moby OT-bias pull (m_DepthOffset, record w0 bits 16-23): the .s keys every
# regular/specular moby prim into the world OT at (TR.z_raw>>5) − offset —
# one slot = 128 full-world view-Z units, default offset 4 — so a moby paints
# over terrain up to ~512 units nearer (flat pedestal discs on the ground, the
# rescue dragon's wing in the tower).  With the actor-front pass pinned OFF,
# toggling the pull must flip the wing-vs-tower verdict in the same bbox.
[[case]]
name   = "townsquare-delvin-wing-otbias"
level  = "town_square"
bk2    = "games/spyro-1/bk2/town-square-delvin-rescue.bk2"
frame  = 2621
mode   = "full"
ab_env = "OPENPETE_MOBY_OTBIAS"
pin_env = { OPENPETE_ACTOR_FRONT = "0" }
  [[case.check]]
  kind   = "ab-active"
  min_px = 1000
  bbox   = [120, 150, 300, 260]

# Dragon-rescue front pass leak under --lod extended (found in testing, 2026-07-14):
# the actor front pass used to clear the WHOLE depth buffer, safe only while the
# LOD cull kept the cutscene draw list free of distant level mobys.  Extended LOD
# un-culls them (statues / chests / the level-end vortex + its critters), and the
# whole-frame clear made both their opaque AND transparent faces punch through
# terrain.  Fix: front-pass ONLY the cutscene actors (tagged by pointer match
# against g_DragonCutscene) and clear depth just within THEIR screen bbox
# (rhi_clear_depth_rect_ndc), so every other moby keeps true terrain occlusion.
# Guard: with --lod extended, toggling OPENPETE_ACTOR_FRONT leaves the CRITTER
# region (outside the dragon bbox) pixel-identical — the front pass no longer
# reaches it.  A regression to the whole-frame clear re-leaks ~311 px here (the
# dragon's own front-pass delta sits at x>=446, outside this bbox).  Companion to
# townsquare-delvin-wing-front, which proves the pass still fires (the wing draws
# over the tower).  --lod extended comes from the .bk2.args sidecar (pinned too).
# Repro: alban-rescue.bk2 @ f1756.
[[case]]
name   = "dark-hollow-alban-rescue-nolod-noleak"
level  = "dark_hollow"
lod    = "extended"
bk2    = "games/spyro-1/bk2/alban-rescue.bk2"
frame  = 1756
mode   = "full"
ab_env = "OPENPETE_ACTOR_FRONT"
  [[case.check]]
  kind   = "ab-identical"
  max_px = 100
  bbox   = [60, 300, 340, 430]
